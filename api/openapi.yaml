        repair (auto, or a default that is auto) when it is not on already is switching unattended deployment on: only an
        Administrator's browser session with a fresh step-up may (403 ALC-AUTH-0003 without the step-up, 403 ALC-AUTH-0002
        for anyone else) and the license must allow changes. Any choice clears a back-off. 409 ALC-DEP-0029 when the
        location follows no binding. The body is {"mode": ...} exactly (400 otherwise; 422 for an unknown mode), at most
