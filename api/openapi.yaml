    post:
      operationId: createKeyVault
      summary: Add an Azure Key Vault (counts against the license; Alice signs in and reaches the vault before anything is stored)
      description: >-
        auth is certificate (recommended: certificate_pem with private_key_pem, or pfx_base64 with pfx_password),
        client_secret (client_secret) or managed_identity (no secret; Azure virtual machines only). vault_url is a public-cloud
        vault address (https://name.vault.azure.net, or just the name); any other text is 422 validation.pattern on
        vault_url. tenant_id and client_id are GUIDs. Keys are matched exactly (lower case) and each may appear once; anything else is 400. The
        body is limited to 768 KiB (413 ALC-SYS-0007). The secret fields exist in this request only: no answer, error, log or audit
        row repeats them. Alice refuses to add the vault, storing nothing and using no license slot, when the first call to
        the vault fails, with the closed code of the failure (502 ALC-AKV-0001 sign-in refused, 0002 expired, 0005 vault not
        found, 0006 unreachable, 0009 clock, 0010 managed identity, 0011 address not allowed, 0012 TLS) and its params
