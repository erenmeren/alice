        never both. Keys are matched exactly (lower case) and each may appear once; anything else is 400. The key is stored sealed and is never returned by any operation; the answer carries the stored
        certificate (public data) and the warnings that did not block it. The body is limited to 768 KiB (413
        ALC-SYS-0007; each field at most 256 KiB). Refusals: 422 ALC-CRT-0001..0007 (unreadable, key mismatch,
        expired, encrypted key, wrong PFX password, weak, unsupported key), 422 validation.failed (field errors,
        for example validation.key_in_certificate when a private key is pasted into certificate_pem), 409
