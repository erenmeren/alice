        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/incidents/{id}/revoke-now:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: revokeIncidentNow
      summary: Revoke the compromised certificate now, whatever the deployments
      description: >-
        The compromised ACME versions are revoked (keyCompromise) at the next run of incident.advance, without waiting for every location to be verified (audit incident.revoke_now). 409 ALC-INC-0004 for a certificate Alice did not order over ACME, 409 ALC-INC-0002 when it is revoked already or the incident is finished. Administrator with a fresh step-up, never an API token; at most 10 a minute per user. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: certificates.incident
      x-scope: cross
      responses:
        "200":
          description: The incident with its locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/incidents/{id}/replacement:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: chooseIncidentReplacement
      summary: Choose the replacement of a certificate from another source
      description: >-
        A certificate Alice holds the private key of, made with another key, neither revoked nor compromised and valid now (422 ALC-INC-0003 otherwise); the incident then deploys it (audit incident.replacement_chosen). 409 ALC-INC-0002 for an ACME incident or one that does not wait for a replacement. Administrator with a fresh step-up, never an API token. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: certificates.incident
      x-scope: cross
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentReplacement" }
      responses:
        "200":
          description: The incident with its locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/incidents/{id}/close:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: closeIncident
      summary: Close an incident as it stands
      description: >-
        Finishes the incident (closed; audit incident.closed): Alice requests no more deployments and revokes nothing more for it; deployments already requested go on. 409 ALC-INC-0002 for a finished incident. Administrator with a fresh step-up, never an API token; available in every license state.
      x-permission: certificates.incident
      x-scope: cross
      responses:
        "200":
          description: The incident with its locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/summary:
    get:
      operationId: getDiscoverySummary
      summary: The network discovery metric of the Overview
      description: >-
        Unmanaged certificates (leaf certificates Alice has no record of) that an endpoint which is not gone presents or
        last presented, how many of them expire within 30 days (not expired yet), the scan scopes and when a scan last
        finished. Index-backed counts. discovery.view: every role in a browser; an API token needs the operate scope (read
        tokens never read the network map).
      x-permission: discovery.view
      x-scope: any
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverySummary" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/scopes:
    get:
      operationId: listDiscoveryScopes
      summary: Scan scopes, oldest first, in pages
      description: discovery.view (an API token needs the operate scope).
      x-permission: discovery.view
      x-scope: list
      parameters:
        - { name: service_id, in: query, description: "R49: rows owned by these services (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: environment_id, in: query, description: "R49: rows owned by services of these environments (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScopePage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDiscoveryScope
      summary: Define a scan scope (nothing is scanned until a scan is started)
      description: >-
        Validated against the settings at save time: every address and range must lie inside the allowed scan networks
        (none set: 422 ALC-DSC-0002), and is refused when every address of it is one Alice never scans or is excluded;
        sizes (422 ALC-DSC-0001), entries, ports, SNI names, rate and concurrency (422 ALC-DSC-0003), the schedule (422
        ALC-DSC-0009), the name (409 ALC-DSC-0011). Every host name is looked up once with the system resolver (5 seconds
        each): a name with no address is 422 ALC-DSC-0010, which names the entry (params field and index) and never an
        address. At most 16 host names per save (422 validation error of entries); when the name server does not answer all
        of them within the request's budget, 503 ALC-SYS-0002 with Retry-After (nothing saved: a slow name server is not a
        missing name). The answer's ETag is the scope's version. An Administrator's browser session with a fresh step-up,
        never an API token; at most 30 a minute per user (with PATCH). Works while the license is locked.
      x-permission: discovery.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryScopeCreate" }
      responses:
        "201":
          description: The scope
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScope" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/scopes/preview:
    post:
      operationId: previewDiscoveryScope
      summary: The size of a scope as typed (no name is looked up, nothing is dialed, nothing is stored)
      description: >-
        The body of a new scope (name optional). Answers the addresses of the address and range entries, those of them the
        exclusions remove, the host names (each counted as one address), ports, SNI names, the endpoints of one scan and the
        built-in exclusions the ranges overlap. The refusals of a save except ALC-DSC-0010 and ALC-DSC-0011. An
        Administrator's browser session with a fresh step-up; at most 60 a minute per user, in a budget of its own.
      x-permission: discovery.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryScopePatch" }
      responses:
        "200":
          description: The size
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/scopes/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getDiscoveryScope
      summary: One scan scope with its scan in flight and its last finished scan
      description: The ETag is the scope's version. 404 ALC-DSC-0008 for a deleted or unknown scope.
      x-permission: discovery.view
      x-scope: resource
      responses:
        "200":
          description: The scope
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScope" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateDiscoveryScope
      summary: Change a scan scope (absent fields stay)
      description: >-
        If-Match (optional) must be the scope's version (412 otherwise). The four schedule fields are one group: sending any
        of them replaces the whole schedule (an absent one is 0 or "": no schedule, no window, UTC). An empty body ({}) is
        refused with 422 (field body) and changes nothing. The result is validated like a new scope; only the host names it
        adds are looked up (at most 16; 503 ALC-SYS-0002 as on create). Endpoints that the changed scope no longer covers
        are marked gone at once; switching the scope off, or changing its entries, ports, SNI names or exclusions, asks its
        scan in flight to stop. Recorded as discovery.scope.updated. An Administrator's browser session with a fresh step-up; at
        most 30 a minute per user. Works while the license is locked.
      x-permission: discovery.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryScopePatch" }
      responses:
        "200":
          description: The scope
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScope" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDiscoveryScope
      summary: Delete a scan scope (its name is free again; its scan in flight is asked to stop; retention removes its endpoints)
      description: >-
        If-Match (optional) must be the scope's version. Recorded as discovery.scope.deleted. An Administrator's browser
        session with a fresh step-up. Works while the license is locked.
      x-permission: discovery.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: false, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/scopes/{id}/scans:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: startDiscoveryScan
      summary: Start a scan of the scope (the netdisco.scan job runs it)
      description: >-
        No body: a scan is only ever of a scope, never of addresses given here. The scan, its job and the
        discovery.scan.started audit row are written together. 409 ALC-DSC-0004 while the scope has a scan queued or running,
        409 ALC-DSC-0007 while two scans are queued or running anywhere (refused, not queued; retryable with Retry-After),
        409 ALC-DSC-0013 for a scope that is switched off, 404 ALC-DSC-0008 for a deleted or unknown scope. At most 10 a
        minute per user or token (with cancel). Refused with 403 ALC-LIC-0001 while the license is locked (nothing queued).
      x-permission: discovery.operate
      x-scope: resource
      responses:
        "202":
          description: The scan (queued)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScan" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/scans:
    get:
      operationId: listDiscoveryScans
      summary: Scans, newest first, in pages
      x-permission: discovery.view
      x-scope: list
      parameters:
        - { name: scope_id, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [queued, running, done, cancelled, timed_out, failed] } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScanPage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/scans/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getDiscoveryScan
      summary: One scan
      x-permission: discovery.view
      x-scope: resource
      responses:
        "200":
          description: The scan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScan" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/scans/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: cancelDiscoveryScan
      summary: Ask a scan to stop
      description: >-
        No body. Sets the flag the scan's workers poll: the scan ends as cancelled (ALC-DSC-0005 as its error_code) with the
        results found until then. Idempotent: a scan already asked to stop, or already over, is answered as it is and nothing
        is recorded; the first request is recorded as discovery.scan.cancelled. At most 10 a minute per user or token (with
        start). Works while the license is locked.
      x-permission: discovery.operate
      x-scope: resource
      responses:
        "200":
          description: The scan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScan" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/certificates:
    get:
      operationId: listDiscoveredCertificates
      summary: Discovered leaf certificates, soonest expiry first, in pages
      description: >-
        status unmanaged (Alice has no record of this exact certificate), managed (Alice has it on a live location of a
        live server), known (Alice has it, on no live location), or all (the default). q is a part of the subject CN or of a
        SAN (case-insensitive; % and _ are ordinary characters). expiring_within_days selects certificates that are not
        expired and expire within that many days. current=true keeps only the certificates still found (an endpoint that
        is not gone presents or last presented it), the definition of the summary's unmanaged counts; without it a
        certificate stays listed until retention removes it.
      x-permission: discovery.view
      x-scope: list
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, unmanaged, managed, known] } }
        - { name: expiring_within_days, in: query, schema: { type: integer, minimum: 1, maximum: 3650 } }
        - { name: expired, in: query, schema: { type: boolean } }
        - { name: self_signed, in: query, schema: { type: boolean } }
        - { name: current, in: query, schema: { type: boolean }, description: "true: only certificates that some endpoint which is not gone presents or last presented (still found; the summary's definition)" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: scope_id, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredCertificatePage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/certificates/export:
    get:
      operationId: exportDiscoveredCertificates
      summary: The discovered certificate list as a CSV file, with the list's filters (no cursor, no limit)
      description: >-
        UTF-8 with a byte order mark, the header row
        fingerprint_sha256,subject_cn,sans,issuer_cn,not_before,not_after,days_left,key_algorithm,self_signed,status,managed_certificate_id,endpoint_count,seen_on_count,first_seen,last_seen
        (SANs separated by a space, times RFC 3339 UTC), then one row per certificate. Cells that start with =, +, -, @, a
        tab, a carriage return or a line feed get a leading apostrophe. Recorded in the audit log (discovery.export with the
        filters and the row count) before the first byte. At most 50,000 rows (409 ALC-RPT-0001, nothing written); one export
        of any kind at a time per person (409 ALC-RPT-0004, retryable, Retry-After); at most 10 exports a minute per user or
        token (429). cursor or limit is refused with 422; HEAD with 405. Works while the license is locked.
      x-permission: discovery.view
      x-scope: list
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, unmanaged, managed, known] } }
        - { name: expiring_within_days, in: query, schema: { type: integer, minimum: 1, maximum: 3650 } }
        - { name: expired, in: query, schema: { type: boolean } }
        - { name: self_signed, in: query, schema: { type: boolean } }
        - { name: current, in: query, schema: { type: boolean }, description: "true: only certificates that some endpoint which is not gone presents or last presented (still found; the summary's definition)" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: scope_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: >-
            The file, with Content-Disposition: attachment; filename="alice-discovered-certificates-<yyyy-mm-dd>.csv" and
            Cache-Control: no-store.
          content:
            text/csv:
              schema: { type: string }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/certificates/{fingerprint}:
    parameters:
      - { name: fingerprint, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    get:
      operationId: getDiscoveredCertificate
      summary: One discovered leaf certificate with the endpoints presenting it (at most 200)
      x-permission: discovery.view
      x-scope: resource
      responses:
        "200":
          description: The certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredCertificate" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/endpoints:
    get:
      operationId: listDiscoveredEndpoints
      summary: Discovered endpoints, in pages
      description: >-
        Inside a scope (scope_id) in the order of its unique key (address, port, SNI name); across scopes by address, port,
        SNI name and id. fingerprint selects the endpoints presenting one leaf. target is the live server whose address or
        host name is the endpoint's (null when none).
      x-permission: discovery.view
      x-scope: list
      parameters:
        - { name: scope_id, in: query, schema: { type: string, format: uuid } }
        - { name: fingerprint, in: query, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredEndpointPage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/discovery/settings:
    get:
      operationId: getDiscoverySettings
      summary: The discovery settings
      description: >-
        scanning_enabled is false while no allowed scan network is set: nothing may be scanned then. builtin_exclusions are
        the ranges Alice never scans whatever the settings say.
      x-permission: discovery.view
      x-scope: platform
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverySettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putDiscoverySettings
      summary: Replace the discovery settings
      description: >-
        Every field is required. The lists hold IP addresses and CIDR ranges (no host names), at most 256 each (more is 400 with the field's too_long
        validation error), stored in their canonical form; an element that does not parse is 422 ALC-DSC-0003 (params field allowed_networks or
        global_exclusions and the element's index); retention_days is 7 to 730. An empty allowed_networks is valid and means
        nothing may be scanned. Recorded as discovery.exclusions.updated with both lists and their counts. An
        Administrator's browser session with a fresh step-up, never an API token. Works while the license is locked.
      x-permission: discovery.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoverySettingsInput" }
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverySettings" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: Environment labels of services (seeded production, staging, test, development), in their order
      description: >-
        The UI shows a seeded key's name in the reader's language until an Administrator renames it. services is how many
        services carry the environment (R49).
      x-permission: read
      x-scope: any
      responses:
        "200":
          description: The environments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createEnvironment
      summary: Add an environment (at most 50)
      description: >-
        key is fixed once made (lower-case letters, digits and hyphens, a letter first, at most 32 characters). 409
        ALC-SVC-0017 for a key in use; 422 validation (validation.out_of_range on key when 50 exist). Administrator with a
        fresh step-up, never an API token; works in lock.
      x-permission: services.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentCreate" }
      responses:
        "201":
          description: The environment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/environments/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      operationId: updateEnvironment
      summary: Rename or reorder an environment
      description: >-
        If-Match names the version read (412 ALC-SYS-0008 otherwise). Administrator with a fresh step-up, never an API token.
      x-permission: services.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentPatch" }
      responses:
        "200":
          description: The environment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEnvironment
      summary: Delete an environment no service and no role binding uses
      description: >-
        409 ALC-SVC-0016 while a service or a role binding uses it; 412 for a stale If-Match. Administrator with a fresh
        step-up, never an API token.
      x-permission: services.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/services:
    get:
      operationId: listServices
      summary: Services (the Default service first, then by name) with what each owns
      description: >-
        A service groups servers, Key Vaults, certificates, signing requests, ACME certificates, SSH keys and scan scopes
        (R49). service_id and environment_id (each repeatable) narrow the list.
      x-permission: read
      x-scope: list
      parameters:
        - { name: service_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: environment_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
      responses:
        "200":
          description: The services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createService
      summary: Add a service (at most 500) with its first policy version (the empty policy)
      description: >-
        Names are unique without regard to letter case (409 ALC-SVC-0002). An unknown environment_id is 422 validation.required
        on the field. Administrator with a fresh step-up, never an API token; works in lock.
      x-permission: services.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses:
        "201":
          description: The service
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/services/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getService
      summary: One service with what it owns
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The service
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateService
      summary: Change a service's name, description or environment
      description: >-
        environment_id null removes the environment. Changing the environment changes which environment role bindings reach
        the service; it is audited with both environments. The service a resource belongs to is never changed here (POST
        /api/v1/services/{id}/actions/assign). If-Match names the version read (412 otherwise). Administrator with a fresh
        step-up, never an API token.
      x-permission: services.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePatch" }
      responses:
        "200":
          description: The service
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteService
      summary: Delete a service that owns nothing
      description: >-
        409 ALC-SVC-0004 for the Default service; 409 ALC-SVC-0003 while it owns a live resource (params: the count of each
        kind). Its deleted servers, ACME certificates and scan scopes are history and move to the Default service; its trusts
        and policy history go with it. Administrator with a fresh step-up, never an API token.
      x-permission: services.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/services/{id}/policy:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getServicePolicy
      summary: The service's current policy (version 1 is the empty policy {"schema":1})
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePolicy" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putServicePolicy
      summary: Save a new version of the service's policy
      description: >-
        body is the whole policy document (schema 1, R55); version is the policy version the caller read (409
        ALC-SVC-0010 when it is no longer the current one). Every field is optional and an empty list is no constraint.
        An unknown field is 400; a reserved key (verification, drift, canary, windows, thresholds) is 422 ALC-SVC-0015; an
        invalid value is 422 validation on body.<path>. Changing domains needs a global grant (403 ALC-SVC-0011 for an
        Administrator of this service only). A document equal to the current one stores nothing and answers the current
        version. Audited service.policy_changed with the changed top-level keys. Administrator of the service with a fresh
        step-up, never an API token; works in lock.
      x-permission: services.policy
      x-scope: resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePolicyUpdate" }
      responses:
        "200":
          description: The current policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/services/{id}/policy/versions:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listServicePolicyVersions
      summary: Every version of the service's policy, newest first
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePolicyList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/services/{id}/owners:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getServiceOwners
      summary: The service's owner team and the service's version
      description: >-
        Owners are people and directory groups (R56, design §7.1). Ownership gives no access: owners receive the service's
        e-mails (an enabled person with an address; the enabled members of a group seen in it at their last sign-in, with an
        address) and are shown as responsible. reaches_service (whether a role of the owner reaches the service) is answered
        to a caller holding users.read on all services only.
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The owners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOwners" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putServiceOwners
      summary: Replace the service's owner team
      description: >-
        owners is the whole new team (at most 50 entries, each exactly one of user_id and directory_group_id, each once);
        version is the service's version the caller read (409 ALC-SVC-0010 when the service changed since). An automation
        account is 422 ALC-SVC-0019; an unknown person or group is 422 validation on owners.N. A change raises the service's
        version and is audited service.owners_changed with the owners added and removed; the same team changes nothing.
        Administrator of all services with a fresh step-up, never an API token; works in lock.
      x-permission: services.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceOwnersUpdate" }
      responses:
        "200":
          description: The owners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOwners" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/services/{id}/actions/assign:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: assignToService
      summary: Move resources to this service
      description: >-
        Moves up to 500 servers or Key Vaults (target), certificates, signing requests (csr), SSH keys, ACME certificates and
        scan scopes. Each row is locked while it moves; bindings stay in place. untrusted lists the binding locations that
        cross services without a trust after the move: their automatic deployments stop there, and a person's deployment is
        refused (409 ALC-SVC-0007), until a trust is made. With dry_run=true nothing changes and nothing is audited. An
        unknown, deleted or repeated resource is 422 validation on resources.N. Audited once (service.assigned) with every
        resource moved. Administrator with a fresh step-up, never an API token; works in lock.
      x-permission: services.assign
      x-scope: cross
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRequest" }
      responses:
        "200":
          description: What the move does (or would do)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignResult" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/service-trusts:
    get:
      operationId: listServiceTrusts
      summary: Trusts between services (with service_id, those with the service on either side)
      x-permission: read
      x-scope: list
      parameters:
        - { name: service_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The trusts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceTrustList" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createServiceTrust
      summary: The target service accepts certificates and SSH keys owned by the source service
      description: >-
        Directed: a deployment, a Key Vault or ACME binding, an import into a Key Vault or an SSH key deploy from the source
        service to a server or a Key Vault of the target service is allowed from then on. 409 ALC-SVC-0018 when it exists; 422
        validation for the same service twice or an unknown one. At most 200 trusts per service. Administrator with a fresh
        step-up, never an API token.
      x-permission: services.trust
      x-scope: cross
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceTrustCreate" }
      responses:
        "201":
          description: The trust
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceTrust" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/service-trusts/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: deleteServiceTrust
      summary: Remove a trust
      description: >-
        Deployments already made stay; the next deployment from the source to the target is refused (a person's with 409
        ALC-SVC-0007; the deployment engine's first send and the automatic deployments with the reason service.untrusted, and
        the bindings are marked so). Administrator with a fresh step-up, never an API token.
      x-permission: services.trust
      x-scope: cross
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyID:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CertificateID:
      name: certificate_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionID:
      name: version_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportID:
      name: import_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationID:
      name: location_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    StatusOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, const: ok }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    EnvironmentRef:
      type: [object, "null"]
      required: [id, key, name]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
    ServiceRef:
      type: object
      description: >-
        The service that owns a row (R49): id, name and environment; or, for a service outside the caller's reach (a person
        with role bindings, R49 Phase 2), {"outside": true} alone.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentRef" }
        outside: { type: boolean, const: true }
    Environment:
      type: object
      required: [id, key, name, sort, version, services, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        sort: { type: integer }
        version: { type: integer, minimum: 1 }
        services: { type: integer, description: How many services carry it }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Environment" } }
    EnvironmentCreate:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$", examples: [qa] }
        name: { type: string, minLength: 1, maxLength: 60, examples: [QA] }
        sort: { type: integer, minimum: 0, maximum: 32767, default: 0 }
    EnvironmentPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60, examples: [Quality assurance] }
        sort: { type: integer, minimum: 0, maximum: 32767 }
    ServiceCounts:
      type: object
      required: [servers, key_vaults, certificates, signing_requests, acme_certificates, ssh_keys, discovery_scopes]
      properties:
        servers: { type: integer }
        key_vaults: { type: integer }
        certificates: { type: integer }
        signing_requests: { type: integer }
        acme_certificates: { type: integer }
        ssh_keys: { type: integer }
        discovery_scopes: { type: integer }
    Service:
      type: object
      required: [id, name, description, environment, is_default, policy_version, version, counts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentRef" }
        is_default: { type: boolean, description: The Default service; it cannot be deleted }
        policy_version: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        counts: { $ref: "#/components/schemas/ServiceCounts" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
    ServiceCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, examples: [Payments] }
        description: { type: string, maxLength: 500, examples: [Card processing] }
        environment_id: { type: [string, "null"], format: uuid }
    ServicePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, examples: [Payments] }
        description: { type: string, maxLength: 500 }
        environment_id: { type: [string, "null"], format: uuid, description: null removes the environment }
    ServicePolicy:
      type: object
      required: [version, body, created_by, created_by_name, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        body: { type: object, description: 'The policy document; version 1 is {"schema":1}' }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
    ServicePolicyUpdate:
      type: object
      required: [version, body]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: The policy version the caller read }
        body: { $ref: "#/components/schemas/ServicePolicyDocument" }
    ServicePolicyDocument:
      type: object
      description: >-
        A service policy, schema 1 (design §7.3). domains: DNS names, "*.suffix" wildcards (any depth, wildcard names
        included), IP addresses and CIDR blocks; every name of a certificate entering the service must match one.
        certificate_sources: how certificates may enter. acme: the allowed providers, challenges and key types, and the
        renewal window new ACME certificates start with. deployment.auto_deploy forbidden holds automatic deployment.
        incident.revoke_mode: the mode new incidents start with. notifications: who else receives the service's e-mails.
      required: [schema]
      additionalProperties: false
      properties:
        schema: { type: integer, enum: [1] }
        domains: { type: array, maxItems: 200, items: { type: string, maxLength: 253 } }
        certificate_sources: { type: array, items: { type: string, enum: [acme, uploaded, csr] } }
        acme:
          type: object
          additionalProperties: false
          properties:
            providers: { type: array, maxItems: 50, items: { type: string, format: uuid } }
            challenges: { type: array, items: { type: string, enum: [dns01, http01] } }
            key_types: { type: array, items: { type: string, enum: [ecdsa_p256, ecdsa_p384, rsa_2048, rsa_3072, rsa_4096] } }
            renew_before_days: { type: integer, minimum: 1, maximum: 60 }
        deployment:
          type: object
          additionalProperties: false
          properties:
            auto_deploy: { type: string, enum: [allowed, forbidden] }
        incident:
          type: object
          additionalProperties: false
          properties:
            revoke_mode: { type: string, enum: [after_verified, now] }
        notifications:
          type: object
          additionalProperties: false
          properties:
            administrators: { type: boolean }
            addresses:
              type: array
              maxItems: 20
              items:
                type: object
                required: [email, locale]
                additionalProperties: false
                properties:
                  email: { type: string, format: email }
                  locale: { type: string, enum: [en, tr] }
    ServicePolicyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ServicePolicy" } }
    ServiceOwners:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, minimum: 1, description: The service's version; a change of the owners names it }
        items:
          type: array
          items:
            type: object
            required: [id, kind, user_id, disabled, receives_email, directory_group_id, members, created_at]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [person, group] }
              user_id: { type: [string, "null"], format: uuid }
              username: { type: string }
              display_name: { type: string }
              disabled: { type: boolean, description: A disabled person receives nothing }
              receives_email: { type: boolean, description: An enabled person with an address }
              directory_group_id: { type: [string, "null"], format: uuid }
              group:
                type: object
                required: [source, source_name, value, label]
                properties:
                  source: { type: string, enum: [oidc, ldap] }
                  source_name: { type: string }
                  value: { type: string }
                  label: { type: string }
              members: { type: integer, description: A group's people seen in it at their last sign-in }
              reaches_service: { type: boolean, description: "Some role of the owner reaches the service (users.read callers only)" }
              created_at: { type: string, format: date-time }
    ServiceOwnersUpdate:
      type: object
      required: [version, owners]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        owners:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            description: Exactly one of user_id (a person) and directory_group_id.
            properties:
              user_id: { type: string, format: uuid }
              directory_group_id: { type: string, format: uuid }
    AssignRequest:
      type: object
      required: [resources]
      additionalProperties: false
      properties:
        resources:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
              type: { type: string, enum: [target, certificate, csr, ssh_key, acme_certificate, discovery_scope] }
              id: { type: string, format: uuid }
          examples: [[{ type: target, id: "01900000-0000-7000-8000-000000000001" }]]
    AssignResult:
      type: object
      required: [dry_run, destination, moves, untrusted]
      properties:
        dry_run: { type: boolean }
        destination: { $ref: "#/components/schemas/ServiceRef" }
        moves:
          type: array
          items:
            type: object
            required: [type, id, name, from, changed]
            properties:
              type: { type: string }
              id: { type: string, format: uuid }
              name: { type: string }
              from: { $ref: "#/components/schemas/ServiceRef" }
              changed: { type: boolean, description: false when it is in the destination already }
        untrusted:
          type: array
          items:
            type: object
            required: [kind, source_id, source_name, location_id, target_id, target_name, source_service, target_service]
            properties:
              kind: { type: string, enum: [key_vault, acme] }
              source_id: { type: string, format: uuid, description: The vault certificate or the ACME certificate }
              source_name: { type: string }
              location_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid, description: The server }
              target_name: { type: string }
              source_service: { $ref: "#/components/schemas/ServiceRef" }
              target_service: { $ref: "#/components/schemas/ServiceRef" }
    ServiceTrust:
      type: object
      required: [id, source, target, created_by_name, created_at]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ServiceRef" }
        target: { $ref: "#/components/schemas/ServiceRef" }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
    RoleBinding:
      type: object
      required: [id, user_id, directory_group_id, role, service, environment, services, created_by, created_by_name, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: [string, "null"], format: uuid }
        username: { type: string }
        display_name: { type: string }
        automation: { type: boolean, description: The user is an automation account }
        directory_group_id: { type: [string, "null"], format: uuid, description: A directory group subject (R54) }
        group:
          type: object
          description: The directory group of a group binding
          required: [source, source_name, value, label]
          properties:
            source: { type: string, enum: [oidc, ldap] }
            source_name: { type: string }
            value: { type: string }
            label: { type: string }
        role: { type: string, enum: [admin, operator, auditor] }
        service:
          description: The service of a binding on one service; null for an environment binding
          oneOf:
            - { $ref: "#/components/schemas/ServiceRef" }
            - { type: "null" }
        environment: { $ref: "#/components/schemas/EnvironmentRef" }
        services: { type: array, items: { $ref: "#/components/schemas/ServiceRef" }, description: The services the binding covers now }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
    RoleBindingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
    RoleBindingCreate:
      type: object
      required: [role]
      additionalProperties: false
      description: Exactly one of user_id (a person or an automation account) and directory_group_id.
      properties:
        user_id: { type: string, format: uuid }
        directory_group_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, operator, auditor] }
        service_id: { type: string, format: uuid, description: One of service_id and environment_id }
        environment_id: { type: string, format: uuid }
    UserAccess:
      type: object
      required: [global_role, bindings, group_bindings, grants, admin_capped]
      properties:
        global_role: { type: [string, "null"], enum: [admin, operator, auditor, null] }
        bindings: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
        group_bindings:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
          description: The bindings of the directory groups the person was in at their last sign-in or step-up
    DirectoryGroup:
      type: object
      required: [id, source, provider_id, directory_id, source_name, value, label, members, bindings, created_by, created_by_name, created_at]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [oidc, ldap] }
        provider_id: { type: [string, "null"], format: uuid }
        directory_id: { type: [string, "null"], format: uuid }
        source_name: { type: string, description: The SSO provider's or the directory's name }
        value: { type: string }
        label: { type: string }
        members: { type: integer, minimum: 0, description: People of that provider or directory in the group at their last sign-in }
        bindings: { type: integer, minimum: 0 }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
    SeenGroup:
      type: object
      required: [source, provider_id, directory_id, source_name, value, users, directory_group_id]
      properties:
        source: { type: string, enum: [oidc, ldap] }
        provider_id: { type: [string, "null"], format: uuid }
        directory_id: { type: [string, "null"], format: uuid }
        source_name: { type: string }
        value: { type: string }
        users: { type: integer, minimum: 1 }
        directory_group_id: { type: [string, "null"], format: uuid, description: "The declared group of this value, if any" }
    AutomationAccount:
      type: object
      required: [id, username, display_name, description, role, disabled, tokens, last_used_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        description: { type: string }
        role: { type: [string, "null"], enum: [operator, auditor, null], description: "The global role; null: none" }
        disabled: { type: boolean }
        tokens: { type: integer, minimum: 0, description: Live tokens }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name, scope, expires_in_days]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scope: { type: string, enum: [read, operate] }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }
        service_ids:
          type: [array, "null"]
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
          description: "Limit the token to these services (each one its owner holds a role on); null or absent: no limit"
        grants:
          type: array
          items:
            type: object
            required: [role, services]
            properties:
              role: { type: string, enum: [admin, operator, auditor] }
              services: { type: array, items: { $ref: "#/components/schemas/ServiceRef" } }
        admin_capped: { type: boolean, description: An SSO or directory user's Administrator bindings count as Operator }
    SessionAccess:
      type: object
      description: >-
        The person's access for the navigation (R49 Phase 2): the global role (null: none), the services they hold a role
        on with those roles, every permission they hold somewhere and those they hold with a global grant.
      required: [global_role, services, permissions_anywhere, platform_permissions]
      properties:
        global_role: { type: [string, "null"], enum: [admin, operator, auditor, null] }
        services:
          type: array
          items:
            type: object
            required: [id, name, environment, roles]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              environment: { $ref: "#/components/schemas/EnvironmentRef" }
              roles: { type: array, items: { type: string, enum: [admin, operator, auditor] } }
        permissions_anywhere: { type: array, items: { type: string } }
        platform_permissions: { type: array, items: { type: string } }
    ServiceTrustList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ServiceTrust" } }
    ServiceTrustCreate:
      type: object
      required: [source_service_id, target_service_id]
      additionalProperties: false
      properties:
        source_service_id: { type: string, format: uuid, description: The service whose keys are accepted }
        target_service_id: { type: string, format: uuid, description: The service whose servers and Key Vaults accept them }
    DiscoveryScopeCreate:
      type: object
      required: [name, entries, ports]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid, description: "R49: the service the new scope goes to; absent: the Default service. An unknown one is 422 validation.required on service_id. Never changed by an update: POST /api/v1/services/{id}/actions/assign moves it." }
        name: { type: string, maxLength: 100, examples: [Data centre] }
        entries:
          type: array
          maxItems: 256
          description: IP addresses, CIDR ranges (IPv4 at most a /20, IPv6 at most a /120) and host names
          items: { type: string, maxLength: 255 }
          examples: [["10.0.1.0/24", "intranet.example"]]
        ports: { type: array, maxItems: 16, items: { type: integer, minimum: 1, maximum: 65535 }, examples: [[443, 8443]] }
        sni_names: { type: array, maxItems: 256, items: { type: string, maxLength: 253 }, examples: [[]] }
        exclusions: { type: array, maxItems: 256, items: { type: string, maxLength: 255 }, description: Addresses and ranges never scanned, examples: [[]] }
        enabled: { type: boolean, default: true }
        schedule_hours: { type: integer, minimum: 0, maximum: 168, description: "Hours between scheduled scans; 0: no schedule" }
        window_start: { type: string, description: '"HH:MM" or "" (no window)' }
        window_end: { type: string, description: '"HH:MM" or "" (no window)' }
        window_tz: { type: string, maxLength: 64, description: 'IANA time zone of the window ("": UTC)' }
        alert_on_expiry: { type: boolean, default: false }
        rate_per_sec: { type: integer, minimum: 0, maximum: 100, description: "New connections per second; 0: 20" }
        concurrency: { type: integer, minimum: 0, maximum: 64, description: "Workers of a scan; 0: 32" }
    DiscoveryScopePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        entries: { type: array, maxItems: 256, items: { type: string, maxLength: 255 } }
        ports: { type: array, maxItems: 16, items: { type: integer, minimum: 1, maximum: 65535 } }
        sni_names: { type: array, maxItems: 256, items: { type: string, maxLength: 253 } }
        exclusions: { type: array, maxItems: 256, items: { type: string, maxLength: 255 } }
        enabled: { type: boolean }
        schedule_hours: { type: integer, minimum: 0, maximum: 168 }
        window_start: { type: string }
        window_end: { type: string }
        window_tz: { type: string, maxLength: 64 }
        alert_on_expiry: { type: boolean }
        rate_per_sec: { type: integer, minimum: 0, maximum: 100 }
        concurrency: { type: integer, minimum: 0, maximum: 64 }
    DiscoveryScope:
      type: object
      required: [id, name, entries, ports, sni_names, exclusions, enabled, schedule_hours, window_start, window_end, window_tz, alert_on_expiry,
        rate_per_sec, concurrency, version, created_by, created_at, updated_at, last_scheduled_at, active_scan_id, last_scan]
      properties:
        service: { $ref: "#/components/schemas/ServiceRef" }
        id: { type: string, format: uuid }
        name: { type: string }
        entries: { type: array, items: { type: string } }
        ports: { type: array, items: { type: integer } }
        sni_names: { type: array, items: { type: string } }
        exclusions: { type: array, items: { type: string } }
        enabled: { type: boolean }
        schedule_hours: { type: integer, description: "Hours between scheduled scans; 0 when the scope has no schedule (never null)" }
        window_start: { type: string, description: '"HH:MM", or "" when the schedule has no daily window (never null)' }
        window_end: { type: string, description: '"HH:MM", or "" when the schedule has no daily window (never null)' }
        window_tz: { type: string, description: The IANA time zone of the window; UTC when none was given }
        alert_on_expiry: { type: boolean }
        rate_per_sec: { type: integer }
        concurrency: { type: integer }
        version: { type: integer }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_scheduled_at: { type: [string, "null"], format: date-time }
        active_scan_id: { type: [string, "null"], format: uuid }
        last_scan: { oneOf: [{ $ref: "#/components/schemas/DiscoveryScan" }, { type: "null" }] }
    DiscoveryScopePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DiscoveryScope" } }
        next_cursor: { type: [string, "null"] }
    DiscoveryPreview:
      type: object
      required: [addresses, excluded_addresses, hostnames, ports, sni_names, endpoints, builtin_exclusions]
      properties:
        addresses: { type: integer }
        excluded_addresses: { type: integer }
        hostnames: { type: integer }
        ports: { type: integer }
        sni_names: { type: integer }
        endpoints: { type: integer }
        builtin_exclusions: { type: array, items: { type: string } }
    DiscoveryScan:
      type: object
      required: [id, scope_id, scope_name, trigger, state, cancel_requested, endpoints_total, endpoints_answered, endpoints_failed,
        endpoints_excluded, certificates_new, cert_churn, requested_by, queued_at, started_at, finished_at, error_code, error_reason]
      properties:
        id: { type: string, format: uuid }
        scope_id: { type: string, format: uuid }
        scope_name: { type: string }
        trigger: { type: string, enum: [manual, schedule] }
        state: { type: string, enum: [queued, running, done, cancelled, timed_out, failed] }
        cancel_requested: { type: boolean }
        endpoints_total: { type: integer }
        endpoints_answered: { type: integer }
        endpoints_failed: { type: integer }
        endpoints_excluded: { type: integer }
        certificates_new: { type: integer }
        cert_churn: { type: integer, description: "New certificates beyond the per-scan and per-day caps (counted, not stored)" }
        requested_by: { type: [string, "null"], format: uuid }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error_code: { type: [string, "null"], description: The ALC code of the reason the scan ended without finishing }
        error_reason: { type: [string, "null"], description: "The reason (discovery.* or license.*)" }
    DiscoveryScanPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DiscoveryScan" } }
        next_cursor: { type: [string, "null"] }
    DiscoveredCertificate:
      type: object
      required: [fingerprint_sha256, subject_cn, sans, issuer_cn, not_before, not_after, days_left, expired, key_algorithm, self_signed, status,
        managed_certificate_id, endpoint_count, seen_on_count, first_seen, last_seen]
      properties:
        fingerprint_sha256: { type: string }
        subject_cn: { type: string }
        sans: { type: array, items: { type: string } }
        issuer_cn: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        days_left: { type: integer }
        expired: { type: boolean }
        key_algorithm: { type: string, enum: [rsa, ecdsa, ed25519, other] }
        self_signed: { type: boolean }
        status: { type: string, enum: [unmanaged, managed, known] }
        managed_certificate_id: { type: [string, "null"], format: uuid }
        endpoint_count: { type: integer, description: Endpoints presenting it now }
        seen_on_count: { type: integer, description: Endpoints that are not gone whose last leaf it is }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        endpoints: { type: array, items: { $ref: "#/components/schemas/DiscoveredEndpoint" }, description: The detail only }
        more_endpoints: { type: boolean, description: The detail only }
    DiscoveredCertificatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DiscoveredCertificate" } }
        next_cursor: { type: [string, "null"] }
    DiscoveredEndpoint:
      type: object
      required: [id, scope_id, address, port, sni, host, fingerprint_sha256, previous_fingerprints, chain_length, tls_version, cipher, state,
        last_error_code, missed_scans, first_seen, last_seen, last_scanned_at, gone_since, target]
      properties:
        id: { type: string, format: uuid }
        scope_id: { type: string, format: uuid }
        address: { type: string }
        port: { type: integer }
        sni: { type: string }
        host: { type: string }
        fingerprint_sha256: { type: [string, "null"] }
        previous_fingerprints:
          type: array
          maxItems: 5
          items: { type: string }
          description: "The leaves it presented before its current one, newest first (its rotations); [] when none"
        chain_length: { type: integer }
        tls_version: { type: string }
        cipher: { type: string }
        state: { type: string, enum: [present, unreachable, gone, no_tls, excluded, malformed] }
        last_error_code: { type: string, enum: ["", refused, timeout, no_tls, reset, chain_too_large, policy, malformed] }
        missed_scans: { type: integer }
        first_seen: { type: string, format: date-time }
        last_seen: { type: [string, "null"], format: date-time }
        last_scanned_at: { type: string, format: date-time }
        gone_since: { type: [string, "null"], format: date-time }
        target:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - { type: "null" }
    DiscoveredEndpointPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DiscoveredEndpoint" } }
        next_cursor: { type: [string, "null"] }
    DiscoverySettings:
      type: object
      required: [allowed_networks, global_exclusions, retention_days, scanning_enabled, builtin_exclusions]
      properties:
        allowed_networks: { type: array, items: { type: string } }
        global_exclusions: { type: array, items: { type: string } }
        retention_days: { type: integer }
        scanning_enabled: { type: boolean, description: False while no allowed scan network is set (nothing may be scanned) }
        builtin_exclusions: { type: array, items: { type: string } }
    DiscoverySettingsInput:
      type: object
      required: [allowed_networks, global_exclusions, retention_days]
      additionalProperties: false
      properties:
        allowed_networks: { type: array, maxItems: 256, items: { type: string, maxLength: 255 }, examples: [["10.0.0.0/16"]] }
        global_exclusions: { type: array, maxItems: 256, items: { type: string, maxLength: 255 }, examples: [[]] }
        retention_days: { type: integer, minimum: 7, maximum: 730, examples: [90] }
    DiscoverySummary:
      type: object
      required: [unmanaged_total, unmanaged_expiring_30d, scopes, last_scan_at]
      properties:
        unmanaged_total: { type: integer }
        unmanaged_expiring_30d: { type: integer }
        scopes: { type: integer }
        last_scan_at: { type: [string, "null"], format: date-time }
    ACMEProviderCreate:
      type: object
      required: [name, directory_url]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100, examples: [Internal CA] }
        directory_url: { type: string, maxLength: 2048, examples: ["https://ca.example.com/acme/directory"] }
        preset: { type: string, enum: ["", letsencrypt, letsencrypt_staging, zerossl, custom], description: Only pre-fills the form }
        ca_bundle_pem: { type: string, maxLength: 65536, description: 'Public CA certificates (PEM) added to the system roots' }
        eab_kid: { type: string, maxLength: 255, description: External account binding key id (with eab_hmac) }
        eab_hmac: { type: string, maxLength: 1024, writeOnly: true, description: 'External account binding HMAC key, base64url; never returned' }
        allowed_suffixes: { type: array, maxItems: 100, items: { type: string, maxLength: 253 }, examples: [[example.com]] }
    ACMEProviderPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        directory_url: { type: string, maxLength: 2048 }
        preset: { type: string, enum: ["", letsencrypt, letsencrypt_staging, zerossl, custom] }
        ca_bundle_pem: { type: string, maxLength: 65536, description: '"" removes the bundle' }
        eab_kid: { type: string, maxLength: 255 }
        eab_hmac: { type: string, maxLength: 1024, writeOnly: true }
        allowed_suffixes: { type: array, maxItems: 100, items: { type: string, maxLength: 253 } }
        remove_eab: { type: boolean }
        confirm_directory_change: { type: boolean, description: 'A new directory URL while an account is active retires the account' }
    ACMEProvider:
      type: object
      required: [id, name, directory_url, preset, ca_bundle_pem, eab_kid, eab_configured, allowed_suffixes, active_account_id,
        pending_rollover, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        directory_url: { type: string }
        preset: { type: string }
        ca_bundle_pem: { type: string }
        eab_kid: { type: string }
        eab_configured: { type: boolean, description: 'An external account binding key is stored (the key is write-only)' }
        allowed_suffixes: { type: array, items: { type: string } }
        active_account_id: { type: [string, "null"], format: uuid }
        pending_rollover: { type: boolean, description: 'A key change is not settled yet (Check key change)' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        accounts: { type: array, description: GET of one provider only, items: { $ref: "#/components/schemas/ACMEAccount" } }
    ACMEProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ACMEProvider" } }
    ACMEAccountRegister:
      type: object
      additionalProperties: false
      properties:
        contact_email: { type: string, maxLength: 254, examples: [ops@example.com] }
        tos_accepted: { type: boolean, description: 'The Administrator accepted the terms of service the CA publishes' }
        accepted_terms_url: { type: string, maxLength: 2048, description: 'The terms URL the preview showed; when the CA''s terms differ now, 422 ALC-ACM-0003 (terms changed) and nothing is registered' }
    ACMEProviderPreview:
      type: object
      required: [terms_of_service_url, terms_url_unsafe, external_account_required, key_change_supported, renewal_info_supported, website]
      properties:
        terms_of_service_url: { type: string, description: '"" when the CA publishes none or when it is not a safe https URL' }
        terms_url_unsafe: { type: boolean, description: 'The CA publishes terms at a URL that is not a safe https link' }
        external_account_required: { type: boolean }
        key_change_supported: { type: boolean }
        renewal_info_supported: { type: boolean }
        website: { type: string, description: 'The CA''s website when it is a safe https URL, else ""' }
    ACMEAccount:
      type: object
      required: [id, provider_id, contact_email, account_url, tos_url, tos_accepted_at, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        contact_email: { type: string }
        account_url: { type: string }
        tos_url: { type: string }
        tos_accepted_at: { type: [string, "null"], format: date-time }
        state: { type: string, enum: [active, pending_rollover, retired, deactivated] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ACMEHookCreate:
      type: object
      required: [name]
      additionalProperties: false
      description: A hook needs url and secret; a built-in provider the settings and credentials of its kind (R57).
      properties:
        kind: { type: string, enum: [webhook, cloudflare, azure_dns, route53], default: webhook }
        name: { type: string, maxLength: 100, examples: [Internal DNS] }
        url: { type: string, maxLength: 2048, examples: ["https://dns-hook.example.com/acme"] }
        ca_bundle_pem: { type: string, maxLength: 65536 }
        secret: { type: string, minLength: 16, maxLength: 256, writeOnly: true, examples: [example-hook-secret-0123456789], description: Never returned }
        allowed_suffixes: { type: array, maxItems: 100, items: { type: string, maxLength: 253 }, examples: [[example.com]] }
        propagation_wait_seconds: { type: integer, minimum: 0, maximum: 120, default: 5 }
        poll_timeout_seconds: { type: integer, minimum: 1, maximum: 100, default: 60 }
        auth: { type: string, enum: [client_secret, certificate, managed_identity], description: 'azure_dns: the sign-in method' }
        tenant_id: { type: string, format: uuid, description: 'azure_dns: the directory (tenant); empty for a managed identity' }
        client_id: { type: string, format: uuid, description: 'azure_dns: the application; optional user-assigned identity for a managed identity' }
        subscription_id: { type: string, format: uuid, description: 'azure_dns: the subscription of the zones' }
        resource_group: { type: string, maxLength: 90, description: 'azure_dns: the resource group of the zones' }
        access_key_id: { type: string, pattern: '^[A-Z0-9]{16,128}$', description: 'route53: the IAM access key ID' }
        role_arn: { type: string, maxLength: 2048, description: 'route53: an IAM role to assume (arn:aws:iam::<account>:role/<name>)' }
        external_id: { type: string, maxLength: 1224, description: 'route53: the external ID of the role assumption' }
        api_token: { type: string, maxLength: 256, writeOnly: true, description: 'cloudflare: the API token. Never returned' }
        client_secret: { type: string, maxLength: 1024, writeOnly: true, description: 'azure_dns, client_secret: never returned' }
        certificate_pem: { type: string, writeOnly: true, description: 'azure_dns, certificate: the registered certificate' }
        private_key_pem: { type: string, writeOnly: true, description: 'azure_dns, certificate: its RSA key. Never returned' }
        pfx_base64: { type: string, writeOnly: true, description: 'azure_dns, certificate: or both as a PFX. Never returned' }
        pfx_password: { type: string, writeOnly: true }
        secret_access_key: { type: string, maxLength: 1024, writeOnly: true, description: 'route53: never returned' }
    ACMEHookPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        url: { type: string, maxLength: 2048 }
        ca_bundle_pem: { type: string, maxLength: 65536 }
        secret: { type: string, maxLength: 256, writeOnly: true, description: 'Replaces the stored secret; absent keeps it' }
        allowed_suffixes: { type: array, maxItems: 100, items: { type: string, maxLength: 253 } }
        propagation_wait_seconds: { type: integer, minimum: 0, maximum: 120 }
        poll_timeout_seconds: { type: integer, minimum: 1, maximum: 100 }
        auth: { type: string, enum: [client_secret, certificate, managed_identity], description: 'azure_dns: the sign-in method' }
        tenant_id: { type: string, format: uuid, description: 'azure_dns: the directory (tenant); empty for a managed identity' }
        client_id: { type: string, format: uuid, description: 'azure_dns: the application; optional user-assigned identity for a managed identity' }
        subscription_id: { type: string, format: uuid, description: 'azure_dns: the subscription of the zones' }
        resource_group: { type: string, maxLength: 90, description: 'azure_dns: the resource group of the zones' }
        access_key_id: { type: string, pattern: '^[A-Z0-9]{16,128}$', description: 'route53: the IAM access key ID' }
        role_arn: { type: string, maxLength: 2048, description: 'route53: an IAM role to assume (arn:aws:iam::<account>:role/<name>)' }
        external_id: { type: string, maxLength: 1224, description: 'route53: the external ID of the role assumption' }
        api_token: { type: string, maxLength: 256, writeOnly: true, description: 'cloudflare: the API token. Never returned' }
        client_secret: { type: string, maxLength: 1024, writeOnly: true, description: 'azure_dns, client_secret: never returned' }
        certificate_pem: { type: string, writeOnly: true, description: 'azure_dns, certificate: the registered certificate' }
        private_key_pem: { type: string, writeOnly: true, description: 'azure_dns, certificate: its RSA key. Never returned' }
        pfx_base64: { type: string, writeOnly: true, description: 'azure_dns, certificate: or both as a PFX. Never returned' }
        pfx_password: { type: string, writeOnly: true }
        secret_access_key: { type: string, maxLength: 1024, writeOnly: true, description: 'route53: never returned' }
    ACMEHook:
      type: object
      required: [id, kind, settings, name, url, ca_bundle_pem, secret_configured, allowed_suffixes, propagation_wait_seconds,
        poll_timeout_seconds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [webhook, cloudflare, azure_dns, route53] }
        settings: { $ref: "#/components/schemas/ACMEDNSSettings" }
        name: { type: string }
        url: { type: string }
        ca_bundle_pem: { type: string }
        secret_configured: { type: boolean }
        allowed_suffixes: { type: array, items: { type: string } }
        propagation_wait_seconds: { type: integer }
        poll_timeout_seconds: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ACMEDNSSettings:
      type: object
      description: A built-in DNS provider's settings (R57); every field is empty for a hook. No credential is ever returned.
      required: [auth, tenant_id, client_id, subscription_id, resource_group, cert_thumbprint, cert_not_after, access_key_id, role_arn,
        external_id]
      properties:
        auth: { type: string }
        tenant_id: { type: string }
        client_id: { type: string }
        subscription_id: { type: string }
        resource_group: { type: string }
        cert_thumbprint: { type: string, description: 'azure_dns, certificate: the SHA-1 thumbprint of the sign-in certificate' }
        cert_not_after: { type: [string, "null"], format: date-time }
        access_key_id: { type: string }
        role_arn: { type: string }
        external_id: { type: string }
    ACMEHookList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ACMEHook" } }
    ACMECertificateCreate:
      type: object
      required: [provider_id, names, challenge]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid, description: "R49: the service the new ACME certificate goes to; absent: the Default service. An unknown one is 422 validation.required on service_id. Never changed by an update: POST /api/v1/services/{id}/actions/assign moves it." }
        provider_id: { type: string, format: uuid }
        names: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 253 }, examples: [[www.example.com]] }
        key_type: { type: string, enum: [ecdsa_p256, ecdsa_p384, rsa_2048, rsa_3072, rsa_4096], default: ecdsa_p256 }
        challenge: { type: string, enum: [dns01, http01] }
        hook_id: { type: [string, "null"], format: uuid, description: 'dns01: the DNS hook' }
        http_target_id: { type: [string, "null"], format: uuid, description: 'http01: the Nginx server the names point at' }
        renew_before_days: { type: integer, minimum: 1, maximum: 60, default: 30 }
        auto_renew: { type: boolean, default: true }
        auto_deploy: { type: boolean, default: false }
    ACMECertificatePatch:
      type: object
      additionalProperties: false
      properties:
        provider_id: { type: string, format: uuid }
        names: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 253 } }
        key_type: { type: string, enum: [ecdsa_p256, ecdsa_p384, rsa_2048, rsa_3072, rsa_4096] }
        challenge: { type: string, enum: [dns01, http01] }
        hook_id: { type: [string, "null"], format: uuid }
        http_target_id: { type: [string, "null"], format: uuid }
        renew_before_days: { type: integer, minimum: 1, maximum: 60 }
        auto_renew: { type: boolean }
        auto_deploy: { type: boolean }
    ACMECertificate:
      type: object
      required: [id, provider_id, account_id, names, key_type, challenge, hook_id, http_target_id, renew_before_days, auto_renew,
        auto_deploy, state, stopped_reason, failures, last_failure_class, permanent_failures, recovering, next_attempt_at, ca_not_before,
        ca_wait_critical, last_attempt_at, last_error, running_order_id, current, ari_window, deploy_held_reason, deploy_stopped, bindings_count,
        renew_at, renew_at_source, created_at, updated_at]
      properties:
        service: { $ref: "#/components/schemas/ServiceRef" }
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        names: { type: array, items: { type: string } }
        key_type: { type: string }
        challenge: { type: string, enum: [dns01, http01] }
        hook_id: { type: [string, "null"], format: uuid }
        http_target_id: { type: [string, "null"], format: uuid }
        renew_before_days: { type: integer }
        auto_renew: { type: boolean }
        auto_deploy: { type: boolean }
        state: { type: string, enum: [pending, issuing, active, failing, stopped] }
        stopped_reason: { type: string, enum: ["", renewal_failures], description: 'renewal_failures: automatic renewal stopped after repeated failures (Check again and resume: POST /rearm)' }
        failures: { type: integer, description: 'Failed renewals in a row, of both classes' }
        last_failure_class:
          type: string
          enum: ["", transient, permanent]
          description: >-
            The class of the last failure: transient (an outage that clears by itself: the CA, its lookups or the DNS hook
            unreachable or timing out, a rate limit, a server error) or permanent (it needs a person: a setting, the account, a
            refused name, a wrong challenge answer); empty without a failure
        permanent_failures: { type: integer, description: 'The permanent failures among them; 5 stop automatic renewal (transient ones never do while the certificate is valid)' }
        recovering: { type: boolean, description: 'Stopped, but the last failure was an outage: Alice still orders it again by itself, slowly, until it expires' }
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: When Alice may try again after failures, the later of its own backoff and the CA's wait (ca_not_before)
        ca_not_before:
          type: [string, "null"]
          format: date-time
          description: >-
            The CA asked Alice not to order this certificate again before this time (the Retry-After of a rate limit, honoured
            in full up to seven days; R47); null when no such wait is running. No order starts before it, neither an automatic
            one nor a person's (ALC-ACM-0005 with Retry-After). Only a successful order clears it.
        ca_wait_critical:
          type: boolean
          description: >-
            The CA's wait leaves less than half of the renewal window of the current certificate. Alice still waits for the
            CA and has e-mailed the Administrators.
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { $ref: "#/components/schemas/ErrorRef" }
        running_order_id: { type: [string, "null"], format: uuid }
        current:
          type: [object, "null"]
          description: The current certificate (null before the first issuance)
          required: [id, fingerprint_sha256, not_before, not_after, chain_complete, revoked_at, revocation_reason, compromised]
          properties:
            id: { type: string, format: uuid }
            fingerprint_sha256: { type: string }
            not_before: { type: string, format: date-time }
            not_after: { type: string, format: date-time }
            chain_complete: { type: boolean }
            revoked_at: { type: [string, "null"], format: date-time }
            revocation_reason: { $ref: "#/components/schemas/RevocationReasonOrEmpty" }
            compromised: { type: boolean }
        ari_window:
          type: [object, "null"]
          description: The renewal window the CA suggests (ARI), when known
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        renew_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When Alice renews the current certificate by itself (null before the first certificate): a time it chose once at
            random in the window the CA suggests (ARI, RFC 9773; kept until the CA moves the window past it), never later than
            renew_before_days allows; otherwise renew_before_days before the end (at most a third of the lifetime)
        renew_at_source: { type: string, enum: ["", ca_window, local], description: 'ca_window: renew_at was chosen in the window the CA suggests (R50); local: renew_before_days; empty before the first certificate' }
        deploy_held_reason: { type: string, enum: ["", license, chain_incomplete], description: 'Why automatic deployment holds the current certificate' }
        deploy_stopped: { type: boolean, description: 'Automatic deployment of the current certificate stopped after repeated failures' }
        bindings_count: { type: integer }
        bindings: { type: array, description: GET of one certificate only, items: { $ref: "#/components/schemas/ACMEBinding" } }
        last_notice:
          type: object
          description: >-
            GET of one certificate only, absent when no renewal e-mail was queued for it: how the newest renewal e-mail
            (renewal failed, automatic renewal stopped, expires soon while its renewal fails) was delivered, one copy per
            recipient
          required: [template, queued_at, recipients, sent, pending, failed, skipped, sent_at, last_failure_code]
          properties:
            template: { type: string, enum: [acme.renewal_failed, acme.auto_renew_stopped, acme.renewal_expiring_transient, acme.renewal_expiring_permanent, acme.renewal_expiring_stopped] }
            queued_at: { type: string, format: date-time }
            recipients: { type: integer }
            sent: { type: integer }
            pending: { type: integer, description: Still being tried }
            failed: { type: integer, description: Given up }
            skipped: { type: integer, description: Not sent because no mail server is set }
            sent_at: { type: [string, "null"], format: date-time }
            last_failure_code: { type: string, description: 'The mail error of a copy that was not sent (smtp.*), empty without one' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ACMECertificatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ACMECertificate" } }
        next_cursor: { type: [string, "null"] }
    ACMEOrder:
      type: object
      required: [id, acme_certificate_id, kind, state, trigger, started_at, finished_at, error, certificate_id, requested_by, presented,
        cleanup_at, cleanup_error, revoked_at, revocation_reason, compromised, replaces, replaces_outcome]
      properties:
        id: { type: string, format: uuid }
        acme_certificate_id: { type: string, format: uuid }
        kind: { type: string, enum: [issue, test] }
        state: { type: string, enum: [running, succeeded, failed] }
        trigger: { type: string, enum: [manual, renewal] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error: { $ref: "#/components/schemas/ErrorRef" }
        certificate_id: { type: [string, "null"], format: uuid }
        requested_by: { type: [string, "null"], format: uuid }
        presented: { type: integer, description: Challenge records still published }
        cleanup_at: { type: [string, "null"], format: date-time }
        cleanup_error: { $ref: "#/components/schemas/ErrorRef" }
        revoked_at: { type: [string, "null"], format: date-time, description: The issued certificate's revocation }
        revocation_reason: { $ref: "#/components/schemas/RevocationReasonOrEmpty" }
        compromised: { type: boolean, description: The issued certificate's key is marked compromised }
        replaces:
          type: string
          description: >-
            The RFC 9773 identifier (base64url authority key identifier "." base64url serial number) of the certificate an
            issue order renews; empty for a first order and a test run
        replaces_outcome: { type: string, enum: ["", sent, adopted, no_ari, other_account, already_replaced, refused], description: 'What became of replaces (R50): sent; adopted (alreadyReplaced, and an interrupted order of Alice''s that replaces it was finished instead); not sent because the CA has no renewal information (no_ari) or the certificate was ordered with another account (other_account); sent, refused, then ordered once more without it (already_replaced, refused). Empty when replaces is empty' }
    ACMEOrderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ACMEOrder" } }
    ACMEBindingPut:
      type: object
      additionalProperties: false
      properties:
        auto_deploy: { type: boolean, default: false }
    ACMEBinding:
      type: object
      required: [acme_certificate_id, location_id, target_id, target_name, cert_path, location_kind, auto_deploy, state, attention_at, attention,
        served_certificate_id, created_at]
      properties:
        acme_certificate_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string }
        location_kind: { type: string, enum: [server_file, win_sslbinding, f5_clientssl, k8s_tls_secret], description: 'R63. The kind of the bound location, always present: server_file for a certificate file, win_sslbinding for an IIS binding' }
        auto_deploy: { type: boolean }
        state: { type: string, enum: [current, pending, attention, drifted], description: 'attention: the last automatic deployment of the current certificate failed. current (since R52): the location got the current certificate and no observation newer than that deployment disagrees; a past success alone no longer makes it current. drifted (R52): it had the current certificate and a newer observation found another one. observation.health says how the location is observed today.' }
        attention_at: { type: [string, "null"], format: date-time }
        attention: { $ref: "#/components/schemas/ErrorRef" }
        served_certificate_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        observation: { $ref: "#/components/schemas/LocationObservation" }
    ACMEBindingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ACMEBinding" } }
    ACMEDeploy:
      type: object
      additionalProperties: false
      properties:
        location_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
        confirm_incomplete_chain: { type: boolean, description: Counts for an Administrator only (F-17) }
    HoldRule:
      type: string
      enum: [gate_closed, created_before_reopening, unconfirmed_since_reopening, detected_before_reopening]
      description: >-
        The audit detail hold_rule of a held version (on kv.certificate.new_version and on the planner's hold): the
        license gate was closed when it was found (gate_closed), Azure created it before the gate last reopened
        (created_before_reopening), no complete listing of the vault was stored since the reopening
        (unconfirmed_since_reopening), or the planner saw it was detected before the reopening
        (detected_before_reopening). Versions themselves show held and held_reason (license, incomplete_chain).
    AccessCheckRequest:
      type: object
      additionalProperties: false
      properties:
        read_secret_of: { type: string, format: uuid, description: A vault certificate id; its current secret is read once to prove the role }
    VaultCreate:
      type: object
      required: [name, vault_url, auth]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid, description: "R49: the service the new Key Vault goes to; absent: the Default service. An unknown one is 422 validation.required on service_id. Never changed by an update: POST /api/v1/services/{id}/actions/assign moves it." }
        name: { type: string, minLength: 1, maxLength: 100 }
        vault_url: { type: string, maxLength: 253, examples: ["https://contoso.vault.azure.net"], description: 'Only a public-cloud vault: https://name.vault.azure.net or just the name (3 to 24 characters). Any other scheme, port, path, suffix or host is validation.pattern.' }
        auth: { type: string, enum: [certificate, client_secret, managed_identity] }
        tenant_id: { type: string, format: uuid, description: Not for managed_identity }
        client_id: { type: string, format: uuid, description: Optional for managed_identity (a user-assigned identity) }
        client_secret: { type: string, writeOnly: true, description: Request only; never returned or logged }
        secret_expires_on: { type: string, format: date-time, description: When the client secret expires (optional; shown on the vault page) }
        certificate_pem: { type: string, writeOnly: true, description: The certificate registered with the application (PEM) }
        private_key_pem: { type: string, writeOnly: true, description: 'Its RSA private key (PEM, unencrypted); request only' }
        pfx_base64: { type: string, writeOnly: true, description: The certificate and key as a PFX in base64; request only }
        pfx_password: { type: string, writeOnly: true, description: The PFX password; request only }
        poll_interval_minutes: { type: integer, minimum: 5, maximum: 1440, description: 0 or absent means 15 }
    VaultCredentials:
      type: object
