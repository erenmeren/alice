          application/json:
            schema: { $ref: "#/components/schemas/GenerateKey" }
      responses:
        "201":
          description: The generated key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKey" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/{id}/actions/deploy:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: deploySSHKey
      summary: Add a generated key to one user's key file on a server and test a login with it (runs as a job)
      description: >-
        Only keys Alice generated (409 ALC-KEY-0006), not retired (409 ALC-KEY-0007) or destroyed (410 ALC-KEY-0008).
        Never the account Alice connects with or one of its key files (409 ALC-KEY-0009), only on a server whose last
        scan listed that account's key files completely (409 ALC-KEY-0014), only into a file the SSH server reads for
        that user (409 ALC-KEY-0013). The options are from= and restrict only. The same deploy while queued is the same
        job; with other options 409 ALC-JOB-0005. Refusals that protect access are recorded in the audit log. Refused
        with 403 ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      x-scope: cross
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployKey" }
      responses:
        "202":
          description: Queued; the job's result says whether the login with the key worked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/{id}/actions/download-private-key:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: downloadPrivateKey
      summary: Download the private key of a generated key as an OpenSSH file (audited; Administrator with step-up)
      description: >-
        An Administrator's browser session with a fresh step-up (403 ALC-AUTH-0003 without it), never an API token
        (403 ALC-AUTH-0002); at most 5 per minute per user (429 with Retry-After). The reason is recorded in the audit
        log, which is written, together with the download counter, before the first byte of the file is sent. With a
        passphrase the file is encrypted with it (bcrypt KDF, aes256-ctr); Alice does not keep the passphrase. An
        empty passphrase is refused (422); leave the field out or send null for an unencrypted file. Every refusal is
        the usual JSON error, never a file: Alice's own key or a key Alice holds no private key for 409 ALC-KEY-0006,
        a destroyed private key 410 ALC-KEY-0008, a clock set back behind the last download 503 ALC-KEY-0015
        (retryable). Allowed while the license is locked.
      x-permission: sshkeys.download
      x-scope: resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadPrivateKey" }
      responses:
        "200":
          description: The OpenSSH private key file
          headers:
            Content-Disposition:
              description: 'attachment; filename="alice-<name>-<8 hex>.key" (the name is built by Alice from [a-z0-9._-] only)'
              schema: { type: string }
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/policies:
    get:
      operationId: listRotationPolicies
      summary: Rotation policies by name
      x-permission: read
      x-scope: list
      responses:
        "200":
          description: Every live policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationPolicyList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRotationPolicy
      summary: Create a rotation policy for a key Alice generated (switched off)
      description: >-
        Alice's own key and a key Alice holds no private key for are refused (409 ALC-KEY-0001, 409 ALC-KEY-0006), a
        retired key too (409 ALC-KEY-0007); each key has one policy (409 ALC-ROT-0001); the new key of a running
        rotation cannot get one (409 ALC-ROT-0002). Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.manage
      x-scope: create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotationPolicyCreate" }
      responses:
        "201":
          description: The policy, switched off
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/policies/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getRotationPolicy
      summary: One rotation policy
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The policy
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationPolicy" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateRotationPolicy
      summary: Change a rotation policy (If-Match with the ETag is required)
      description: >-
        A change to interval_days, overlap_days, notify_before_hours or new_key_type of a policy that is on switches
        it off in the same step (a previewed run is cancelled with rotation.policy_off); switching it on again is
        POST .../actions/enable, which needs an Administrator's step-up. A name-only change leaves it on. 412
        ALC-SYS-0008 when the If-Match header is missing (answered first, before the body is read) or names another
        version. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.manage
      x-scope: resource
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotationPolicyPatch" }
      responses:
        "200":
          description: The changed policy
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRotationPolicy
      summary: Delete a rotation policy (If-Match with the ETag is required; the key stays as it is)
      description: >-
        A previewed run is cancelled; a started run refuses the deletion (409 ALC-ROT-0002). 412 ALC-SYS-0008 when the
        If-Match header is missing or names another version. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.manage
      x-scope: resource
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/policies/{id}/actions/enable:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: enableRotationPolicy
      summary: Switch a rotation policy on (Administrator with step-up; If-Match with the ETag is required)
      description: >-
        The first run is planned one interval from now; each run is previewed and emailed to the administrators before
        it starts, and a scheduled run starts only after that email was delivered. 412 ALC-SYS-0008 when the If-Match
        header is missing or names another version. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.operate
      x-scope: cross
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      responses:
        "200":
          description: The policy, switched on
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationPolicy" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/policies/{id}/actions/disable:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: disableRotationPolicy
      summary: Switch a rotation policy off (If-Match with the ETag is required)
      description: >-
        No run is planned; a previewed run is cancelled, a started run continues. 412 ALC-SYS-0008 when the If-Match
        header is missing or names another version. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.manage
      x-scope: resource
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      responses:
        "200":
          description: The policy, switched off
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationPolicy" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/policies/{id}/actions/preview:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: previewRotation
      summary: Plan the policy's next run as it would be now (a dry run; nothing changes on servers)
      description: >-
        The preview is emailed to the administrators, at most once per key in 10 minutes (emailed says whether this one
        was). A plan in which nothing can change is answered with its skipped places. Run now must send plan_digest
        back. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.manage
      x-scope: resource
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationPreview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/policies/{id}/actions/run:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: runRotation
      summary: Start a rotation now with the previewed plan (Administrator with step-up)
      description: >-
        plan_digest is the digest of the preview the Administrator saw. When the plan built now differs, nothing is
        created or started (409 ALC-ROT-0003); a running rotation of the key is 409 ALC-ROT-0002; a plan in which nothing
        can change 409 ALC-ROT-0004. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.operate
      x-scope: cross
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotationRunRequest" }
      responses:
        "202":
          description: Started; follow it at status_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/runs:
    get:
      operationId: listRotations
      summary: Rotation runs, newest first (counts of their places; places, steps and decisions only on GET /rotation/runs/{id})
      x-permission: read
      x-scope: list
      parameters:
        - { name: policy_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: ssh_key_id, in: query, required: false, schema: { type: string, format: uuid, description: The old or the new key of the run } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationRunPage" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/runs/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getRotation
      summary: One rotation run with its places and steps
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/runs/{id}/actions/continue:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: continueRotation
      summary: Continue a rotation paused by the license (Administrator with step-up)
      description: >-
        Only after a renewal (403 ALC-LIC-0001 while the license is locked) and once the email about the renewal was
        queued (409 ALC-ROT-0021, retryable); every removal of the old key is still preceded by a fresh login with the
        new key. 409 ALC-ROT-0005 when the run is not paused.
      x-permission: rotation.operate
      x-scope: cross
      responses:
        "204": { description: Continued }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/runs/{id}/actions/finish-now:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: finishRotationNow
      summary: End the overlap now (Administrator with step-up); the old key is removed after a fresh login with the new key
      description: >-
        The administrators are emailed the new removal time. 409 ALC-ROT-0005 when the run is not in its overlap or is
        paused. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.operate
      x-scope: cross
      responses:
        "204": { description: The overlap ends now }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rotation/runs/{id}/actions/keep-old:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: keepOldKey
      summary: Keep the old key where Alice could not test the new one (Administrator with step-up)
      description: >-
        Every id must be a place of this run that Alice could not test; the other places of the run in the same file are
        kept too. At least one place where the new key works must remain. Otherwise 409 ALC-ROT-0005 and nothing
        changes. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: rotation.operate
      x-scope: cross
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeepOldRequest" }
      responses:
