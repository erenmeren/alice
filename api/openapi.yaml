      x-permission: certificates.operate
      x-scope: cross
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindingPatch" }
      responses:
        "200":
          description: The connection
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Binding" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBinding
      summary: Remove a connection (its websites are released; nothing changes on them)
      description: >-
