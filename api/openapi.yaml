openapi: 3.1.0
info:
  title: Alice API
  version: 0.1.0
  description: >-
    Self-hosted SSH key and TLS certificate management. All timestamps are UTC RFC 3339. A signed-in
    session's 30-minute idle timeout is extended only by state-changing requests that pass the origin and
    CSRF checks and by same-origin reads that carry the header X-Alice-Activity: 1 (the web UI sends it
    after a person's input); other reads leave it unchanged. API tokens have no idle timeout. Every route
    refused with 403 ALC-LIC-0001 while the license is locked is also refused with 503 ALC-LIC-0009
    (license.unverified, retryable) while no license check has succeeded for 3 hours; it works again after
    the next successful check. Text Alice cannot store (a NUL character in a query parameter or in a JSON
    string, or a query parameter that is not valid UTF-8), and a query that does not parse (a bad percent
    escape, or ";" between parameters), are refused with 400 ALC-SYS-0004 before any operation runs; binary
    content travels base64-encoded. List cursors are opaque: one that does not decode, or whose position
    lies outside the range of times Alice stores, is refused with 4xx.
servers:
  - url: /
paths:
  /livez:
    get:
      operationId: getLivez
      summary: Process liveness (no dependencies checked)
      x-permission: public
      x-scope: none
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        default: { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      operationId: getHealthz
      summary: Readiness (database reachable and migrations current)
      description: >-
        On the public listener this answers at most 60 requests a minute per client address (429
        with Retry-After after that). The internal health listener (ALICE_HEALTH_ADDR) is not
        limited; container healthchecks and orchestrators use that one.
      x-permission: public
      x-scope: none
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build information
      x-permission: read
      x-scope: any
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/i18n/locales:
    get:
      operationId: listLocales
      summary: Supported UI languages
      x-permission: public
      x-scope: none
      responses:
        "200":
          description: Supported locales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocaleList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first-run wizard is still needed
      x-permission: public
      x-scope: none
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/session:
    post:
      operationId: startSetupSession
      summary: Exchange the one-time setup code for a wizard session (sets the __Host-alice_setup cookie)
      x-permission: public
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 64, examples: [K7QX2M-9TPD4R-WB5H8N-3VZC6A] }
      responses:
        "200":
          description: Wizard session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSRFToken" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/language:
    put:
      operationId: setSetupLanguage
      summary: Choose the default language
      x-permission: setup
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { type: string, enum: [en, tr] }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/admin/enrollment:
    post:
      operationId: startAdminEnrollment
      summary: Validate the administrator details and create a TOTP secret to scan
      x-permission: setup
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name, email, password]
              properties:
                username: { type: string, maxLength: 64 }
                display_name: { type: string, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: TOTP secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/admin:
    post:
      operationId: createAdmin
      summary: Confirm the first TOTP code, create the administrator and sign in
      x-permission: setup
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Administrator created; session cookie set, setup cookie cleared, recovery codes shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithCodes" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/recovery-passphrase:
    post:
      operationId: setRecoveryPassphrase
      summary: Choose the recovery passphrase and create the backup key pair
      x-permission: settings.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [passphrase, passphrase_confirm]
              properties:
                passphrase: { type: string, minLength: 16, maxLength: 1024 }
                passphrase_confirm: { type: string, maxLength: 1024 }
      responses:
        "204": { description: Passphrase set }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/evaluation:
    post:
      operationId: chooseEvaluation
      summary: Complete the wizard's license step with the 30-day evaluation (it runs from the installation timestamp)
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: Setup status after the choice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: Finish the wizard (needs the recovery passphrase and a license choice)
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: Setup status after completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Check username and password; sets a pending session cookie for the MFA step
      x-permission: public
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password accepted; MFA is next
          content:
            application/json:
              schema:
                type: object
                required: [status, csrf_token]
                properties:
                  status: { type: string, enum: [mfa_required, mfa_enrollment_required] }
                  csrf_token: { type: string, description: Send as X-CSRF-Token on the MFA enroll/verify requests }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/enroll:
    post:
      operationId: enrollMFA
      summary: Create the TOTP secret for a user who has none yet
      x-permission: mfa_pending
      x-scope: none
      responses:
        "200":
          description: TOTP secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Complete sign-in with a TOTP code or a recovery code (new session cookie)
      x-permission: mfa_pending
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
                recovery_code: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Signed in; recovery_codes present only after first enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithCodes" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: The signed-in user, the CSRF token and session limits
      x-permission: session
      x-scope: self
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End this session
      x-permission: session
      x-scope: self
      responses:
        "204": { description: Signed out; cookie cleared }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/stepup:
    post:
      operationId: stepUp
      summary: Confirm a TOTP code to allow sensitive actions for 5 minutes (session ID is regenerated)
      description: >-
        For local users. A single sign-on user confirms at the identity provider (/auth/oidc/stepup), a directory user
        with the directory password (/auth/ldap/stepup); a directory user is refused here with 409 ALC-USR-0003.
      x-permission: session
      x-scope: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Step-up active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the own password; ends every other session
      x-permission: session
      x-scope: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 1024 }
                new_password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password changed; new session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the own recovery codes (the old ones stop working)
      x-permission: session.stepup
      x-scope: self
      responses:
        "200":
          description: New recovery codes, shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/locale:
    put:
      operationId: setMyLocale
      summary: Save the own UI language
      x-permission: session
      x-scope: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale]
              properties:
                locale: { type: string, enum: [en, tr] }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: All users (administrators only)
      x-permission: users.read
      x-scope: platform
      responses:
        "200":
          description: Users ordered by username
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a local user; they set up their authenticator app at first sign-in
      x-permission: users.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name, email, role, password]
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$" }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                role: { type: [string, "null"], enum: [admin, operator, auditor, null], description: "null: no global role (role bindings only, R49 Phase 2)" }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getUser
      summary: One user
      x-permission: users.read
      x-scope: platform
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      summary: Change name, email, role or disabled state; role changes and disabling end the user's sessions
      x-permission: users.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                role: { type: [string, "null"], enum: [admin, operator, auditor, null], description: "null: no global role (role bindings only, R49 Phase 2)" }
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/reset-mfa:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: resetUserMFA
      summary: Remove the user's authenticator app and recovery codes; ends their sessions
      x-permission: users.manage
      x-scope: platform
      responses:
        "204": { description: MFA reset }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/reset-password:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: resetUserPassword
      summary: Set a new password for the user; ends their sessions, revokes their API tokens and clears a lockout
      description: >-
        In one transaction: sets the password, clears the sign-in delay or lockout, ends every session of the
        user and revokes every API token of the user (each audited as token.revoked by its ID; the
        user.password_reset row carries revoked_tokens_count). The tokens are refused from the next request on.
        A user changing their own password (POST /api/v1/auth/password) keeps their tokens.
      x-permission: users.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "204": { description: Password reset }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/revoke-sessions:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: revokeUserSessions
      summary: Sign the user out everywhere; ends their sessions and revokes their API tokens
      description: >-
        In one transaction: ends every session of the user and revokes every API token of the user (each
        audited as token.revoked by its ID; the user.sessions_revoked row carries revoked_tokens_count). The
        tokens are refused from the next request on. Also applies when administrators use it on themselves.
      x-permission: users.manage
      x-scope: platform
      responses:
        "204": { description: Sessions ended and API tokens revoked }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/unlock-directory-sign-in:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: unlockDirectorySignIn
      summary: End a directory user's sign-in lockout
      description: >-
        Three failed directory passwords within 30 minutes lock a sign-in name and a directory account for 45 minutes
        (audited as auth.ldap.lockout). This ends the lock, and clears the failures, of the user's account and of the
        sign-in name the directory last returned for the user; other names of the account (aliases, other spellings)
        keep their own name lock until it ends. Recorded as user.directory_unlocked with name_locked and account_locked.
        The lockout is kept in memory by each Alice process; this acts on the process that answers. Answers 204 also
        when nothing was locked. A user who does not sign in through a directory is 409 ALC-LDAP-0009.
      x-permission: users.manage
      x-scope: platform
      responses:
        "204": { description: The lockout is ended }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/access:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getUserAccess
      summary: A person's effective access and where each part comes from
      description: >-
        The global role (null: none), every role binding with the services it covers now (an environment binding: every
        service that carries the environment at this moment), the grants they add up to (one per role), and whether the
        "SSO users may be Admin" switch lowers the person's Administrator bindings to Operator (R49 Phase 2).
      x-permission: users.read
      x-scope: platform
      responses:
        "200":
          description: The access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccess" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/role-bindings:
    get:
      operationId: listRoleBindings
      summary: Role bindings (a role held on one service or on every service of an environment)
      description: >-
        Filters user_id, directory_group_id, environment_id and service_id (service_id also lists the environment
        bindings that reach the service through its environment). The global role is not a binding: it is the user's
        role (R49 Phase 2).
      x-permission: users.read
      x-scope: platform
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: directory_group_id, in: query, schema: { type: string, format: uuid } }
        - { name: service_id, in: query, schema: { type: string, format: uuid } }
        - { name: environment_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The bindings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBindingList" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRoleBinding
      summary: Give a person a role on one service or on every service of an environment
      description: >-
        Exactly one of user_id (a person or an automation account) and directory_group_id (R54), and exactly one of
        service_id and environment_id. Takes effect at the subject's next request (a group's at its members' next
        request). 409 ALC-ACC-0001 when the subject holds the role there already; 422 ALC-ACC-0005 beyond 200 bindings per
        subject; 422 validation for an unknown person, group, service or environment. Audited as access.binding_added. Administrator with a fresh step-up,
        never an API token.
      x-permission: access.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingCreate" }
      responses:
        "201":
          description: The binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBinding" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/role-bindings/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: deleteRoleBinding
      summary: Remove a role binding
      description: >-
        Takes effect at the person's next request. Audited as access.binding_removed. Administrator with a fresh step-up,
        never an API token.
      x-permission: access.manage
      x-scope: platform
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/directory-groups:
    get:
      operationId: listDirectoryGroups
      summary: Directory groups role bindings name, and the group values seen at sign-in
      description: >-
        items are the declared groups (per SSO provider or directory, with the people seen in them at their last sign-in
        and their bindings); seen are the values seen at the sign-ins of every provider and directory (at most 500, most
        people first), with the declared group of that value if there is one (R54).
      x-permission: users.read
      x-scope: platform
      responses:
        "200":
          description: The groups
          content:
            application/json:
              schema:
                type: object
                required: [items, seen]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DirectoryGroup" } }
                  seen: { type: array, items: { $ref: "#/components/schemas/SeenGroup" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDirectoryGroup
      summary: Declare a group of an SSO provider or a directory
      description: >-
        The value exactly as the provider's groups claim or the directory's group search returns it (case-sensitive; no
        white space at its ends, no invisible characters, at most 1024 characters). 409 ALC-ACC-0008 when the provider or
        directory has the group already; 422 validation for an unknown provider or directory. Audited as
        access.directory_group_added. Administrator with a fresh step-up, never an API token.
      x-permission: access.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, value]
              properties:
                source: { type: string, enum: [oidc, ldap] }
                provider_id: { type: string, format: uuid, description: The SSO provider (source oidc) }
                directory_id: { type: string, format: uuid, description: The directory (source ldap) }
                value: { type: string, minLength: 1, maxLength: 1024 }
                label: { type: string, maxLength: 100 }
      responses:
        "201":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryGroup" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/directory-groups/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: deleteDirectoryGroup
      summary: Remove a directory group with its role bindings and owner entries
      description: >-
        Its members lose what its bindings gave them at their next request. The answer counts what went with it. 404
        ALC-ACC-0003 for an unknown group. Audited as access.directory_group_removed. Administrator with a fresh step-up,
        never an API token.
      x-permission: access.manage
      x-scope: platform
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [bindings_removed, owners_removed]
                properties:
                  bindings_removed: { type: integer, minimum: 0 }
                  owners_removed: { type: integer, minimum: 0 }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/automation-accounts:
    get:
      operationId: listAutomationAccounts
      summary: Automation accounts (non-persons that only hold API tokens)
      x-permission: users.read
      x-scope: platform
      responses:
        "200":
          description: The accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AutomationAccount" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAutomationAccount
      summary: Create an automation account
      description: >-
        A user name under the user name rule (one name space with people), a display name, a description and a global
        role of null (none), operator or auditor; admin is 422 ALC-ACC-0002 (a role binding as Administrator on a service
        is possible). It never signs in. 409 ALC-USR-0001 for a taken name. Audited as automation.created. Administrator
        with a fresh step-up, never an API token (R54).
      x-permission: access.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name]
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$" }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                role: { type: [string, "null"], enum: [operator, auditor, null] }
      responses:
        "201":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationAccount" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/automation-accounts/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      operationId: updateAutomationAccount
      summary: Change an automation account's display name, description, global role or enabled state
      description: >-
        Disabling revokes every token of the account for good (enabling it again brings none back). Audited as
        automation.updated. Administrator with a fresh step-up, never an API token.
      x-permission: access.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                role: { type: [string, "null"], enum: [operator, auditor, null] }
                disabled: { type: boolean }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationAccount" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/automation-accounts/{id}/tokens:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listAutomationTokens
      summary: The live tokens of an automation account
      x-permission: users.read
      x-scope: platform
      responses:
        "200":
          description: The tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAutomationToken
      summary: Create a token of an automation account; the secret is returned once
      description: >-
        The rules of personal tokens (name, scope, at most 365 days, optional service_ids); the account's grants decide the
        scope (422 ALC-TOK-0001) and must hold every service of service_ids (422 ALC-TOK-0002). 409 ALC-ACC-0007 for a
        disabled account. The audit row token.created names the Administrator and the account. Administrator with a fresh
        step-up, never an API token.
      x-permission: access.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                required: [token, item]
                properties:
                  token: { type: string, description: "alice_ followed by 43 characters; store it now, it is never shown again" }
                  item: { $ref: "#/components/schemas/APIToken" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/automation-accounts/{id}/tokens/{token_id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: token_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeAutomationToken
      summary: Revoke a token of an automation account
      description: Audited as token.revoked. Administrator with a fresh step-up, never an API token.
      x-permission: access.manage
      x-scope: platform
      responses:
        "204": { description: Token revoked }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: Own API tokens, or another user's with user_id (administrators only)
      x-permission: session
      x-scope: self
      parameters:
        - { name: user_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active (not revoked) tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createToken
      summary: Create an API token; the secret is returned once. A single sign-on user gets none (409 ALC-USR-0003)
      description: >-
        service_ids limits the token to services its owner holds a role on (422 ALC-TOK-0002 otherwise): it then acts
        with the owner's grants on those services only and passes no platform route (R54).
      x-permission: session.stepup
      x-scope: self
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                required: [token, item]
                properties:
                  token: { type: string, description: "alice_ followed by 43 characters; store it now, it is never shown again" }
                  item: { $ref: "#/components/schemas/APIToken" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: revokeToken
      summary: Revoke a token (own, or any token for administrators)
      x-permission: session
      x-scope: self
      responses:
        "204": { description: Token revoked }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit log entries, newest first (administrators and auditors)
      x-permission: audit.read
      x-scope: platform
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: "^[0-9]+$" }, description: next_cursor of the previous page }
        - { name: action, in: query, required: false, schema: { type: string }, description: Action prefix, e.g. auth. }
        - { name: actor, in: query, required: false, schema: { type: string }, description: Exact actor name }
        - { name: result, in: query, required: false, schema: { type: string, enum: [success, failure, denied] } }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit/export:
    get:
      operationId: exportAudit
      summary: Download the whole audit log with its verification result (read-only verification; the export itself is audited)
      x-permission: audit.read
      x-scope: platform
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, json] } }
      description: >-
        Verifies the chain read-only, records audit.exported, then streams every entry (the response may be
        written for up to 10 minutes). The verification travels with the file: the JSON export's verification
        object, the header X-Alice-Audit-Intact, and in the CSV export a first line (after the UTF-8 BOM) that is a
        comment, not a record (RFC 4180 has no comments; read it with a comment character of #, for example
        Go's csv.Reader.Comment or pandas' comment="#"):
        "# alice audit export: intact=<true|false> checked=<n> head_seq=<n> head_hash=<hex>", followed on a
        broken chain by " first_bad_seq=<n> problem=<hash_mismatch|sequence_gap|tail_truncated>". The header
        row is the second line. Cells that start with =, +, -, @, a tab, a carriage return or a line feed get a
        leading apostrophe. One verification or export runs at a time per Alice process; another one is refused
        with 503 ALC-AUD-0001 (retryable, Retry-After).
        HEAD is refused with 405 ALC-SYS-0009 without verifying or recording anything.
      responses:
        "200":
          description: The log. Header X-Alice-Audit-Intact tells whether the chain verified.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [verification, entries]
                properties:
                  verification: { $ref: "#/components/schemas/AuditReport" }
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit/verify:
    post:
      operationId: verifyAudit
      summary: Recompute the hash chain and record the result
      description: >-
        Recomputes the whole chain from the first entry (for up to 10 minutes). One verification or export runs at a
        time per Alice process; another one is refused with 503 ALC-AUD-0001 (retryable, Retry-After).
      x-permission: audit.read
      x-scope: platform
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditReport" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license/status:
    get:
      operationId: getLicenseStatus
      summary: Whether the license has expired, and the license banners the caller sees
      x-permission: read
      x-scope: any
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license:
    get:
      operationId: getLicense
      summary: Installation ID, license in force, uploaded files and history
      x-permission: license.read
      x-scope: platform
      responses:
        "200":
          description: License details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseDetail" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: installLicense
      summary: Upload a license file; it takes effect at once
      x-permission: license.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseUpload" }
      responses:
        "200":
          description: The license was installed (or was already installed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseUploadResult" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license/preview:
    post:
      operationId: previewLicense
      summary: Check a license file and show what uploading it would do, without storing it
      x-permission: license.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseUpload" }
      responses:
        "200":
          description: The license could be installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseUploadResult" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/providers:
    get:
      operationId: listProviders
      summary: Compiled-in providers with their capabilities and configuration schema (add-server form)
      x-permission: read
      x-scope: any
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets:
    get:
      operationId: listTargets
      summary: Managed servers and Key Vaults (metadata only, never credentials)
      description: >-
        type narrows the list to one kind (linux, nginx, apache, haproxy, windows or azure_key_vault; anything else is 422 validation.one_of
        on type). A Key Vault carries vault.
      x-permission: read
      x-scope: list
      parameters:
        - { name: service_id, in: query, description: "R49: rows owned by these services (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: environment_id, in: query, description: "R49: rows owned by services of these environments (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: type, in: query, required: false, schema: { type: string, enum: [linux, nginx, apache, haproxy, windows, azure_key_vault] } }
      responses:
        "200":
          description: Servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTarget
      summary: Add a server; counts against the license and starts a connection test that fetches its fingerprint
      description: >-
        A 409 answer is ALC-TGT-0001 (another server has this name, or this address and port) or
        ALC-LIC-0008 (the license's target limit is reached). Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      x-scope: create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetCreate" }
      responses:
        "201":
          description: The server was added; job_id is the connection test
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetCreated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getTarget
      summary: One server
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The server
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTarget
      summary: Rename a server or Key Vault, or change a server's discovery interval or a vault's poll interval (If-Match with the ETag is required)
      description: >-
        If-Match must be a single strong validator with the current version, for example "3". A missing or
        malformed If-Match, a weak validator (W/"3"), a list or * answers 412 ALC-SYS-0008, as does a version
        that is no longer current. 404 when the server does not exist; 409 ALC-TGT-0001 when the new name is
        taken (ALC-AKV-0028 for a vault). poll_interval_minutes is for vaults only. certificate_cleanup is for servers that can clean up certificates only (422 validation.pattern otherwise). Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      x-scope: resource
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPatch" }
      responses:
        "200":
          description: The changed server
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTarget
      summary: Remove a server or Key Vault from Alice (frees a license slot; nothing changes on the server or in Azure)
      description: >-
        A vault with connected websites answers 409 ALC-AKV-0020 unless remove_bindings=true, which removes its
        connections with it. remove_bindings=true needs an Administrator's browser session with a fresh step-up
        (403 ALC-AUTH-0003 without it, 403 ALC-AUTH-0002 for an API token). Refused with 403 ALC-LIC-0001 while the
        license is locked.
      x-permission: targets.manage
      x-scope: resource
      parameters:
        - { name: remove_bindings, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/actions/test:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: testTarget
      summary: Test the SSH connection of a server, or run a Key Vault's access check (runs as a job)
      description: >-
        For a vault the body is optional: read_secret_of, a vault certificate id, makes the job also read that
        certificate's current secret once, which proves the Key Vault Secrets User role (422 ALC-AKV-0013 when the
        key is not exportable, ALC-AKV-0021 when Alice has not read a current version). Refused with 403
        ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      x-scope: resource
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessCheckRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/actions/discover:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: discoverTarget
      summary: Scan the server's authorized_keys files and host keys, or poll a Key Vault now (Check now) (runs as a job)
      description: >-
        For a vault this queues a poll of its certificates, keys and secrets. Refused with 403 ALC-LIC-0001 while
        the license is locked.
      x-permission: inventory.operate
      x-scope: resource
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listHostKeys
      summary: The server's pinned, observed and superseded host keys
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: Host keys, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostKeyList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys/{key_id}/actions/confirm:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/KeyID" }
    post:
      operationId: confirmHostKey
      summary: Pin the fingerprint the server presented on first contact (TOFU with human confirmation)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: hostkeys.confirm
      x-scope: resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostKeyConfirm" }
      responses:
        "202":
          description: Pinned; job_id is the next connection test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys/{key_id}/actions/repin:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/KeyID" }
    post:
      operationId: repinHostKey
      summary: Accept a changed fingerprint (step-up and a reason required; the old one is kept as superseded)
      description: >-
