      x-permission: certificates.operate
      x-scope: resource
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/bindings/{id}/auto-deploy:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    put:
      operationId: setAutoDeploy
      summary: Switch automatic deployment of a connection on or off (If-Match with the ETag is required)
      description: >-
        Switching on records the moment it happened: only versions found after it are deployed by themselves, and a stopped
        wave is forgotten. 422 ALC-AKV-0013 when the key is not exportable. Switching it off is a safety action that also works while the
        license is locked; switching it on is refused with 403 ALC-LIC-0001 then. Needs an Administrator's browser session with a fresh step-up verification code (403 ALC-AUTH-0003 without it) and is never available to API tokens (403 ALC-AUTH-0002).
      x-permission: credentials.manage
      x-scope: resource
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoDeployRequest" }
      responses:
        "200":
          description: The connection
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Binding" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/bindings/{id}/actions/deploy:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: deployBinding
      summary: Deploy now - deploy one stored version of the certificate to the connection's websites (one deployment and one job per website)
      description: >-
        version_id is the id of a version in the certificate's version list (never "the latest"); location_ids absent means every
        website of the connection. All or nothing. Refusals: 409 ALC-AKV-0021 (Alice has not read the version's details yet; a version
        id the certificate does not have is 404, like an unknown one), 409 ALC-AKV-0014 (disabled), 422 ALC-AKV-0013 (key not exportable), 409 ALC-AKV-0015 (certificate gone), 409
        ALC-AKV-0033 (vault disabled), 422 ALC-CRT-0003 and 409 ALC-CRT-0014 (expired, not yet valid), 409 ALC-CRT-0011 (an
        incomplete chain; an Administrator's confirm_incomplete_chain), and the Phase 4 refusals of a deployment. A held version
        is deployed by an Administrator only, with a fresh step-up and no API token (an Operator: 403 ALC-AKV-0022; an
        Administrator without step-up: 403 ALC-AUTH-0003; a token: 403 ALC-AUTH-0002); holding stays. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: certificates.operate
      x-scope: resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindingDeploy" }
      responses:
        "202":
          description: Queued; follow each job (status_url) or deployment (deployment_url)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/{id}/actions/import-to-key-vault:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: importToKeyVault
      summary: Import a certificate Alice holds, with its private key, into a vault (runs as a job; never sent twice)
      description: >-
        target_id is the vault, name the certificate name in it (letters, digits and hyphens, 1 to 127). A name the vault already
        has is refused with 409 ALC-AKV-0023 (params certificate_name, bound and auto_deploy_follows: "true" when a connection
        with automatic deployment on names the certificate, so automatic deployment may deploy the new version: it still holds
        an incomplete chain or a version found while the license is not available) until the request
        carries confirm_new_version: true. 409 ALC-AKV-0024 (an import of this name is open), ALC-CRT-0009 (no private key), 422 ALC-CRT-0003
        (expired), 409 ALC-CRT-0014 (not yet valid), 422 ALC-CRT-0007 (key type), 422 ALC-CRT-0001 (the stored certificate cannot
        be read back), 409 ALC-AKV-0033 (vault disabled). The PFX is built inside Alice and never
        returned. If the answer of the vault is lost the import stays uncertain: it is never sent again, a poll that sees its
        thumbprint settles it, and otherwise it ends as ALC-AKV-0026. Needs an Administrator's browser session with a fresh step-up verification code (403 ALC-AUTH-0003 without it) and is never available to API tokens (403 ALC-AUTH-0002). Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: credentials.manage
      x-scope: cross
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/export:
    get:
      operationId: exportCertificates
      summary: The certificate list as a CSV file, with the list's filters (no cursor, no limit)
      description: >-
        The whole list for the filters, in the list's order: UTF-8 with a byte order mark, a header row
        (id,subject_cn,label,sans,issuer,serial,not_before,not_after,days_left,source,key_algorithm,key_bits,self_signed,chain_complete,fingerprint,location_count;
        SANs separated by a space, times RFC 3339 UTC), then one row per certificate. Cells that start with =, +, -, @, a
        tab, a carriage return or a line feed get a leading apostrophe, so a spreadsheet never runs them as a
        formula. No private key and no PEM is ever part of an export. The export is recorded in the audit log
        (inventory.exported with the filters and the row count) before the first byte is sent. At most 50,000 rows: a filter that matches more is
        refused with 409 ALC-RPT-0001 before anything is written (a JSON error, no file); Alice counts the rows first and
        then streams them, so rows added between the count and the end of the file can make the file stop at 50,000
        rows without an error. One export at a time per person (409 ALC-RPT-0004, retryable, Retry-After); at most 10
        exports per minute per user or token (429). cursor or limit is refused with 422. HEAD is refused with 405
        ALC-SYS-0009 without running the export. Works while the license is
        expired. A failure after the first byte aborts the connection: a cut file never looks complete.
      x-permission: read
      x-scope: list
      parameters:
        - { name: service_id, in: query, description: "R49: rows owned by these services (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: environment_id, in: query, description: "R49: rows owned by services of these environments (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [discovered, uploaded, csr, azure_kv, acme] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: expiry, in: query, required: false, schema: { type: string, enum: [expired, "7", "14", "30", "60", "90"] } }
      responses:
        "200":
          description: >-
            The file, with Content-Disposition: attachment; filename="alice-certificates-<yyyy-mm-dd>.csv",
            Cache-Control: no-store and X-Content-Type-Options: nosniff.
          content:
            text/csv:
              schema: { type: string }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/export:
    get:
      operationId: exportSSHKeys
      summary: The SSH key list as a CSV file, with the list's filters (no cursor, no limit)
      description: >-
        As GET /api/v1/certificates/export, with the header row
        id,fingerprint,key_type,bits,comment,managed,platform_key,weak,location_count,target_count,missing,retired,first_seen_at
        and the file name alice-ssh-keys-<yyyy-mm-dd>.csv. No key material besides the public fingerprint is exported.
      x-permission: read
      x-scope: list
      parameters:
        - { name: service_id, in: query, description: "R49: rows owned by these services (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: environment_id, in: query, description: "R49: rows owned by services of these environments (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: os_user, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: flag, in: query, required: false, schema: { type: string, enum: [weak, command, root_without_from, duplicate, cert_authority, security_key] } }
        - { name: missing, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: The file (headers as the certificate export).
          content:
            text/csv:
              schema: { type: string }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: The Dashboard's figures, filtered for the caller's role
      description: >-
        The certificate counts are cumulative windows with the certificate list's meaning (expired: not_after at or
        before now; within_N: not_after before now + N days, expired ones included), so each count equals the rows its
        list link shows. kv_expired and kv_within_30 count Key Vault keys and client secrets. notifications is null
        except for Administrators and their API tokens; audit is null for Operators (and before the first checkpoint); for Operators
        license.phase is "" and license.ends_at and license.days_left are null.
      x-permission: read
      x-scope: any
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/dashboard/expiring:
    get:
      operationId: listExpiring
      summary: Certificates in use and Key Vault certificates, keys and client secrets that expire soon, soonest first
      x-permission: read
      x-scope: any
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 }, description: 'Expiring within this many days (expired ones included)' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: The items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ExpiringItem" } }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: What needs attention now, newest first, filtered for the caller's role
      description: >-
        Servers whose identity changed or whose sign-in failed and failed deployments for everyone; a broken audit
        chain for Administrators and Auditors; failing e-mail delivery for Administrators only.
      x-permission: read
      x-scope: list
      responses:
        "200":
          description: The conditions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Condition" } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/notifications/status:
    get:
      operationId: getNotificationStatus
      summary: The state behind the "E-mails could not be sent" banner
      description: >-
        Administrators and their API tokens (a token acts with its owner's role) get the delivery state, with the closed
        label of the last failure (for example smtp.auth); every other role gets only {"failing": false}.
      x-permission: read
      x-scope: any
      responses:
        "200":
          description: The delivery state
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Delivery" }
                  - type: object
                    required: [failing]
                    additionalProperties: false
                    properties:
                      failing: { type: boolean, const: false }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/views:
    get:
      operationId: listViews
      summary: The caller's saved views of one list page, by name
      x-permission: session
      x-scope: self
      parameters:
        - { name: page, in: query, required: true, schema: { type: string, enum: [certificates, ssh_keys] } }
      responses:
        "200":
          description: The views
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/View" } }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createView
      summary: Save the current filters of a list page under a name (private to the caller)
      description: >-
        Keys are matched exactly; query holds only the page's filter keys (certificates: target_id, source, q, expiry;
        ssh_keys: target_id, os_user, q, flag, missing), each value at most 200 characters. The name is 1 to 60
        characters and unique per person and page in any letter case (409 ALC-RPT-0003). At most 50 views per person
        (409 ALC-RPT-0002). Works while the license is expired.
      x-permission: session
      x-scope: self
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewInput" }
      responses:
        "201":
          description: The saved view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/views/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: deleteView
      summary: Delete one of the caller's saved views (another person's view is not found)
      x-permission: session
      x-scope: self
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/smtp:
    get:
      operationId: getSMTPSettings
      summary: The mail server settings (never the password)
      description: ETag is the settings version, "0" when no mail server is configured.
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The settings
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTP" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putSMTPSettings
      summary: Set the mail server (If-Match with the ETag is required; "0" for the first save)
      description: >-
        Keys are matched exactly. Every key but password must be present: an omitted one is 422 with
        validation.required on that field and nothing is stored (null is 400). password: absent or null keeps the stored
        one, "" removes it, any other value replaces it; it is stored sealed and never returned or logged. A user name needs a password: with a user name and no
        stored or new password the answer is 422 with validation.required on password. 412 ALC-SYS-0008 when the
        If-Match header is missing (answered first, before the body is read) or names another version. Changing the
        server name or port forgets a certificate a test e-mail saw. Works while the license is expired.
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SMTPInput" }
      responses:
        "200":
          description: The stored settings
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTP" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSMTPSettings
      summary: Remove the mail settings and the stored password (If-Match required)
      description: >-
        E-mails are then recorded as skipped. The ALICE_SMTP_* variables are not imported again. 409 ALC-NTF-0002 when
        nothing is configured.
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/smtp/actions/test:
    post:
      operationId: sendTestMail
      summary: Send a test e-mail now through the stored settings, in the caller's language
      description: >-
        At most 5 per minute per user (429). Every attempt is recorded in the audit log. Refusals carry no text of the
        mail server: 409 ALC-NTF-0002 (not configured), 502 ALC-NTF-0003 (connection, retryable), 0004 (encryption),
        0005 (certificate not trusted; params fingerprint, subject, not_after of the certificate the server presented,
        which can then be trusted within one hour), 0006 (sign-in), 0007 (message refused), 409 ALC-NTF-0009 (address
        Alice never connects to); 422 when to is not an address.
      x-permission: settings.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/smtp/actions/trust:
    post:
      operationId: trustSMTPCertificate
      summary: Trust exactly the certificate a failed test e-mail showed in the last hour (If-Match required)
      description: >-
        Alice then accepts the mail server only when it presents a certificate with this SHA-256 fingerprint (the name
        and the expiry are not checked: the fingerprint is the decision). 409 ALC-NTF-0008 when no test e-mail to the
        configured server and port saw this fingerprint in the last hour.
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              additionalProperties: false
              properties:
                fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        "200":
          description: The settings with the trusted certificate
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTP" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/smtp/actions/untrust:
    post:
      operationId: untrustSMTPCertificate
      summary: Stop trusting the pinned certificate (If-Match required; the body is empty or {})
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"4"'] } }
      responses:
        "200":
          description: The settings without a trusted certificate
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTP" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/notifications:
    get:
      operationId: getRecipients
      summary: 'Who receives the e-mails Alice sends to Administrators (never saved: every Administrator, version 0)'
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The recipients
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipients" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putRecipients
      summary: Set the recipients (If-Match required; "0" for the first save)
      description: >-
        At most 20 extra addresses, each a bare address with the language of what is sent to it; at least one source
        (administrators or an address). Each address object has exactly the keys email and locale. Both keys must be
        present: an omitted one is 422 with validation.required on that field and nothing is stored (null is 400).
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientsInput" }
      responses:
        "200":
          description: The stored recipients
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipients" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/alerts:
    get:
      operationId: getAlertSettings
      summary: 'The expiry thresholds in days, largest first (never saved: 60, 30, 14, 7, 1 at version 0)'
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The thresholds
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putAlertSettings
      summary: Set the expiry thresholds (If-Match required; "0" for the first save)
      description: >-
        1 to 10 different whole days from 1 to 365; refusals are 422 field errors on thresholds_days
        (validation.required, validation.too_long, validation.out_of_range, validation.duplicate).
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thresholds_days]
              additionalProperties: false
              properties:
                thresholds_days: { type: array, minItems: 1, maxItems: 10, items: { type: integer, minimum: 1, maximum: 365 } }
      responses:
        "200":
          description: The stored thresholds
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/general:
    get:
      operationId: getGeneralSettings
      summary: Alice's own address and how long retired SSH private keys are kept
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The general settings
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putGeneralSettings
      summary: Set the general settings (If-Match required; "0" for the first save)
      description: >-
        Both keys must be present: an omitted one is 422 with validation.required on that field and nothing is stored
        (null is 400).
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_url, retired_key_retention_days]
              additionalProperties: false
              properties:
                public_url: { type: string, description: '"" or https://host[:port] (no path other than /, no query, fragment or user info)' }
                retired_key_retention_days: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "200":
          description: The stored settings
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/revocation-checks:
    get:
      operationId: getRevocationCheckSettings
      summary: Whether Alice asks the certificate authorities whether certificates were revoked (R64)
      description: >-
        Absent (a new installation) reads as on; an installation updated to this release starts off until an administrator
        switches it on.
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The switch
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationCheckSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putRevocationCheckSettings
      summary: Switch the revocation check on or off (If-Match required; "0" before the first save)
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The stored switch
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationCheckSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/oidc/providers:
    get:
      operationId: listPublicIdentityProviders
      summary: The identity providers the sign-in page offers (switched on; ID and name only)
      x-permission: public
      x-scope: none
      responses:
        "200":
          description: The providers, by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PublicProvider" } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/oidc/{id}/start:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: startSingleSignOn
      summary: Begin a single sign-on at an identity provider
      description: >-
        Stores a single-use sign-in state (10 minutes) and answers the provider's authorize address, with the
        __Host-alice_oidc cookie (Secure, HttpOnly, SameSite=Lax, Path=/, Max-Age 600) that binds the sign-in to this
        browser. The body is empty or {"next"}: a path inside Alice (anything else becomes /). 10 per minute per address
        (429), as the sign-in form. 404 for an unknown provider, 403 ALC-SSO-0013 for a switched-off one (provider IDs are random; the answer helps a person with a stale link), 409
        ALC-SSO-0004 while Alice's address is not set.
      x-permission: public
      x-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                next: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Where to send the browser
          headers:
            Set-Cookie: { schema: { type: string }, description: '__Host-alice_oidc=<binding>' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizeURL" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/oidc/{id}/callback:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: finishSingleSignOn
      summary: The identity provider's redirect back to Alice (always answered with a redirect, never a JSON page)
      description: >-
        The only GET that changes state (A-06 exception): it consumes the sign-in state and signs the person in or
        confirms their step-up. The __Host-alice_oidc cookie is cleared whatever happens. Success: 303 to the path the
        sign-in started from, with the session cookie. Refusal: 303 to /login?sso_error=<reason> (a sign-in) or to the
        page the step-up started from with sso_error=<reason> (before any fragment); the reason is one of
        sso.no_access, sso.groups_overage, sso.email_in_use, sso.idp_unreachable, sso.login_invalid, sso.login_expired,
        sso.user_disabled, sso.provider_disabled, sso.stepup_other_user, sso.idp_error (ALC-SSO-0006..0015). Every
        refusal writes an auth.oidc.denied audit entry, except that a callback naming no stored state (none, an unknown
        or an already used one) is audited at most once a minute per client address. Nothing of
        the provider's answer is shown. Limited to 10 per minute per binding cookie (one browser's retries) and to the
        anonymous 60 per minute per address (S-11; not the sign-in form's 10, so the browsers behind one company address
        still finish their sign-ins). HEAD is refused with 405 ALC-SYS-0009 without completing anything.
      x-permission: public
      x-scope: none
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "303":
          description: To the next page, or to the sign-in or step-up page with sso_error
          headers:
            Location: { schema: { type: string } }
        "405": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/oidc/stepup:
    post:
      operationId: startSingleSignOnStepUp
      summary: Begin an SSO user's step-up at their identity provider (a fresh sign-in there)
      description: >-
        As the start, for the signed-in SSO user's own provider (prompt=login, max_age=0). The callback opens the
        step-up window of this session when the same person answers within 5 minutes. A local user is refused with 409
        ALC-SSO-0016 (confirm with the authenticator code instead). At most 5 per minute per address.
      x-permission: session
      x-scope: self
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                next: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Where to send the browser
          headers:
            Set-Cookie: { schema: { type: string }, description: '__Host-alice_oidc=<binding>' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizeURL" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/ldap/directories:
    get:
      operationId: listPublicDirectories
      summary: The directories the sign-in page offers under "Sign in to" (switched on; ID and name only, never an address)
      x-permission: public
      x-scope: none
      responses:
        "200":
          description: The directories, by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PublicDirectory" } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/ldap/{id}/login:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: directoryLogin
      summary: Sign in with a directory (LDAP or Active Directory) password
      description: >-
        The answer and the cookies are the sign-in form's: a pending session cookie for the MFA step (status
        mfa_required or mfa_enrollment_required, then /auth/mfa/enroll and /auth/mfa/verify), or, when the directory
        does not ask for MFA, a full session cookie at once (status signed_in). Limits come first: 10 per minute per
        address, as the sign-in form, and a lockout per directory and sign-in name (NFC, case-folded): after 3 failed
        passwords within 30 minutes the name is not sent to the directory for 45 minutes, even with the right password,
        for unknown names too; a successful sign-in clears the failures (429 ALC-SYS-0005 with Retry-After, answered at
        once). Every refusal that could tell something about the person (unknown name, wrong
        password, no mapped group, a disabled or locked user, an e-mail of a local account, several entries, a name that
        cannot be sent) is the same 401 ALC-LDAP-0001, written to the audit log as auth.ldap.denied with its reason, and
        takes at least 1.5 seconds. A directory that is unreachable, misconfigured, switched off or unknown is 503
        ALC-LDAP-0002. The password is never stored, logged or returned.
      x-permission: public
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024, writeOnly: true }
      responses:
        "200":
          description: Password accepted; MFA is next, or the person is signed in
          content:
            application/json:
              schema:
                type: object
                required: [status, csrf_token]
                properties:
                  status: { type: string, enum: [mfa_required, mfa_enrollment_required, signed_in] }
                  csrf_token: { type: string, description: Send as X-CSRF-Token on the next requests }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/ldap/stepup:
    post:
      operationId: directoryStepUp
      summary: Confirm a directory user's identity with the directory password (and the authenticator code) for 5 minutes
      description: >-
        The directory checks the password again for the sign-in name Alice stored at the user's last sign-in (the caller
        cannot name another) and must answer for the user's own entry; the groups give the role again, and, when the
        directory asks for MFA, code must be a valid authenticator code (401 ALC-AUTH-0006 when it is not; 409
        ALC-LDAP-0007 when the user has no authenticator yet). A wrong password, another entry, a disabled user or no
        mapped group is 401 ALC-LDAP-0001, recorded with the user as the actor and taking at least 1.5 seconds (no mapped
        group also ends the user's sessions). A user who does not sign in through a directory is refused with 409
        ALC-LDAP-0008. 5 per minute per address, and the sign-in's lockout per directory and name. The session ID is
        regenerated.
      x-permission: session
      x-scope: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, maxLength: 1024, writeOnly: true }
                code: { type: string, maxLength: 16 }
      responses:
        "200":
          description: Step-up active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/sso/providers:
    get:
      operationId: listIdentityProviders
      summary: The configured identity providers, by name (never a client secret)
      x-permission: sso.manage
      x-scope: platform
      responses:
        "200":
          description: The providers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/IdentityProvider" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createIdentityProvider
      summary: Add an identity provider (its discovery document is read once; its endpoints are fixed then)
      description: >-
        Keys are matched exactly. At most 5 providers (422 validation.out_of_range on name). 502 ALC-SSO-0001 when the
        discovery document or the key list cannot be read (param cause). The client secret is stored sealed and is never
        returned or logged. A provider is created switched off unless enabled is true (switch it on once Alice's address
        is set and the provider is registered). Works while the license is expired.
      x-permission: sso.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderCreate" }
      responses:
        "201":
          description: The provider
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/sso/providers/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getIdentityProvider
      summary: One identity provider
      x-permission: sso.manage
      x-scope: platform
      responses:
        "200":
          description: The provider
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateIdentityProvider
      summary: Change an identity provider (If-Match required; only the keys given change)
      description: >-
        A new issuer address or CA bundle reads discovery again (502 ALC-SSO-0001 on failure). An issuer change is
        refused while people have signed in through the provider. null is not a value (400). client_secret replaces the
        stored secret. 412 ALC-SYS-0008 when If-Match is missing or names another version.
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderPatch" }
      responses:
        "200":
          description: The changed provider
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteIdentityProvider
      summary: Delete an identity provider and its group mappings (If-Match required)
      description: 409 ALC-SSO-0005 while people have signed in through it (switch it off instead).
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/sso/providers/{id}/actions/refresh:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: refreshIdentityProvider
      summary: Read the provider's discovery document and key list again (If-Match required; the body is empty or {})
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      responses:
        "200":
          description: The provider
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/sso/group-mappings:
    get:
      operationId: listGroupMappings
      summary: A provider's group mappings, by group
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: provider_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The mappings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Mapping" } }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroupMapping
      summary: Give the members of a group a role
      description: >-
        At most 200 mappings (422 validation.out_of_range on group). A group can be mapped to Administrator only while
        "SSO users may be Admin" is on (409 ALC-SSO-0002, recorded in the audit log). A person with several mapped groups
        gets the highest role.
      x-permission: sso.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, group, role]
              additionalProperties: false
              properties:
                provider_id: { type: string, format: uuid }
                group: { type: string, minLength: 1, maxLength: 255 }
                role: { type: string, enum: [admin, operator, auditor] }
      responses:
        "201":
          description: The mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mapping" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/sso/group-mappings/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: deleteGroupMapping
      summary: Remove a group mapping of the provider named by provider_id
      description: 404 when that provider has no mapping with this ID. Sessions of people whose role it gave end at their next sign-in check.
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: provider_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/sso/settings:
    get:
      operationId: getSSOSettings
      summary: The "SSO users may be Admin" switch (never saved - off, version 0)
      x-permission: sso.manage
      x-scope: platform
      responses:
        "200":
          description: The switch
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putSSOSettings
      summary: Switch "SSO users may be Admin" (If-Match required; "0" for the first save)
      description: >-
        The switch covers single sign-on and directory users alike. Switching it off is refused while groups of an
        identity provider or a directory are mapped to Administrator (409 ALC-SSO-0003); it then demotes SSO and directory
        Administrators to Operator and ends their sessions. allow_admin_role is required (422 validation.required when it
        is missing; null is 400): the switch is never turned off by an omitted key.
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_admin_role]
              additionalProperties: false
              properties:
                allow_admin_role: { type: boolean }
      responses:
        "200":
          description: The switch
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ldap/directories:
    get:
      operationId: listDirectories
      summary: The configured directories, by name (never the service account password)
      x-permission: sso.manage
      x-scope: platform
      responses:
        "200":
          description: The directories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Directory" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDirectory
      summary: Add a directory (LDAP or Active Directory); nothing is dialled (Test connection checks the settings)
      description: >-
        Keys are matched exactly; null is not a value (400). At most 3 directories (409 ALC-LDAP-0005). The service
        account password is stored sealed and is never returned or logged. A directory is created switched off unless
        enabled is true, and with MFA on unless mfa_required is false. Field errors are 422 ALC-SYS-0006. Works while the
        license is expired.
      x-permission: sso.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryCreate" }
      responses:
        "201":
          description: The directory
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directory" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ldap/directories/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getDirectory
      summary: One directory
      x-permission: sso.manage
      x-scope: platform
      responses:
        "200":
          description: The directory
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directory" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateDirectory
      summary: Change a directory (If-Match required; only the keys given change)
      description: >-
        An omitted bind_password keeps the stored one. A change that would send the stored password to another server or
        account (a new address, bind DN, unique ID attribute or certificate authority) needs bind_password again (422).
        While people have signed in through the directory its addresses and unique ID attribute cannot change (409
        ALC-LDAP-0003). null is not a value (400). 412 ALC-SYS-0008 when If-Match is missing or names another version.
        Switching the directory off (enabled from true to false) ends, in the same transaction, every session and API
        token of its users: each user who had one gets a user.sessions_ended row (reason provider_disabled) and each
        token a token.revoked row, and the ldap.directory_changed row carries signed_out_count. A sign-in whose password
        the directory accepted just before is refused (503 ALC-LDAP-0002).
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryPatch" }
      responses:
        "200":
          description: The changed directory
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directory" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDirectory
      summary: Delete a directory, its group mappings and its stored password (If-Match required)
      description: 409 ALC-LDAP-0003 while people have signed in through it (switch it off instead).
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ldap/directories/{id}/actions/test-connection:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: testDirectoryConnection
      summary: Bind as the service account and search the user base DN once (the body is empty or {})
      description: >-
        Uses the stored settings, also of a directory that is switched off. A failure is 422 ALC-LDAP-0004 with params
        reason and detail (closed labels, never the server's text). Every run is recorded in the audit log. 5 per minute
        per user, shared with Test sign-in.
      x-permission: sso.manage
      x-scope: platform
      responses:
        "200":
          description: The connection works
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result: { type: string, enum: [ok] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ldap/directories/{id}/actions/test-signin:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: testDirectorySignIn
      summary: Run a directory sign-in without signing anyone in; shows the groups found and the role they would give
      description: >-
        Uses the stored settings, also of a directory that is switched off. The password is never stored. A refused
        attempt is 422 ALC-LDAP-0006 with params reason and detail. Every run is recorded in the audit log with the
        sign-in name and the result. 5 per minute per user, shared with Test connection.
      x-permission: sso.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024, writeOnly: true }
      responses:
        "200":
          description: Who the directory says the person is, and the role (null when no group is mapped)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryTestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ldap/group-mappings:
    get:
      operationId: listDirectoryGroupMappings
      summary: A directory's group mappings, by group
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: directory_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The mappings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DirectoryMapping" } }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDirectoryGroupMapping
      summary: Give the members of a directory group a role
      description: >-
        group is the value exactly as the group search returns it (a DN or the group name attribute; matched exactly and
        case-sensitively: copy it from Test sign-in). At most 200 mappings per directory (422 validation.out_of_range on
        group). A group can be mapped to Administrator only while "SSO users may be Admin" is on (409 ALC-SSO-0002,
        recorded in the audit log). A person with several mapped groups gets the highest role.
      x-permission: sso.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directory_id, group, role]
              additionalProperties: false
              properties:
                directory_id: { type: string, format: uuid }
                group: { type: string, minLength: 1, maxLength: 1024 }
                role: { type: string, enum: [admin, operator, auditor] }
      responses:
        "201":
          description: The mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryMapping" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ldap/group-mappings/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: deleteDirectoryGroupMapping
      summary: Remove a group mapping of the directory named by directory_id
      description: 404 when that directory has no mapping with this ID. The role of people it gave changes at their next sign-in or step-up.
      x-permission: sso.manage
      x-scope: platform
      parameters:
        - { name: directory_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/backups:
    get:
      operationId: listBackups
      summary: The backups in the backups directory, newest first, with the backup state and the schedule
      description: >-
        check is the shallow check of each file (header, size and checksum; ok, missing checksum, checksum mismatch,
        unreadable header, or unreadable with code permission_denied or io). state.free_bytes is the free space of the
        backups directory. Administrators with step-up only; never an API token. Works while the license is expired.
      x-permission: backup.manage
      x-scope: platform
      responses:
        "200":
          description: The backups
          content:
            application/json:
              schema:
                type: object
                required: [items, state, schedule]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
                  state: { $ref: "#/components/schemas/BackupState" }
                  schedule: { $ref: "#/components/schemas/BackupSchedule" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createBackup
      summary: Make a backup now (kind manual)
      description: >-
        The body is empty or {}. At most 5 per minute per user (429). 409 ALC-BAK-0001 while another backup is being
        made (retryable), 409 ALC-BAK-0002 before the recovery passphrase is set, 500 ALC-BAK-0004 when the file could
        not be written (also when the free space is under twice the newest backup plus 1 GiB). Audited backup.created
        or backup.failed. Works while the license is expired.
      x-permission: backup.manage
      x-scope: platform
      responses:
        "201":
          description: The backup made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/backups/{name}/download:
    get:
      operationId: downloadBackup
      summary: Download one backup file (encrypted; it opens only with the recovery passphrase)
      description: >-
        name must be a backup file name Alice gives or accepts (alice-backup-<ID8>-<time>-<kind>.alicebak, or a name
        ending in .alicebak without a path separator, control character or leading dot); anything else is 404
        ALC-BAK-0003 without touching the file system. The download is audited (backup.downloaded) before the first
        byte. No range requests (Accept-Ranges none); HEAD is 405. At most 5 per minute per user.
      x-permission: backup.manage
      x-scope: platform
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: The file
          headers:
            Content-Disposition: { schema: { type: string, examples: ['attachment; filename="alice-backup-7F3K92QD-20261010T023000Z-auto.alicebak"'] } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/backups:
    get:
      operationId: getBackupSchedule
      summary: The daily backup schedule (ETag is its version, "0" before the first save)
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The schedule
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putBackupSchedule
      summary: Set the daily backup time, its time zone and the number of automatic backups kept (If-Match required)
      description: >-
        time is HH:MM (00:00..23:59), zone an IANA time zone, retention 7..60; 422 with field errors otherwise. 412
        ALC-SYS-0008 when If-Match is missing or names another version. Audited backup.settings_changed. Works while the
        license is expired.
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [time, zone, retention]
              properties:
                time: { type: string, pattern: '^[0-9]{2}:[0-9]{2}$', examples: ["02:30"] }
                zone: { type: string, examples: [Europe/Istanbul] }
                retention: { type: integer, minimum: 7, maximum: 60 }
      responses:
        "200":
          description: The stored schedule
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/https:
    get:
      operationId: getHTTPSCertificate
      summary: The HTTPS certificate Alice serves (never its key)
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPSInfo" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putHTTPSCertificate
      summary: Install an HTTPS certificate (applied without a restart)
      description: >-
        Either cert_pem and key_pem (the certificate with its chain, and one unencrypted private key) or pfx_base64 with
        pfx_password. Refusals change nothing: 422 ALC-TLS-0001 (key does not match), 0002 (not valid now or for less
        than a day), 0003 (key type or size), 0004 (PFX password), 0005 (unreadable upload). The answer's warnings name
        name_mismatch, chain_incomplete and expires_soon. The key and the password never appear in an answer, a log or
        the audit row https.certificate_replaced. At most 5 per minute per user.
      x-permission: settings.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cert_pem: { type: string }
                key_pem: { type: string, writeOnly: true }
                pfx_base64: { type: string, writeOnly: true }
                pfx_password: { type: string, writeOnly: true }
      responses:
        "200":
          description: The certificate now in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPSInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/https/keep-temporary:
    post:
      operationId: setupKeepTemporaryCertificate
      summary: The wizard's HTTPS step - keep Alice's temporary certificate for now
      description: Audited setup.https_kept_temporary. After completion it answers the status and changes nothing.
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/mail/skip:
    post:
      operationId: setupSkipMail
      summary: The wizard's mail step - skip it for now
      description: Audited setup.mail_skipped. After completion, or with mail settings stored, it answers the status and changes nothing.
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/audit-forwarding:
    get:
      operationId: getAuditForwarding
      summary: Audit forwarding to syslog, with its progress (the CA bundle is write-only)
      x-permission: settings.manage
      x-scope: platform
      responses:
        "200":
          description: The setting
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forwarding" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putAuditForwarding
      summary: Set audit forwarding (If-Match required; "0" for the first save)
      description: >-
        ca_pem absent keeps the stored CA bundle, "" removes it, PEM certificates replace it. 422 with field errors, 422
        ALC-AUD-0002 for an address Alice never connects to, 412 ALC-SYS-0008 for a missing or stale If-Match. Audited
        audit.forwarding_changed (without the bundle).
      x-permission: settings.manage
      x-scope: platform
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"0"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwardingInput" }
      responses:
        "200":
          description: The stored setting
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forwarding" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/audit-forwarding/test:
    post:
      operationId: testAuditForwarding
      summary: Send one test message with the given settings (not saved)
      description: >-
        204 when it was written; 502 ALC-AUD-0003 (unreachable, retryable), 502 ALC-AUD-0004 (certificate not trusted),
        422 ALC-AUD-0002 (an address Alice never connects to). At most 5 per minute per user.
      x-permission: settings.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwardingInput" }
      responses:
        "204": { description: Sent }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/providers:
    get:
      operationId: listACMEProviders
      summary: Certificate authorities (ACME providers), oldest first
      description: >-
        No secret is listed: the EAB HMAC key is write-only (eab_configured). The CA bundle holds public certificates only.
      x-permission: acme.view
      x-scope: any
      responses:
        "200":
          description: The providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEProviderList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createACMEProvider
      summary: Add a certificate authority (no network call is made)
      description: >-
        directory_url must be https without user information. The first contact with the CA is the account registration.
        allowed_suffixes is the name allow-list (A9): an empty list refuses every order. 409 ALC-ACM-0020 (name taken),
        422 validation errors (directory URL, CA bundle, EAB key id or HMAC key). Needs an Administrator's browser session with a
        fresh step-up (403 ALC-AUTH-0003 without it), never an API token (403 ALC-AUTH-0002). Refused with 403 ALC-LIC-0001
        while the license is locked.
      x-permission: acme.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACMEProviderCreate" }
      responses:
        "201":
          description: The provider
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/providers/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getACMEProvider
      summary: One certificate authority with its accounts (newest first)
      x-permission: acme.view
      x-scope: any
      responses:
        "200":
          description: The provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEProvider" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateACMEProvider
      summary: Change a certificate authority (absent fields stay)
      description: >-
        eab_kid with eab_hmac replaces the external account binding, remove_eab drops it. A new directory_url while the provider
        has an active account needs confirm_directory_change (409 ALC-ACM-0022 otherwise; the account is then retired). 409
        ALC-ACM-0024 while a key change is unsettled. Administrator with a fresh step-up, never an API token. Refused with 403
        ALC-LIC-0001 while the license is locked.
      x-permission: acme.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACMEProviderPatch" }
      responses:
        "200":
          description: The provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteACMEProvider
      summary: Remove a certificate authority
      description: >-
        409 ALC-ACM-0012 while it has an active or pending account or live ACME certificates (deactivate the account and delete
        the certificates first). Administrator with a fresh step-up, never an API token. Refused with 403 ALC-LIC-0001 while the
        license is locked.
      x-permission: acme.manage
      x-scope: platform
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/providers/{id}/account:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: registerACMEAccount
      summary: Register the provider's account at the certificate authority
      description: >-
        Contacts the CA. When the CA publishes terms of service, tos_accepted must be true (422 ALC-ACM-0003 otherwise; nothing
        is registered; also when accepted_terms_url is given and the CA's terms changed since the preview showed them).
        contact_email is optional, an e-mail address only (a mailto: prefix is accepted). 409 ALC-ACM-0021 (the
        provider has an account), 409 ALC-ACM-0024 (another account operation is running; Retry-After), 422 ALC-ACM-0004
        (account refused, e.g. EAB), 502 ALC-ACM-0001/0002/0013, 503 ALC-ACM-0005 with Retry-After (the CA's rate limit).
        Administrator with a fresh step-up, never an API token. At most 10 a minute per user. Refused with 403 ALC-LIC-0001
        while the license is locked (the CA is not contacted).
      x-permission: acme.manage
      x-scope: platform
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACMEAccountRegister" }
      responses:
        "201":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/providers/{id}/preview:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: previewACMEProvider
      summary: Read the certificate authority's directory before registering its account (for the registration form)
      description: >-
        Contacts the CA (its directory only: no key, no nonce, no account; nothing is stored, no secret is read). Answers the
        terms of service URL to show with the acceptance box (only a safe https link: otherwise terms_url_unsafe is true and the
        URL is empty, and the form should not offer the registration), whether an external account binding is required, and
        the optional resources. Pass the URL shown as accepted_terms_url when registering. 404 for an unknown or deleted
        provider; 502 ALC-ACM-0001 (unreachable), ALC-ACM-0002 (not an ACME directory), ALC-ACM-0013 (TLS trust); 503
        ALC-ACM-0005 with Retry-After. An Administrator's browser session without a step-up (403 ALC-AUTH-0002 for anyone else
        and for every API token). At most 10 a minute per user. Refused with 403 ALC-LIC-0001 while the license is locked (the
        CA is not contacted).
      x-permission: acme.preview
      x-scope: platform
      responses:
        "200":
          description: What the directory says
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEProviderPreview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/accounts/{id}/rollover:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: rolloverACMEAccount
      summary: Change the account key at the certificate authority (answers the new active account)
      description: >-
        Contacts the CA. 422 ALC-ACM-0014 when the CA cannot change keys; 409 ALC-ACM-0024 when the outcome is not known yet
        (check it with rollover/recover) or another account operation is running; 409 ALC-ACM-0023 (not an active account);
        409 ALC-ACM-0016 while an order of a certificate of the provider runs (it signs with the key being replaced).
        Administrator with a fresh step-up, never an API token. At most 10 a minute per user. Refused with 403 ALC-LIC-0001
        while the license is locked.
      x-permission: acme.manage
      x-scope: platform
      responses:
        "200":
          description: The new active account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEAccount" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/accounts/{id}/rollover/recover:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: recoverACMERollover
      summary: Check key change - settle a key change whose outcome Alice did not learn
      description: >-
        Asks the CA which key it knows (the active or the pending account's id). 409 ALC-ACM-0024 when it cannot be settled
        yet. Administrator with a fresh step-up, never an API token. At most 10 a minute per user. Refused with 403
        ALC-LIC-0001 while the license is locked.
      x-permission: acme.manage
      x-scope: platform
      responses:
        "200":
          description: The active account after settling
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEAccount" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/accounts/{id}/deactivate:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: deactivateACMEAccount
      summary: Deactivate the account at the certificate authority
      description: >-
        Contacts the CA; the account cannot be used again (renewals of the provider's certificates fail with ALC-ACM-0023 until
        a new account is registered). 409 ALC-ACM-0023 (not active), 409 ALC-ACM-0024 (key change unsettled or another account
        operation running). Administrator with a fresh step-up, never an API token. At most 10 a minute per user. Refused with
        403 ALC-LIC-0001 while the license is locked.
      x-permission: acme.manage
      x-scope: platform
      responses:
        "200":
          description: The deactivated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEAccount" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/hooks:
    get:
      operationId: listACMEHooks
      summary: DNS publishers (the DNS hooks and the built-in DNS providers that publish DNS-01 records), by name
      description: >-
        A publisher is a DNS hook (kind webhook) or a built-in DNS provider (cloudflare, azure_dns, route53; R57). The hook's
        secret and a provider's credentials are write-only (secret_configured).
      x-permission: acme.view
      x-scope: any
      responses:
        "200":
          description: The hooks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEHookList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createACMEHook
      summary: Add a DNS publisher, a hook or a built-in DNS provider (no network call is made)
      description: >-
        kind (default webhook) is fixed for the publisher's life. A hook: url must be https without user information; the
        secret (16 to 256 printable characters) signs every call. A built-in provider (R57) has no url, ca_bundle_pem or
        secret: cloudflare takes api_token (20 to 256 printable characters; Zone Read and DNS Edit); azure_dns takes auth
        (client_secret, certificate, managed_identity), tenant_id and client_id (GUIDs, as a Key Vault credential),
        client_secret or the certificate (certificate_pem and private_key_pem, or pfx_base64 and pfx_password; an RSA key),
        subscription_id and resource_group; route53 takes access_key_id, secret_access_key, and optionally role_arn (an IAM
        role to assume) with external_id. Fields of another kind are refused (422). allowed_suffixes is the publisher's name
        allow-list. propagation_wait_seconds (0..120, default 5) plus poll_timeout_seconds (1..100, default 60; a provider's
        wait for its change to be live) are at most 120. 409 ALC-ACM-0020 (name taken). Administrator with a fresh step-up,
        never an API token. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: acme.manage
      x-scope: platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACMEHookCreate" }
      responses:
        "201":
          description: The hook
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEHook" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/acme/hooks/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getACMEHook
      summary: One DNS publisher
      x-permission: acme.view
      x-scope: any
