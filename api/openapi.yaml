        client_id: { type: string, format: uuid }
        client_secret: { type: string, writeOnly: true }
        secret_expires_on: { type: string, format: date-time }
        certificate_pem: { type: string, writeOnly: true }
        private_key_pem: { type: string, writeOnly: true }
        pfx_base64: { type: string, writeOnly: true }
        pfx_password: { type: string, writeOnly: true }
    AccessCheckRow:
      type: object
      required: [name, result, role, error]
      properties:
        name: { type: string, enum: [sign_in, list_certificates, list_keys, list_secrets, read_secret, import] }
        result: { type: string, enum: [ok, forbidden, failed, not_checked] }
        role: { type: string, enum: ["", Key Vault Reader, Key Vault Secrets User, Key Vault Certificates Officer], description: 'The Azure role that would allow the call (a forbidden row); never translated' }
        error: { $ref: "#/components/schemas/ErrorRef" }
    VaultAccess:
      type: [object, "null"]
      description: The last access check; null until one ran
      required: [object_id, tenant_id, permission_model, checks, checked_at]
      properties:
        object_id: { type: string, description: 'Who Alice is in Azure (the token''s oid); "" when unknown' }
        tenant_id: { type: string }
        permission_model: { type: string, enum: ["", rbac, access_policy, unknown] }
        checks: { type: array, items: { $ref: "#/components/schemas/AccessCheckRow" } }
        checked_at: { type: string, format: date-time }
    Vault:
      type: object
      description: What a Key Vault adds to a target. Never a secret.
      required: [url, name, auth, tenant_id, client_id, poll_interval_minutes, secret_expires_on, cert_thumbprint, cert_not_after, access]
      properties:
        url: { type: string, examples: ["https://contoso.vault.azure.net"] }
        name: { type: string, description: "The vault's name in Azure" }
        auth: { type: string, enum: ["", certificate, client_secret, managed_identity], description: '"" does not occur for a stored vault: the API sends it only for a value it does not know' }
        tenant_id: { type: string }
        client_id: { type: string }
        poll_interval_minutes: { type: integer }
        secret_expires_on: { type: [string, "null"], format: date-time }
        cert_thumbprint: { type: string, description: 'The sign-in certificate''s SHA-1 thumbprint (certificate sign-in), as Azure shows it; "" otherwise' }
        cert_not_after: { type: [string, "null"], format: date-time }
        access: { $ref: "#/components/schemas/VaultAccess" }
    VaultCreated:
      type: object
      required: [target, access, job_id, status_url]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        access: { $ref: "#/components/schemas/VaultAccess" }
        job_id: { type: string, format: uuid }
        status_url: { type: string }
    VaultReplaced:
      type: object
      required: [target, access, job_id]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        access: { $ref: "#/components/schemas/VaultAccess" }
        job_id: { type: [string, "null"], format: uuid }
    KVCertificate:
      type: object
      required: [id, target_id, name, current_version, current_thumbprint, enabled, not_before, expires, kv_created_at, kv_updated_at,
        exportable, key_type, key_size, content_type, issuer_name, auto_renew, details_pending, first_seen_at, last_seen_at,
        missing_since, bound, current_held, current_held_reason]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        name: { type: string }
        current_version: { type: string, description: 'The version (32 hex digits) Alice read details of; "" until then' }
        current_thumbprint: { type: string }
        enabled: { type: boolean }
        not_before: { type: [string, "null"], format: date-time }
        expires: { type: [string, "null"], format: date-time }
        kv_created_at: { type: [string, "null"], format: date-time }
        kv_updated_at: { type: [string, "null"], format: date-time }
        exportable: { type: [boolean, "null"], description: 'null until the policy was read; false: Alice cannot deploy this certificate (ALC-AKV-0013)' }
        key_type: { type: string }
        key_size: { type: integer }
        content_type: { type: string }
        issuer_name: { type: string }
        auto_renew: { type: boolean }
        details_pending: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time, description: 'Set when the vault no longer lists it (shown as "Removed from Key Vault")' }
        bound: { type: boolean, description: A live connection names it }
        current_held: { type: boolean }
        current_held_reason: { type: string, enum: ["", license, incomplete_chain] }
    KVVersion:
      type: object
      required: [id, version, thumbprint, certificate_id, enabled, not_before, expires, kv_created_at, exportable, key_type, content_type,
        detected_at, held, held_reason, chain_incomplete]
      properties:
        id: { type: string, format: uuid }
        version: { type: string, description: 32 hex digits }
        thumbprint: { type: string }
        certificate_id: { type: [string, "null"], format: uuid, description: The leaf's certificate row once Alice read the version }
        enabled: { type: boolean }
        not_before: { type: [string, "null"], format: date-time }
        expires: { type: [string, "null"], format: date-time }
        kv_created_at: { type: [string, "null"], format: date-time }
        exportable: { type: [boolean, "null"] }
        key_type: { type: string }
        content_type: { type: string }
        detected_at: { type: string, format: date-time }
        held: { type: boolean, description: Not deployed by itself; an Administrator deploys or releases it }
        held_reason: { type: string, enum: ["", license, incomplete_chain] }
        chain_incomplete:
          type: boolean
          description: >-
            The last read of this version's secret found its chain incomplete (false until a deployment read it). Every
            manual deployment of it then needs an Administrator's confirm_incomplete_chain, held or released alike (409
            ALC-CRT-0011 without it); releasing a hold does not confirm the chain.
    BindingSummary:
      type: [object, "null"]
      required: [id, auto_deploy, auto_since, stopped_version, location_count, version, created_at]
      properties:
        id: { type: string, format: uuid }
        auto_deploy: { type: boolean }
        auto_since: { type: [string, "null"], format: date-time }
        stopped_version: { type: string, description: 'The version whose automatic wave stopped after 3 failures; "" none' }
        location_count: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    KVCertificateDetail:
      allOf:
        - { $ref: "#/components/schemas/KVCertificate" }
        - type: object
          required: [versions, binding, deploy_access]
          properties:
            versions: { type: array, items: { $ref: "#/components/schemas/KVVersion" } }
            binding: { $ref: "#/components/schemas/BindingSummary" }
            deploy_access: { type: string, enum: [ok, forbidden, not_checked], description: 'The most recent evidence of the Key Vault Secrets User role: a deployment or an access check that read a secret' }
    KVCertificatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KVCertificate" } }
        next_cursor: { type: [string, "null"] }
    KVKey:
      type: object
      required: [id, target_id, name, version, key_type, curve, key_size, hsm, managed, enabled, details_updated_at, details_problem,
        not_before, expires, kv_created_at, kv_updated_at, first_seen_at, last_seen_at, missing_since]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        key_type: { type: string }
        curve: { type: string }
        key_size: { type: integer }
        hsm: { type: boolean }
        managed: { type: boolean }
        enabled: { type: boolean }
        details_updated_at: { type: [string, "null"], format: date-time }
        details_problem: { type: string, enum: ["", forbidden, failed] }
        not_before: { type: [string, "null"], format: date-time }
        expires: { type: [string, "null"], format: date-time }
        kv_created_at: { type: [string, "null"], format: date-time }
        kv_updated_at: { type: [string, "null"], format: date-time }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
    KVKeyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KVKey" } }
        next_cursor: { type: [string, "null"] }
    KVSecret:
      type: object
      required: [id, target_id, name, content_type, managed, enabled, not_before, expires, kv_created_at, kv_updated_at, first_seen_at,
        last_seen_at, missing_since]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        name: { type: string }
        content_type: { type: string }
        managed: { type: boolean }
        enabled: { type: boolean }
        not_before: { type: [string, "null"], format: date-time }
        expires: { type: [string, "null"], format: date-time }
        kv_created_at: { type: [string, "null"], format: date-time }
        kv_updated_at: { type: [string, "null"], format: date-time }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
    KVSecretPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KVSecret" } }
        next_cursor: { type: [string, "null"] }
    ReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        confirm_incomplete_chain: { type: boolean, description: 'The Administrator''s acknowledgement of the incomplete chain of a version held for it; it approves no deployment' }
    BindingCreate:
      type: object
      required: [kv_certificate_id, location_ids]
      additionalProperties: false
      properties:
        kv_certificate_id: { type: string, format: uuid }
        location_ids: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string, format: uuid } }
    BindingPatch:
      type: object
      required: [location_ids]
      additionalProperties: false
      properties:
        location_ids: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string, format: uuid } }
    AutoDeployRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    BindingDeploy:
      type: object
      required: [version_id]
      additionalProperties: false
      properties:
        version_id: { type: string, format: uuid }
        location_ids: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string, format: uuid } }
        confirm_incomplete_chain: { type: boolean, description: Counts for an Administrator only (F-17) }
    BindingLocation:
      type: object
      required: [location_id, target_id, target_name, cert_path, state, version, deployment_id]
      properties:
        location_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string }
        state: { type: string, enum: [not_deployed, pending, deployed, failed, stopped], description: 'stopped: the automatic wave of the current version stopped after 3 failures' }
        version: { type: string, description: 'The vault version served or deployed; "" unless deployed' }
        deployment_id: { type: [string, "null"], format: uuid }
        attention_code: { type: string, enum: ["", service.untrusted], description: 'Why automatic deployment holds the website: service.untrusted when its server''s service does not accept the vault''s keys (R49); "" for nothing' }
    Binding:
      type: object
      required: [id, kv_certificate_id, vault_id, certificate_name, vault_name, auto_deploy, auto_since, stopped_version, location_count,
        version, created_at, created_by, locations]
      properties:
        id: { type: string, format: uuid }
        kv_certificate_id: { type: string, format: uuid }
        vault_id: { type: string, format: uuid }
        certificate_name: { type: string }
        vault_name: { type: string }
        auto_deploy: { type: boolean }
        auto_since: { type: [string, "null"], format: date-time }
        stopped_version: { type: string }
        location_count: { type: integer }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        locations: { type: array, items: { $ref: "#/components/schemas/BindingLocation" } }
    DeployableLocation:
      type: object
      required: [id, target_id, target_name, cert_path, key_path, key_type, server_names, binding_id]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string }
        key_path: { type: string }
        key_type: { type: string, enum: ["", rsa, ecdsa] }
        server_names: { type: array, items: { type: string } }
        binding_id: { type: [string, "null"], format: uuid }
    DeployableLocationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DeployableLocation" } }
        next_cursor: { type: [string, "null"] }
    ImportRequest:
      type: object
      required: [target_id, name]
      additionalProperties: false
      properties:
        target_id: { type: string, format: uuid, description: The vault }
        name: { type: string, minLength: 1, maxLength: 127, pattern: "^[0-9A-Za-z-]+$" }
        confirm_new_version: { type: boolean, description: 'Confirms that the name may already exist in the vault and a new version is added' }
    KVImport:
      type: object
      required: [id, certificate_id, target_id, name, new_version, state, version, thumbprint, error, can_retry, job_id, requested_by,
        created_at, sent_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        certificate_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        name: { type: string }
        new_version: { type: boolean, description: 'The person confirmed adding a version to an existing name' }
        state:
          type: string
          enum: ["", queued, running, succeeded, failed, uncertain]
          description: >-
            uncertain is shown as "Not confirmed yet": the request may have reached the vault, it is never sent again, and a poll
            settles it; an uncertain import has no error (null). "" does not occur for a stored import: the API sends it only for a
            value it does not know, instead of inventing a state.
        version: { type: string }
        thumbprint: { type: string }
        error: { $ref: "#/components/schemas/ErrorRef", description: 'Why a failed import failed (ALC-AKV-0023, 0025, 0026, 0029, 0030, 0038..0040 and the azure.* codes; 0040: the requester is no longer an Administrator); params.certificate_name for the name conflicts; null for an uncertain import' }
        can_retry: { type: boolean, description: 'Failed before anything reached the vault, so a new request is safe' }
        job_id: { type: [string, "null"], format: uuid }
        requested_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    KVImportList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KVImport" } }
        next_cursor: { type: [string, "null"] }
    ImportAccepted:
      type: object
      required: [import, job_id, status_url]
      properties:
        import: { $ref: "#/components/schemas/KVImport" }
        job_id: { type: string, format: uuid }
        status_url: { type: string }
    VersionInfo:
      type: object
      required: [version, commit, build_time]
      properties:
        version: { type: string }
        commit: { type: string }
        build_time: { type: string }
    Locale:
      type: object
      required: [code, name, direction]
      properties:
        code: { type: string, examples: [tr] }
        name: { type: string, examples: [Türkçe] }
        direction: { type: string, enum: [ltr, rtl] }
    LocaleList:
      type: object
      required: [default, locales]
      properties:
        default: { type: string }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, reason, message_key, message, request_id, retryable]
          properties:
            code: { type: string, pattern: "^ALC-[A-Z]{2,5}-[0-9]{4}$", examples: [ALC-SYS-0001] }
            reason: { type: string, examples: [system.not_found] }
            message_key: { type: string }
            message: { type: string }
            request_id: { type: string }
            retryable: { type: boolean }
            params:
              type: object
              additionalProperties: { type: string }
              description: Values for the placeholders of message_key, e.g. {"min":"12"}
            details:
              type: array
              description: >-
                Per-field problems for validation.failed. Also on system.bad_request (ALC-SYS-0004) when a query
                parameter or the JSON body holds text Alice cannot store (a NUL character, or bytes that are not valid
                UTF-8 in a query): field is the parameter name ("query" when the name itself cannot be named) or
                "body", code validation.pattern; the value is never repeated.
              items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, examples: [username] }
        code: { type: string, examples: [validation.pattern] }
        params:
          type: object
          additionalProperties: { type: string }
    CSRFToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string, description: Send as X-CSRF-Token on state-changing requests }
    SetupStatus:
      type: object
      description: >-
        Once setup is complete an anonymous caller gets only completed and default_locale; while setup is open, and for a
        signed-in session, every field.
      required: [completed, default_locale]
      properties:
        admin_exists: { type: boolean }
        recovery_passphrase_set: { type: boolean }
        license_chosen: { type: boolean, description: A license was uploaded or the evaluation was chosen }
        completed: { type: boolean }
        default_locale: { type: string, examples: [tr] }
        https_chosen: { type: boolean, description: A certificate was uploaded or the temporary one kept }
        mail_chosen: { type: boolean, description: Mail settings exist or the step was skipped }
        next_step: { type: string, enum: ["", passphrase, https, mail, license, platform, done] }
    LicenseBanner:
      type: object
      required: [kind, severity, params]
      properties:
        kind:
          type: string
          enum: [evaluation, evaluation_ended, expiry_warning, grace, locked_continuity, locked, unverified, tampered, clock_behind, clock_jump, pending, over_limit, limit_reached]
          description: >-
            unverified (everyone, danger, param last_checked) is shown while no license check has succeeded for 3 hours; changes are refused with
            ALC-LIC-0009 until one does. locked_continuity (everyone, danger; params valid_until, continuity_ends_at, days_left) is a licensed
            lock inside its continuity window: certificates already managed keep renewing and deploying automatically until continuity_ends_at.
            locked (params valid_until, continuity_ended_at) is a lock after that window: automatic renewal and deployment have stopped too.
        severity: { type: string, enum: [info, warning, caution, danger] }
        params: { type: object, additionalProperties: { type: string } }
    LicenseStatus:
      type: object
      required: [expired, banners]
      properties:
        expired: { type: boolean, description: The license or the evaluation has ended (grace or lock) }
        phase:
          type: string
          enum: [evaluation, evaluation_expired, active, grace, locked]
          description: Only for Administrators and Auditors
        banners: { type: array, items: { $ref: "#/components/schemas/LicenseBanner" } }
    LicenseInfo:
      type: object
      required: [license_id, customer, issued_at, valid_from, valid_until, max_targets, features, replaces, key_id]
      properties:
        license_id: { type: string }
        customer: { type: string }
        issued_at: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        max_targets: { type: integer, minimum: 1, maximum: 100000 }
        features: { type: array, items: { type: string } }
        replaces: { type: string, description: License ID a correction license replaces; empty otherwise }
        key_id: { type: string }
    LicenseFile:
      type: object
      required: [status, uploaded_at, license]
      properties:
        status: { type: string, enum: [current, pending, superseded, invalid] }
        uploaded_at: { type: string, format: date-time }
        license:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
    LicenseHistoryEntry:
      type: object
      required: [at, event, license_id, from_state, to_state, notice]
      properties:
        at: { type: string, format: date-time }
        event: { type: string, enum: [installed, renewed, state_change, clock_anomaly, rejected, notice] }
        license_id: { type: string }
        from_state: { type: string }
        to_state: { type: string }
        notice: { type: [string, "null"] }
    LicenseDetail:
      type: object
      required: [installation_id, installed_at, phase, effective_time, current, pending, max_targets, targets_used,
        ends_at, locks_at, days_left, grace_day, continuity_ends_at, continuity_days_left, tampered, files, history]
      properties:
        installation_id: { type: string, examples: [ALICE-7F3K-9Q2M-XD41-B8TC] }
        installed_at: { type: string, format: date-time }
        phase: { type: string, enum: [evaluation, evaluation_expired, active, grace, locked] }
        effective_time: { type: string, format: date-time, description: The trusted time license states are computed from }
        current:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
        pending:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
        max_targets: { type: integer }
        targets_used: { type: integer }
        ends_at: { type: string, format: date-time }
        locks_at: { type: string, format: date-time }
        days_left: { type: integer }
        grace_day: { type: integer }
        continuity_ends_at:
          type: [string, "null"]
          format: date-time
          description: >-
            End of the continuity window of a licensed lock (locks_at + 45 days): until then ACME renewal and automatic deployment of
            certificates already managed go on in lock. Null during the evaluation (it has no window).
        continuity_days_left: { type: integer, description: Whole days left in the continuity window while locked inside it; 0 otherwise }
        tampered: { type: boolean }
        files: { type: array, items: { $ref: "#/components/schemas/LicenseFile" } }
        history: { type: array, items: { $ref: "#/components/schemas/LicenseHistoryEntry" } }
    LicenseUpload:
      type: object
      additionalProperties: false
      required: [license]
      properties:
        license:
          type: string
          maxLength: 65536
          description: The license file content (UTF-8 JSON text). The whole request body is limited to 64 KiB (65536 bytes); a larger body is refused with ALC-SYS-0007 (413).
    LicenseUploadResult:
      type: object
      required: [license, pending, already_expired, correction, duplicate, phase]
      properties:
        license: { $ref: "#/components/schemas/LicenseInfo" }
        pending: { type: boolean, description: valid_from is still ahead; the previous license continues until then }
        already_expired: { type: boolean }
        correction: { type: boolean }
        duplicate: { type: boolean, description: This license was already installed; nothing changed }
        phase: { type: string, enum: [evaluation, evaluation_expired, active, grace, locked] }
    MFAEnrollment:
      type: object
      required: [secret, otpauth_uri, qr_png]
      properties:
        secret: { type: string, description: Base32 TOTP secret }
        otpauth_uri: { type: string }
        qr_png: { type: string, contentEncoding: base64, description: PNG image of otpauth_uri }
    User:
      type: object
      required: [id, username, display_name, email, role, locale, disabled, mfa_enrolled, last_login_at, created_at, auth_source, sso_provider_id, ldap_directory_id]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: [string, "null"], enum: [admin, operator, auditor, null], description: "The global role; null: none (role bindings only, R49 Phase 2)" }
        locale: { type: string }
        disabled: { type: boolean }
        mfa_enrolled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        auth_source: { type: string, enum: [local, oidc, ldap], description: 'How the person signs in: a local account, single sign-on or a directory (LDAP or Active Directory). SSO and directory users have no Alice password and their role comes from their groups; SSO users have no Alice authenticator, directory users do' }
        sso_provider_id: { type: [string, "null"], format: uuid, description: The identity provider of an SSO user; null for every other user }
        ldap_directory_id: { type: [string, "null"], format: uuid, description: The directory of a directory user; null for every other user }
        directory_sign_in_locked_until:
          type: string
          format: date-time
          description: >-
            Only in the user administration's answers (/users), for a directory user whose directory sign-in is locked
            in the answering Alice process (the account or the stored sign-in name): when the lock ends. Omitted when it
            is not locked.
    SessionInfo:
      type: object
      required: [user, csrf_token, expires_at, idle_expires_at, stepup_until]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends without a person's activity (see the API description; a read without the activity marker does not extend it)
        stepup_until: { type: [string, "null"], format: date-time }
        access: { $ref: "#/components/schemas/SessionAccess" }
    SessionWithCodes:
      description: SessionInfo plus the one-time recovery codes (only from administrator creation and MFA verification)
      allOf:
        - { $ref: "#/components/schemas/SessionInfo" }
        - type: object
          properties:
            recovery_codes:
              type: array
              items: { type: string }
              description: Present only right after MFA enrollment or administrator creation
    APIToken:
      type: object
      required: [id, user_id, name, prefix, scope, service_ids, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, examples: [alice_Xy12Ab] }
        scope: { type: string, enum: [read, operate] }
        service_ids:
          type: [array, "null"]
          items: { type: string, format: uuid }
          description: "The services the token is limited to (R54); null: its owner's whole reach"
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [seq, at, actor_type, actor_id, actor_name, ip, action, object_type, object_id, result, details, request_id, hash]
      properties:
        seq: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, api_token, system, oidc] }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: string }
        ip: { type: [string, "null"] }
        action: { type: string, examples: [auth.login] }
        object_type: { type: string }
        object_id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        details:
          type: object
          additionalProperties: { type: string }
          description: >-
            Keys and parameters of the action, never secrets. authz.denied, request.denied_license and the
            busy refusals of audit.verified and audit.exported (result denied, reason busy) are recorded once
            per person (sessions together; that person's API tokens together, each entry naming its token_id),
            permission or license class, reason and route per 10 minutes; when such a window ends with
            refusals left out, one more entry of the same action follows with suppressed_count (how many),
            window_start and window_end (RFC 3339), distinct_ip_count and ip_samples (up to three addresses,
            comma-separated), and where they apply distinct_object_count and distinct_token_count (a count
            above 64 reads "64+"); it has no ip, request_id or object_id.
        request_id: { type: string }
        hash: { type: string, description: Hex SHA-256 of this entry in the chain }
    AuditReport:
      type: object
      required: [intact, checked, head_seq, head_hash, first_bad_seq, problem]
      properties:
        intact: { type: boolean }
        checked: { type: integer }
        head_seq: { type: integer }
        head_hash: { type: string }
        first_bad_seq: { type: [integer, "null"] }
        problem: { type: [string, "null"], enum: [hash_mismatch, sequence_gap, tail_truncated, null] }
    RevocationReason:
      type: string
      description: An RFC 5280 reason a certificate owner gives (the CA's own reasons are refused)
      enum: [unspecified, keyCompromise, affiliationChanged, superseded, cessationOfOperation]
    RevocationReasonOrEmpty:
      type: string
      description: The RFC 5280 reason of a revocation, "" when not revoked (the last three only as an authority reported them, R64)
      enum: ["", unspecified, keyCompromise, affiliationChanged, superseded, cessationOfOperation, cACompromise, privilegeWithdrawn, aACompromise]
    SourceCapability:
      type: string
      description: >-
        discover (Alice finds where it is used), obtain (Alice gets it from its CA), renew (Alice renews it), deploy (Alice
        deploys it), verify (Alice checks the server serves it after her deployment), revoke (Alice asks its CA to revoke it),
        recovery (Alice recovers its renewal by herself after an outage)
      enum: [discover, obtain, renew, deploy, verify, revoke, recovery]
    SourceCapabilities:
      type: object
      required: [capabilities, sources]
      properties:
        capabilities: { type: array, items: { $ref: "#/components/schemas/SourceCapability" } }
        sources:
          type: array
          items:
            type: object
            required: [source, capabilities]
            properties:
              source: { type: string, enum: [acme, azure_kv, uploaded, csr, discovered] }
              capabilities: { type: array, items: { $ref: "#/components/schemas/SourceCapability" } }
    ACMERevoke:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        certificate_id: { type: [string, "null"], format: uuid, description: The version to revoke; absent or null for the current certificate }
        reason: { $ref: "#/components/schemas/RevocationReason" }
    ImpactMatch:
      type: string
      description: certificate (the place holds the certificate itself) or key (another certificate made with the same key)
      enum: [certificate, key]
    CertificateImpact:
      type: object
      required: [certificate, certificates, locations, vaults, endpoints, endpoints_hidden, truncated, open_incident_id]
      properties:
        certificate: { $ref: "#/components/schemas/Certificate" }
        certificates:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [id, fingerprint, subject_cn, label, source, not_after, revoked_at, compromised_at, match]
            properties:
              id: { type: string, format: uuid }
              fingerprint: { type: string }
              subject_cn: { type: string }
              label: { type: string }
              source: { type: string }
              not_after: { type: string, format: date-time }
              revoked_at: { type: [string, "null"], format: date-time }
              compromised_at: { type: [string, "null"], format: date-time }
              match: { $ref: "#/components/schemas/ImpactMatch" }
        locations:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [location_id, target_id, target_name, target_type, cert_path, certificate_id, fingerprint, match, deployable,
              acme_certificate_id, kv_bound]
            properties:
              location_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
              target_name: { type: string }
              target_type: { type: string }
              cert_path: { type: string }
              certificate_id: { type: [string, "null"], format: uuid }
              fingerprint: { type: string }
              match: { $ref: "#/components/schemas/ImpactMatch" }
              deployable: { type: boolean }
              acme_certificate_id: { type: [string, "null"], format: uuid }
              kv_bound: { type: boolean }
        vaults:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [vault_id, vault_name, kv_certificate_id, name, version, certificate_id, current, match]
            properties:
              vault_id: { type: string, format: uuid }
              vault_name: { type: string }
              kv_certificate_id: { type: string, format: uuid }
              name: { type: string }
              version: { type: string }
              certificate_id: { type: string, format: uuid }
              current: { type: boolean }
              match: { $ref: "#/components/schemas/ImpactMatch" }
        endpoints:
          type: array
          maxItems: 1000
          description: Empty when endpoints_hidden (the caller may not read network discovery results)
          items:
            type: object
            required: [endpoint_id, scope_id, scope_name, address, port, sni, host, fingerprint, state, last_seen, match]
            properties:
              endpoint_id: { type: string, format: uuid }
              scope_id: { type: string, format: uuid }
              scope_name: { type: string }
              address: { type: string }
              port: { type: integer }
              sni: { type: string }
              host: { type: string }
              fingerprint: { type: string }
              state: { type: string, enum: [present, unreachable] }
              last_seen: { type: [string, "null"], format: date-time }
              match: { $ref: "#/components/schemas/ImpactMatch" }
        endpoints_hidden: { type: boolean }
        truncated: { type: boolean, description: A list was cut at 1000 }
        open_incident_id: { type: [string, "null"], format: uuid }
    IncidentStart:
      type: object
      additionalProperties: false
      properties:
        revoke_mode: { type: string, enum: [after_verified, now], default: after_verified }
    IncidentReplacement:
      type: object
      additionalProperties: false
      required: [certificate_id]
      properties:
        certificate_id: { type: string, format: uuid }
    IncidentLocation:
      type: object
      required: [location_id, target_id, target_name, cert_path, status, deployment_id, error, attempts, updated_at, outcome_uncertain]
      properties:
        location_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string }
        status: { type: string, enum: [pending, deploying, verified, unverified, failed, skipped] }
        deployment_id: { type: [string, "null"], format: uuid }
        error: { $ref: "#/components/schemas/ErrorRef" }
        attempts: { type: integer }
        updated_at: { type: string, format: date-time }
        outcome_uncertain:
          type: boolean
          description: >-
            The replacement was sent but Alice has not confirmed how it ended (the server cannot be reached, or its answer was
            lost); error says why when the deployment knows. Such a place is never counted as replaced (R48): it stays
            deploying until the deployment's recovery confirms it or gives up (failed).
    Incident:
      type: object
      required: [id, certificate_id, certificate_name, fingerprint, source, public_key_sha256, acme_certificate_id, state, revoke_mode,
        revocation, order_id, order_state, replacement_certificate_id, replacement_fingerprint, attention, revoke_attempts, next_attempt_at,
        revoked_at, started_by, started_by_name, closed_by, created_at, updated_at, finished_at, counts]
      properties:
        id: { type: string, format: uuid }
        certificate_id: { type: string, format: uuid }
        certificate_name: { type: string }
        fingerprint: { type: string }
        source: { type: string }
        public_key_sha256: { type: string }
        acme_certificate_id: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [awaiting_replacement, ordering, deploying, revoking, needs_attention, completed, closed] }
        revoke_mode: { type: string, enum: [after_verified, now] }
        revocation: { type: string, enum: [pending, revoked, failed, not_possible] }
        order_id: { type: [string, "null"], format: uuid }
        order_state: { type: string, enum: ["", running, succeeded, failed] }
        replacement_certificate_id: { type: [string, "null"], format: uuid }
        replacement_fingerprint: { type: string }
        attention: { $ref: "#/components/schemas/ErrorRef" }
        revoke_attempts: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        started_by: { type: [string, "null"], format: uuid }
        started_by_name: { type: string }
        closed_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        counts: { type: object, additionalProperties: { type: integer }, description: Locations by status }
        locations: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/IncidentLocation" } }
    IncidentList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        next_cursor: { type: [string, "null"], description: The cursor of the next page; null on the last page }
    ErrorRef:
      type: [object, "null"]
      required: [code, reason]
      properties:
        code: { type: string, examples: [ALC-SSH-0002] }
        reason: { type: string, examples: [ssh.auth_failed] }
        params: { type: object, additionalProperties: { type: string } }
    Accepted:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: { type: string, format: uuid }
        status_url: { type: string, examples: [/api/v1/jobs/0192b000-0000-7000-8000-0000000000b1] }
    TargetCreate:
      type: object
      required: [name, host]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid, description: "R49: the service the new server goes to; absent: the Default service. An unknown one is 422 validation.required on service_id. Never changed by an update: POST /api/v1/services/{id}/actions/assign moves it." }
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [linux, nginx, apache, haproxy, windows], default: linux, description: Fixed at creation }
        host: { type: string, maxLength: 253, description: "Host name or IP address; no scheme and no port. An address that is never a managed server (link-local, multicast, unspecified, broadcast and other reserved forms) is refused (validation.host_not_allowed). A host name is checked again on the address it resolves to at every connection Alice opens; a refused address fails the connection with ALC-SSH-0012 (ssh.address_not_allowed), shown as the server's last_error." }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 or absent means 22 }
        username: { type: string, maxLength: 36, description: 'Absent means alice-svc (alice on a Windows server). A Windows server also takes a domain account, DOMAIN\alice-svc, stored as typed; any other type refuses the backslash.' }
    TargetPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        discovery_interval_hours: { type: integer, minimum: 1, maximum: 720 }
        poll_interval_minutes: { type: integer, minimum: 5, maximum: 1440, description: Key Vaults only }
        certificate_cleanup: { type: boolean, description: 'R62. Servers whose provider can clean up certificates (capability cleanup_certificates) only; any other target is 422 validation.pattern on certificate_cleanup. A value that is not a boolean is 400. Audited as target.updated (fields certificate_cleanup).' }
    TargetFacts:
      type: object
      required: [os, helper_version, helper_protocol, sshd, host_keys, warnings, unreadable]
      properties:
        os:
          type: object
          required: [id, version_id, pretty_name]
          properties:
            id: { type: string }
            version_id: { type: string }
            pretty_name: { type: string }
        helper_version: { type: string }
        helper_protocol: { type: integer }
        sshd:
          type: [object, "null"]
          properties:
            read: { type: boolean }
            pubkey_authentication: { type: string }
            password_authentication: { type: string }
            permit_root_login: { type: string }
            authorized_keys_file: { type: array, items: { type: string } }
            authorized_keys_command: { type: string }
            keys_managed_elsewhere: { type: boolean }
            certificates_in_use: { type: boolean }
        host_keys:
          type: array
          items:
            type: object
            required: [key_type, bits, fingerprint, weak]
            properties:
              key_type: { type: string }
              bits: { type: integer }
              fingerprint: { type: string }
              weak: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [code, params]
            properties:
              code:
                type: string
                examples: [keys_managed_elsewhere]
                description: >-
                  Phase 4 values for web servers include web_server_not_found, web_server_profile_missing,
                  web_server_helper_too_old,
                  locations_dropped, list_truncated, too_many_files, config_dir_not_read, config_file_not_read, stream_tls, mail_tls and
                  config_file_writable (params.path); a newer server may add others.
              params: { type: object, additionalProperties: { type: string } }
        unreadable:
          type: array
          items:
            type: object
            required: [os_user, file_path, line_no]
            properties:
              os_user: { type: string }
              file_path: { type: string }
              line_no: { type: integer }
        web_server: { $ref: "#/components/schemas/WebServerFacts" }
        windows: { $ref: "#/components/schemas/WindowsFacts" }
    WindowsFacts:
      type: object
      description: Present for a Windows server that was tested (the last connection test)
      required: [build, product, installation_type, elevated, iis_installed, iis_version, stores, openssh_version]
      properties:
        build: { type: string, examples: ["10.0.20348.2700"] }
        product: { type: string, examples: [Windows Server 2022 Datacenter] }
        installation_type: { type: string, examples: [Server, Server Core] }
        elevated: { type: boolean, description: "The helper's token is elevated; false fails the test with ALC-WIN-0003" }
        iis_installed: { type: boolean }
        iis_version: { type: string, examples: ["10.0"] }
        stores: { type: array, items: { type: string }, description: "Machine certificate store names (at most 16)" }
        openssh_version: { type: string }
    Target:
      type: object
      required: [id, name, type, host, port, username, status, last_error, last_success_at, last_discovery_at,
        discovery_interval_hours, keys_managed_elsewhere, capabilities, facts, version, created_at, updated_at]
      properties:
        service: { $ref: "#/components/schemas/ServiceRef" }
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [nginx, apache, haproxy, linux, windows, azure_key_vault] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        status:
          type: string
          enum: [pending_host_key, checking, ok, degraded, unreachable, host_key_changed, auth_failed, disabled]
          description: >-
            degraded: a Key Vault that works partly (the vault answered, but a role is missing or its firewall refused
            Alice; last_error says which). pending_host_key and host_key_changed are for servers only.
        last_error:
          $ref: "#/components/schemas/ErrorRef"
          description: >-
            For a Key Vault, params come from the failure of the last poll that is this error and from the last
            access check, in strict shapes only: client_address (an IP address literal; the address the vault's
            firewall saw, azure.firewall), model (rbac, access_policy or unknown) and role (Key Vault Reader, Key Vault
            Secrets User or Key Vault Certificates Officer; azure.forbidden). Nothing else Azure sent is returned.
        last_success_at: { type: [string, "null"], format: date-time }
        last_discovery_at: { type: [string, "null"], format: date-time }
        discovery_interval_hours: { type: integer }
        keys_managed_elsewhere: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        facts: { $ref: "#/components/schemas/TargetFacts" }
        vault: { $ref: "#/components/schemas/Vault" }
        certificate_cleanup:
          type: boolean
          description: >-
            R62. Only for a server whose provider can clean up certificates (capability cleanup_certificates; absent
            otherwise): the per-server switch "remove certificates Alice imported once nothing uses them", true by
            default. Change it with PATCH.
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TargetList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        next_cursor: { type: "null" }
    TargetCreated:
      type: object
      required: [target, job_id, status_url]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        job_id: { type: string, format: uuid }
        status_url: { type: string }
    HostKey:
      type: object
      required: [id, key_type, fingerprint, status, observed_at, confirmed_at, confirmed_by_name, superseded_at, verify_command]
      properties:
        id: { type: string, format: uuid }
        key_type: { type: string, examples: [ssh-ed25519] }
        fingerprint: { type: string, examples: ["SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8"] }
        status: { type: string, enum: [observed, pinned, superseded, rejected] }
        observed_at: { type: string, format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
        confirmed_by_name: { type: string }
        superseded_at: { type: [string, "null"], format: date-time }
        verify_command: { type: string, examples: [ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub] }
    HostKeyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HostKey" } }
    HostKeyConfirm:
      type: object
      required: [fingerprint]
      additionalProperties: false
      properties:
        fingerprint: { type: string }
    HostKeyRepin:
      type: object
      required: [fingerprint, reason]
      additionalProperties: false
      properties:
        fingerprint: { type: string }
        reason: { type: string, minLength: 10, maxLength: 500 }
    KeyLocation:
      type: object
      required: [id, ssh_key_id, fingerprint, key_type, target_id, target_name, os_user, file_path, line_no, options,
        comment, flags, first_seen_at, last_seen_at, missing_since, removed_at, is_alice_connection_key]
      properties:
        id: { type: string, format: uuid }
        ssh_key_id: { type: string, format: uuid }
        fingerprint: { type: string }
        key_type: { type: string }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        os_user: { type: string }
        file_path: { type: string }
        line_no: { type: integer }
        options: { type: string }
        comment: { type: string }
        flags: { type: array, items: { type: string } }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        is_alice_connection_key: { type: boolean }
    KeyLocationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KeyLocation" } }
    SSHKey:
      type: object
      required: [id, fingerprint, key_type, bits, public_key, managed, is_platform_key, weak, comment, location_count,
        target_count, missing, first_seen_at]
      properties:
        service: { $ref: "#/components/schemas/ServiceRef" }
        id: { type: string, format: uuid }
        fingerprint: { type: string }
        key_type: { type: string }
        bits: { type: integer }
        public_key: { type: string, description: Public key only (type and base64); never private material }
        managed: { type: boolean }
        is_platform_key: { type: boolean }
        weak: { type: boolean }
        comment: { type: string }
        location_count: { type: integer }
        target_count: { type: integer }
        missing: { type: boolean, description: Every location of the key is missing or removed }
        first_seen_at: { type: string, format: date-time }
        locations: { type: array, items: { $ref: "#/components/schemas/KeyLocation" }, description: "Only on GET /ssh-keys/{id}" }
        managed_key:
          description: "Only on GET /ssh-keys/{id} and on a generation: what Alice knows about a key it generated (null otherwise)"
          $ref: "#/components/schemas/ManagedKeyInfo"
    ManagedKeyInfo:
      type: [object, "null"]
      description: >-
        What Alice knows about a key it generated (null for a key found on a server and for Alice's own key). Never a
        private key, a passphrase or anything derived from them.
      required: [label, comment, key_type, created_by, created_at, retired_at, destroyed_at, rotated_from, download_count,
        last_downloaded_at, policy_id, open_rotation_id]
      properties:
        label: { type: string }
        comment: { type: string }
        key_type: { type: string, enum: [ed25519, rsa-3072, rsa-4096, ecdsa-p256] }
        created_by: { type: [string, "null"], format: uuid, description: The user who generated it; null when a rotation did }
        created_at: { type: string, format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
        destroyed_at: { type: [string, "null"], format: date-time, description: When its private key was destroyed }
        rotated_from: { type: [string, "null"], format: uuid, description: The key this one replaced in a rotation }
        download_count: { type: integer }
        last_downloaded_at: { type: [string, "null"], format: date-time }
        policy_id: { type: [string, "null"], format: uuid }
        open_rotation_id: { type: [string, "null"], format: uuid, description: The unfinished rotation that replaces this key }
    GenerateKey:
      type: object
      required: [label, key_type]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid, description: "R49: the service the new key goes to; absent: the Default service. An unknown one is 422 validation.required on service_id. Never changed by an update: POST /api/v1/services/{id}/actions/assign moves it." }
        label: { type: string, minLength: 1, maxLength: 100, description: '1-100 characters without control, format or bidi characters' }
        key_type: { type: string, enum: [ed25519, rsa-3072, rsa-4096, ecdsa-p256] }
    DeployKey:
      type: object
      required: [target_id, os_user, file_path]
      additionalProperties: false
      properties:
        target_id: { type: string, format: uuid }
        os_user: { type: string, minLength: 1, maxLength: 256 }
        file_path: { type: string, minLength: 1, maxLength: 4096, description: 'One of the key files of the user (GET /targets/{id}/key-files)' }
        from: { type: string, description: 'Comma-separated addresses or networks for the from= option; empty: any address' }
        restrict: { type: boolean, default: false, description: Add the restrict option (sign-in only) }
    DownloadPrivateKey:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: Recorded in the audit log; never a secret }
        passphrase: { type: [string, "null"], writeOnly: true, minLength: 12, maxLength: 1024, description: Encrypts the file; Alice does not keep it }
    KeyFiles:
      type: object
      required: [items, scanned_at, refusal]
      properties:
        items:
          type: array
          description: >-
            The users a key can be deployed to and their key files as the last scan found them; never the account Alice
            connects with nor a file it reads
          items:
            type: object
            required: [os_user, files, default_file]
            properties:
              os_user: { type: string }
              files: { type: array, items: { type: string } }
              default_file: { type: string }
        scanned_at: { type: [string, "null"], format: date-time }
        refusal:
          description: Why nothing can be offered on this server (ALC-KEY-0014 when its last scan did not list Alice's own account's key files completely); null otherwise
          $ref: "#/components/schemas/ErrorRef"
    RotationPolicyCreate:
      type: object
      required: [ssh_key_id, name, interval_days]
      additionalProperties: false
      properties:
        ssh_key_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        interval_days: { type: integer, minimum: 1, maximum: 3650 }
        overlap_days: { type: integer, minimum: 0, maximum: 90, default: 7 }
        notify_before_hours: { type: integer, minimum: 1, maximum: 168, default: 24, description: 'Leave out for 24; 0 is refused (422)' }
        new_key_type: { type: string, enum: [same, ed25519, rsa-3072, rsa-4096, ecdsa-p256], default: same, description: 'Leave out for same; an empty string is refused (422)' }
    RotationPolicyPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        interval_days: { type: integer, minimum: 1, maximum: 3650 }
        overlap_days: { type: integer, minimum: 0, maximum: 90 }
        notify_before_hours: { type: integer, minimum: 1, maximum: 168 }
        new_key_type: { type: string, enum: [same, ed25519, rsa-3072, rsa-4096, ecdsa-p256] }
    RotationPolicy:
      type: object
      required: [id, ssh_key_id, name, enabled, interval_days, overlap_days, overlap_minutes, notify_before_hours, new_key_type,
        next_run_at, open_rotation_id, last_run_id, last_run_status, last_run_result, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        ssh_key_id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        interval_days: { type: integer }
        overlap_days: { type: integer, description: overlap_minutes / 1440 rounded down }
        overlap_minutes: { type: integer }
        notify_before_hours: { type: integer }
        new_key_type: { type: string, enum: [same, ed25519, rsa-3072, rsa-4096, ecdsa-p256] }
        next_run_at: { type: [string, "null"], format: date-time }
        open_rotation_id: { type: [string, "null"], format: uuid }
        last_run_id: { type: [string, "null"], format: uuid, description: The policy's latest finished run }
        last_run_status: { type: [string, "null"], enum: [completed, aborted, needs_attention, cancelled, null] }
        last_run_result: { $ref: "#/components/schemas/ErrorRef" }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RotationPolicyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RotationPolicy" } }
    RotationAction:
      type: object
      required: [n, location_id, target_id, target_name, os_user, file_path, options, skip_reason, verify, verify_note, remove_line, add_line]
      properties:
        n: { type: integer }
        location_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        os_user: { type: string }
        file_path: { type: string }
        options: { type: string }
        skip_reason:
          type: string
          description: Empty when this place changes; otherwise why it is skipped (texts rotation.skip.<reason>)
          enum: ["", target_deleted, host_key_unconfirmed, host_key_changed, target_not_connected, keys_managed_elsewhere,
            sshd_unreadable, connection_account, missing, cert_authority, shared_file_skipped, pubkey_disabled,
            root_forced_commands_only, duplicate_lines, options_unreadable, options_truncated, connection_files_unknown,
            connection_account_file]
        verify: { type: boolean, description: A test login with the new key will be tried here }
        verify_note: { type: string, enum: ["", root_login_disabled, from_option] }
        remove_line: { type: string, description: The old key's line (public) }
        add_line: { type: string, description: The new line (public); the new key is shown by its type }
    RotationPreview:
      type: object
      required: [policy_id, ssh_key_id, fingerprint, plan_digest, planned_for, new_key_type, overlap_minutes, change_count, skip_count,
        emailed, actions]
      properties:
        policy_id: { type: string, format: uuid }
        ssh_key_id: { type: string, format: uuid }
        fingerprint: { type: string }
        plan_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        planned_for: { type: string, format: date-time }
        new_key_type: { type: string, enum: [ed25519, rsa-3072, rsa-4096, ecdsa-p256] }
        overlap_minutes: { type: integer }
        change_count: { type: integer }
        skip_count: { type: integer }
        emailed: { type: boolean }
        actions: { type: array, items: { $ref: "#/components/schemas/RotationAction" } }
    RotationRunRequest:
      type: object
      required: [plan_digest]
      additionalProperties: false
      properties:
        plan_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
    RotationStarted:
      type: object
      required: [rotation_id, status_url]
      properties:
        rotation_id: { type: string, format: uuid }
        status_url: { type: string, examples: [/api/v1/rotation/runs/0192b000-0000-7000-8000-0000000000b1] }
    KeepOldRequest:
      type: object
      required: [location_ids]
      additionalProperties: false
      properties:
        location_ids: { type: array, minItems: 1, maxItems: 10000, uniqueItems: true, items: { type: string, format: uuid } }
    RotationLocation:
      type: object
      required: [id, n, target_id, target_name, os_user, file_path, options, state, skip_reason, verify_note, error, backup,
        verified_at, reverified_at, removed_at, new_location_id, add_resend_count, add_resent_at]
      properties:
        id: { type: string, format: uuid }
        n: { type: integer }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        os_user: { type: string }
        file_path: { type: string }
        options: { type: string }
        state:
          type: string
          enum: [planned, skipped, cancelled, adding, added, add_failed, verified, unverifiable, verify_failed, kept_old, removing,
            removed, remove_failed, undoing, undone, undo_failed]
        skip_reason: { type: string, description: "Why the plan skipped the place, or what Alice found when it was about to send (error rotation.skipped_at_send); texts rotation.skip.<reason>" }
        verify_note: { type: string }
        error: { $ref: "#/components/schemas/ErrorRef" }
        backup: { type: string }
        verified_at: { type: [string, "null"], format: date-time }
        reverified_at: { type: [string, "null"], format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        new_location_id: { type: [string, "null"], format: uuid }
        add_resend_count: { type: integer, description: How often the add was sent again after its answer was lost }
        add_resent_at: { type: [string, "null"], format: date-time }
    RotationStep:
      type: object
      required: [n, location_id, name, status, at, params]
      properties:
        n: { type: integer }
        location_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        status: { type: string }
        at: { type: string, format: date-time }
        params: { type: object, additionalProperties: { type: string } }
    RotationRun:
      type: object
      required: [id, policy_id, old_ssh_key_id, new_ssh_key_id, old_fingerprint, new_fingerprint, trigger, status, paused_license,
        awaiting_decision, decision_due_at, planned_for, notified_at, started_at, verified_at, overlap_until, finished_at, result,
        plan_digest, new_key_type, overlap_minutes, change_count, skip_count, kept_count, actions_allowed, notice_state, notice_error, location_counts, locations, steps, version]
      properties:
        id: { type: string, format: uuid }
        policy_id: { type: string, format: uuid }
        old_ssh_key_id: { type: string, format: uuid }
        new_ssh_key_id: { type: [string, "null"], format: uuid }
        old_fingerprint: { type: string }
        new_fingerprint: { type: string }
        trigger: { type: string, enum: [scheduled, manual] }
        status:
          type: string
          enum: [dry_run_notified, adding_new, verifying_new, overlap, removing_old, completed, rolling_back, aborted, needs_attention,
            cancelled]
        paused_license: { type: boolean }
        awaiting_decision: { type: boolean }
        decision_due_at: { type: [string, "null"], format: date-time }
        planned_for: { type: string, format: date-time }
        notified_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        overlap_until:
          type: [string, "null"]
          format: date-time
          description: >-
            When the overlap ends and the old key is removed. While the run is paused for the license
            (paused_license, notice_state rotation.paused_license) this time is frozen and is not a countdown target:
            after Continue the end moves to the Continue time plus the time that remained when the pause began.
        finished_at: { type: [string, "null"], format: date-time }
        result: { $ref: "#/components/schemas/ErrorRef" }
        plan_digest: { type: string }
        new_key_type: { type: string }
        overlap_minutes: { type: integer }
        change_count: { type: integer }
        skip_count: { type: integer }
        kept_count: { type: integer, description: 'Places where the old key stays (skipped, kept and failed removals)' }
        actions_allowed:
          type: array
          description: >-
            The decisions this caller may take now - specific to the caller: the run's state allows them and the caller
            may use their routes (an Administrator session gets every one, asking for the code where a route needs a
            step-up; an operate token of an Administrator only abort; every other caller none)
          items: { type: string, enum: [continue, finish_now, keep_old, abort] }
        location_counts:
          $ref: "#/components/schemas/LocationCounts"
        notice_state:
          description: 'Why Continue waits on a paused run: rotation.paused_license while the license does not allow changes, rotation.notice_pending while the renewal email is not queued yet; null otherwise'
          $ref: "#/components/schemas/ErrorRef"
        notice_error:
          description: notify.queue_failed when queuing the renewal email failed since the pause began; null otherwise
          $ref: "#/components/schemas/ErrorRef"
        locations: { type: array, items: { $ref: "#/components/schemas/RotationLocation" } }
        steps: { type: array, items: { $ref: "#/components/schemas/RotationStep" } }
        version: { type: integer }
    RotationRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RotationRunSummary" } }
        next_cursor: { type: [string, "null"] }
    LocationCounts:
      type: object
      description: >-
        The places of the run by state; the buckets add up to total. verified - the new key worked there and the old key
        is not removed yet; removed - the old key was removed; kept - the old key is kept there (kept_old): by an administrator's decision, or by Alice when a verified place shares its file with a place that was not verified or was skipped; failed -
        adding, verifying, removing or undoing failed; skipped - the plan left the place out; undone - the new key was
        removed again; cancelled - never sent (the run ended first) or refused when Alice was about to send it;
        in_flight - waiting, being added, added and not yet tested, untestable and waiting for a decision, being removed
        or being undone. kept_count of the run is a different number: every place where the old key stays (skipped,
        kept, cancelled and failed removals).
      required: [total, verified, removed, skipped, kept, failed, undone, cancelled, in_flight]
      properties:
        total: { type: integer }
        verified: { type: integer }
        removed: { type: integer }
        skipped: { type: integer }
        kept: { type: integer }
        failed: { type: integer }
        undone: { type: integer }
        cancelled: { type: integer }
        in_flight: { type: integer }
    RotationRunSummary:
      type: object
      description: A run in the list - its scalar fields and the counts of its places; no plan, places, steps or decisions
      required: [id, policy_id, old_ssh_key_id, new_ssh_key_id, old_fingerprint, new_fingerprint, trigger, status, paused_license,
        awaiting_decision, new_key_type, planned_for, notified_at, started_at, verified_at, overlap_until, finished_at, result, kept_count,
        location_counts, version]
      properties:
        id: { type: string, format: uuid }
        policy_id: { type: string, format: uuid }
        old_ssh_key_id: { type: string, format: uuid }
        new_ssh_key_id: { type: [string, "null"], format: uuid }
        old_fingerprint: { type: string }
        new_fingerprint: { type: string }
        trigger: { type: string, enum: [scheduled, manual] }
        status: { type: string }
        paused_license: { type: boolean }
        awaiting_decision: { type: boolean }
        new_key_type: { type: string }
        planned_for: { type: string, format: date-time }
        notified_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        overlap_until: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        result: { $ref: "#/components/schemas/ErrorRef" }
        kept_count: { type: integer }
        location_counts: { $ref: "#/components/schemas/LocationCounts" }
        version: { type: integer }
    SSHKeyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSHKey" } }
        next_cursor: { type: [string, "null"] }
    KeyRemove:
      type: object
      additionalProperties: false
      properties:
        confirm_last_root_key: { type: boolean, default: false }
    SetupSnippet:
      type: object
      required: [sudoers, script]
      properties:
        sudoers: { type: string }
        script: { type: string }
    PlatformKeyInfo:
      type: object
      required: [public_key, fingerprint, authorized_keys_line, helper_path, helper_protocol, profiles]
      properties:
        public_key: { type: string }
        fingerprint: { type: string }
        authorized_keys_line: { type: string }
        helper_path: { type: string }
        helper_protocol: { type: integer }
        profiles:
          type: object
          required: [linux, nginx, apache, haproxy, windows]
          properties:
            linux: { $ref: "#/components/schemas/SetupSnippet" }
            nginx: { $ref: "#/components/schemas/SetupSnippet" }
            apache: { $ref: "#/components/schemas/SetupSnippet" }
            haproxy: { $ref: "#/components/schemas/SetupSnippet" }
            windows: { $ref: "#/components/schemas/SetupSnippet", description: "A PowerShell script; sudoers is empty" }
    Job:
      type: object
      required: [id, type, kind, status, target_id, deployment_id, import_id, ssh_key_id, rotation_id, attempts, max_attempts, error, result,
        created_at, run_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, examples: [target.test_connection] }
        kind: { type: string, enum: [scheduled, user, system] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, dead, blocked_license] }
        target_id: { type: [string, "null"], format: uuid }
        deployment_id:
          type: [string, "null"]
          format: uuid
          description: 'The deployment a certificate.deploy, certificate.deploy_auto or certificate.deploy_recover job works on (uploads and Key Vault alike); null for other jobs'
        import_id: { type: [string, "null"], format: uuid, description: 'The import a kv.import job sends; null for other jobs' }
        ssh_key_id: { type: [string, "null"], format: uuid, description: 'The key a sshkey.add job deploys; null for other jobs' }
        rotation_id: { type: [string, "null"], format: uuid, description: 'The run a rotation.location job works for; null for other jobs' }
        attempts: { type: integer }
        max_attempts: { type: integer }
        error: { $ref: "#/components/schemas/ErrorRef" }
        result: { type: object }
        created_at: { type: string, format: date-time }
        run_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: [string, "null"] }
    Provider:
      type: object
      required: [kind, display_name_key, capabilities, config_schema]
      properties:
        kind: { type: string, enum: [linuxssh, nginx, apache, haproxy, windows, azurekv] }
        display_name_key: { type: string }
        capabilities:
          type: array
          description: >-
            Known values: test_connection, discover_certificates, discover_ssh_keys, discover_kv_keys,
            discover_kv_secret_metadata, deploy_certificate, import_certificate, authorized_keys, verify_deployment,
            read_certificate_secret, key_login, http01_challenge, cleanup_certificates; a newer server may add others. windows has
            test_connection, discover_certificates, deploy_certificate and verify_deployment (R61) and cleanup_certificates (R62);
            apache and haproxy do not deploy certificates. A target whose provider has cleanup_certificates takes the
            certificate_cleanup switch (PATCH /targets/{id}); it is not part of config_schema.
          items: { type: string }
        config_schema:
          type: object
          required: [fields]
          properties:
            fields:
              type: array
              items:
                type: object
                required: [name, type, required, default, label_key, help_key, pattern, min, max, values]
                properties:
                  name: { type: string }
                  type: { type: string, enum: [string, int, bool, enum, path, host] }
                  required: { type: boolean }
                  default: {}
                  label_key: { type: string }
                  help_key: { type: string }
                  pattern: { type: string }
                  min: { type: integer }
                  max: { type: integer }
                  values: { type: array, items: { type: string } }
    ProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Provider" } }
    WebServerFacts:
      type: object
      description: Present for web servers that were tested or scanned
      required: [software, version, conf_path, config_valid, config_error, config_error_reason, config_error_file, found]
      properties:
        software: { type: string, enum: [nginx, apache, haproxy, iis], description: 'The web server software; equals the target type, or iis on a Windows server' }
        version: { type: string, examples: [1.24.0] }
        conf_path: { type: string, examples: [/etc/nginx/nginx.conf] }
        config_valid: { type: boolean }
        config_error:
          type: string
          description: >-
            Error class when config_valid is false, "" otherwise. Known values: key_mismatch, file_missing,
            cert_load, key_load, syntax, untrusted, unsupported; a newer server may add others.
        config_error_reason:
          type: string
          description: >-
            Why for untrusted and unsupported. Known values: not_root_controlled, special_filesystem, missing,
            not_regular, changed, name_not_allowed, unexpected_text, wrong_first_file, duplicate_file, no_conf_path,
            too_large, too_complex, include_loop, nul_byte; a newer server may add others.
        config_error_file: { type: string, description: 'The file concerned (text from the server; shown as is, never interpolated)' }
        found: { type: boolean }
    CertificateRef:
      type: [object, "null"]
      required: [id, subject_cn, label, fingerprint, not_after]
      properties:
        id: { type: string, format: uuid }
        subject_cn: { type: string }
        label: { type: string }
        fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        not_after: { type: string, format: date-time }
    Certificate:
      type: object
      description: A certificate (public data). A held private key is only indicated by has_private_key.
      required: [id, fingerprint, subject_cn, subject, issuer, serial, sans, not_before, not_after, key_algorithm, key_bits, source,
        label, has_private_key, chain_complete, self_signed, location_count, first_seen_at, last_seen_at, public_key_sha256, revoked_at,
        revocation_reason, revoked_by_name, compromised_at, acme_certificate_id, capabilities, revoked_by_authority]
      properties:
        service: { $ref: "#/components/schemas/ServiceRef" }
        id: { type: string, format: uuid }
        fingerprint: { type: string, pattern: "^[0-9a-f]{64}$", description: 'SHA-256 of the leaf (DER), hex' }
        subject_cn: { type: string }
        subject: { type: string }
        issuer: { type: string }
        serial: { type: string }
        sans: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        key_algorithm: { type: string, description: "Known values: rsa, ecdsa, ed25519, other" }
        key_bits: { type: integer }
        source: { type: string, description: "Known values: discovered, uploaded, csr, azure_kv, acme" }
        label: { type: string }
        has_private_key: { type: boolean }
        chain_complete: { type: boolean }
        self_signed: { type: boolean }
        location_count: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        public_key_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: 'SHA-256 of the SubjectPublicKeyInfo: certificates made with the same key share it' }
        revoked_at: { type: [string, "null"], format: date-time, description: 'When its CA revoked it at Alice''s request (final)' }
        revocation_reason: { $ref: "#/components/schemas/RevocationReasonOrEmpty" }
        revoked_by_name: { type: string, description: 'Who revoked it ("" for nobody or Alice herself)' }
        compromised_at: { type: [string, "null"], format: date-time, description: 'When its private key was marked compromised (final)' }
        acme_certificate_id: { type: [string, "null"], format: uuid, description: 'The ACME certificate whose order produced it' }
        capabilities:
          type: array
          description: What Alice can do with this certificate (its source's capabilities, less deploy and verify without a key or once revoked or compromised, less revoke once revoked)
          items: { $ref: "#/components/schemas/SourceCapability" }
        revoked_by_authority: { type: boolean, description: 'R64: the authority revoked it and Alice learned it by the revocation check (not at her request)' }
    RevocationCheck:
      type: [object, "null"]
      description: >-
        R64: the last revocation check of a certificate (null before the first). error is the reason of an unavailable or
        not checkable check (ALC-CRT-0020 to ALC-CRT-0025).
      required: [status, method, reason, revoked_at, checked_at, next_check_at, error]
      properties:
        status: { type: string, enum: [good, revoked, on_hold, unknown, unavailable, not_checkable] }
        method: { type: string, enum: ["", ocsp, crl] }
        reason: { type: string, description: The RFC 5280 name the authority gave (revoked and on_hold) }
        revoked_at: { type: [string, "null"], format: date-time }
        checked_at: { type: string, format: date-time }
        next_check_at: { type: string, format: date-time }
        error: { $ref: "#/components/schemas/ErrorRef" }
    RevocationCheckSettings:
      type: object
      required: [enabled, version]
      properties:
        enabled: { type: boolean }
        version: { type: integer }
    CertificateDetail:
      allOf:
        - { $ref: "#/components/schemas/Certificate" }
        - type: object
          required: [pem_chain, locations, locations_truncated, revocation_check]
          properties:
            pem_chain: { type: string, description: 'Leaf first, then the chain (public PEM)' }
            locations: { type: array, items: { $ref: "#/components/schemas/CertificateLocation" }, maxItems: 1000 }
            locations_truncated: { type: boolean }
            revocation_check: { $ref: "#/components/schemas/RevocationCheck" }
    CertificatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
        next_cursor: { type: [string, "null"] }
    CertificateUpload:
      type: object
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid, description: "R49: the service the new certificate goes to; absent: the Default service. An unknown one is 422 validation.required on service_id. Never changed by an update: POST /api/v1/services/{id}/actions/assign moves it." }
        label: { type: string, maxLength: 100 }
        certificate_pem: { type: string, maxLength: 262144, description: 'Leaf first, then the chain' }
        private_key_pem: { type: string, maxLength: 262144, writeOnly: true, description: 'Unencrypted PKCS#8, PKCS#1 or SEC 1' }
        pfx_base64: { type: string, writeOnly: true, description: 'A PFX (PKCS#12) file in standard base64, at most 256 KiB decoded' }
        pfx_password: { type: string, writeOnly: true }
    CertificateStored:
      type: object
      description: >-
        The answer of an upload and of a signing request's completion. certificate is the detail form (pem_chain,
        locations, locations_truncated) as GET /certificates/{id} returns it: public data, saving a second request.
      required: [certificate, warnings]
      properties:
        certificate: { $ref: "#/components/schemas/CertificateDetail" }
        warnings:
          type: array
          description: >-
            Conditions that did not block. Known values: chain_incomplete, chain_certificate_expired, not_yet_valid,
            csr_name_mismatch, chain_completed (an upload completed the chain of a certificate Alice already held;
            answered with 200); a newer server may add others.
          items: { type: string }
    CertificateServer:
      type: object
      required: [names, listens, file, line]
      properties:
        names: { type: array, items: { type: string } }
        listens:
          type: array
          items:
            type: object
            required: [addr, port, default_server]
            properties:
              addr: { type: string }
              port: { type: integer }
              default_server: { type: boolean }
        file: { type: string }
        line: { type: integer }
        section:
          type: string
          description: >-
            HAProxy: the frontend or listen section; absent for Nginx and Apache.
    CertificateLocation:
      type: object
      description: >-
        A certificate file a website uses, with its key file. Paths, names, files and accounts are text from
        the server (shown as is, never interpolated into a message).
      required: [id, target_id, target_name, cert_path, key_path, resolved_cert_path, key_type, certificate, servers, supported,
        unsupported_reason, problem, key_problem, inherited, custom_location, symlinked, key_exists, key_mode, key_owner, key_group,
        warnings, deployed_fingerprint, changed_outside_at, verify_port, verify_sni, skip_verify, first_seen_at, last_seen_at,
        missing_since, version, active_deployment_id, target_type, deployable, kind, locator, details, verify_address]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string, description: 'A certificate file''s path; for another kind the canonical text of its locator' }
        key_path: { type: string }
        resolved_cert_path: { type: string, description: 'The file a symbolic link leads to; "" when not known' }
        key_type: { type: string, description: "The key type of the certificate in the file: rsa, ecdsa or \"\"" }
        certificate: { $ref: "#/components/schemas/CertificateRef" }
        servers: { type: array, items: { $ref: "#/components/schemas/CertificateServer" } }
        supported: { type: boolean }
        unsupported_reason:
          type: string
          description: >-
            "" when supported. Known values: variable, data_value, engine_key, key_missing, password_file,
            path_not_allowed, stream, combined_file, config_file_writable, conditional, unknown_keyword, key_conflict, file_problem (see
            problem and key_problem), unsupported_key, unknown; a newer server may add others.
        problem: { $ref: "#/components/schemas/FileProblem" }
        key_problem: { $ref: "#/components/schemas/FileProblem" }
        inherited: { type: boolean }
        custom_location: { type: boolean }
        symlinked: { type: boolean }
        key_exists: { type: boolean }
        key_mode: { type: string, examples: ["0640"] }
        key_owner: { type: string }
        key_group: { type: string }
        warnings:
          type: array
          description: >-
            Known values: key_mode_open, symlinked, custom_location, key_group_open, certificate_block_dropped,
            list_truncated, certificate_expired, san_mismatch, chain_unresolved (the file's chain could not be ordered
            within the signature checks Alice makes per file; the leaf alone is kept); a newer server may add others.
          items: { type: string }
        deployed_fingerprint: { type: string }
        changed_outside_at: { type: [string, "null"], format: date-time }
        verify_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        verify_sni: { type: string }
        skip_verify: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1, description: 'The value If-Match names for PATCH /locations/{id}' }
        active_deployment_id: { type: [string, "null"], format: uuid }
        target_type:
          type: string
          enum: [nginx, apache, haproxy, windows, f5_bigip, kubernetes]
          description: "The server's target type (its web server software, or windows for the http.sys bindings of a Windows server); f5_bigip and kubernetes are reserved (R59)"
        kind:
          type: string
          enum: [server_file, win_sslbinding, f5_clientssl, k8s_tls_secret]
          description: >-
            R59. The location's kind: a certificate file (server_file), or a Windows http.sys SSL binding, a BIG-IP
            client SSL profile entry, a Kubernetes TLS Secret (reserved for the targets that report them).
        locator:
          description: >-
            R59. The identity of a location that is not a file (a flat object of short strings, integers and booleans);
            null for a certificate file.
          oneOf:
            - { type: object, additionalProperties: { type: [string, integer, boolean] } }
            - { type: "null" }
        details: { type: object, description: 'R59. Facts of the location''s kind shown as they are; {} for a certificate file. A Windows binding carries alice_imported (R62: true when Alice imported the certificate the binding names, so the cleanup may remove it once nothing uses it)' }
        verify_address:
          type: string
          description: 'R59. Where Alice''s probe reaches the endpoints (a DNS name or an IP literal); "" when not set, always "" for a file' 
        deployable:
          type: boolean
          description: >-
            Whether the server's software deploys certificates (the deploy_certificate capability). A place on a
            discovery-only server (Apache) is false: it is listed, and a deployment request for it is refused with
            location_unsupported.
        observation:
          description: R52. What the location should have, what Alice last deployed and what is observed today; null for a location that follows no binding.
          oneOf:
            - { $ref: "#/components/schemas/LocationObservation" }
            - { type: "null" }
    DriftModeInput:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [observe, approve, auto, default] }
    ObservedCertificate:
      type: object
      required: [certificate_id, fingerprint, not_after]
      properties:
        certificate_id: { type: [string, "null"], format: uuid, description: null when Alice does not hold the certificate }
        fingerprint: { type: string, description: 'The leaf''s SHA-256 (hex); "" when the file holds no certificate' }
        not_after: { type: [string, "null"], format: date-time }
    LocationObservation:
      type: object
      description: >-
        R52 (docs/superpowers/rulings/certificate-drift.md). Four facts, each with its own time: desired (the
        binding's current certificate), last_deployment (the newest succeeded or unchanged deployment and the level it
        proved), file (what the last scan that read the file found, observed_at being that scan's time, never the time
        of a scan that could not read the file) and tls (what the websites served at the last probe that completed a
        handshake: when, from where, the level and the served chain's trust). health is derived from them: in_sync
        (the newest observations agree and one of them, or the deployment, is younger than 24 hours), drifted (the
        location had the desired certificate and an observation newer than its deployment disagrees: the website served
        another leaf, or a scan found another one in the file that Alice did not put there), pending (a deployment runs,
        or the desired certificate has not reached the location), unreachable (the last probe completed no handshake),
        stale (nothing newer than 24 hours says what the location holds), unmanaged (nothing is desired).
      required: [health, source, source_id, desired, last_deployment, file, tls, tls_attempted_at, tls_error, mode, mode_setting,
        default_mode, drift_since, drift_fingerprint, drift_source, backoff_reason, backed_off_at, active_deployment_id,
        next_observe_at, repair_available, drift_cause, autocertrebind]
      properties:
        health: { type: string, enum: [in_sync, drifted, pending, unreachable, stale, unmanaged] }
        source: { type: string, enum: [acme, key_vault, ""] }
        source_id: { type: [string, "null"], format: uuid, description: The ACME certificate or the Key Vault binding }
        desired:
          oneOf:
            - { $ref: "#/components/schemas/ObservedCertificate" }
            - { type: "null" }
        last_deployment:
          oneOf:
            - type: object
              required: [deployment_id, fingerprint, finished_at, level]
              properties:
                deployment_id: { type: string, format: uuid }
                fingerprint: { type: string }
                finished_at: { type: [string, "null"], format: date-time }
                level: { type: integer, minimum: 0, maximum: 3, description: 'R51: 1 installed, 2 served, 3 trusted' }
            - { type: "null" }
        file:
          oneOf:
            - allOf:
                - { $ref: "#/components/schemas/ObservedCertificate" }
                - type: object
                  required: [observed_at, changed_outside_at]
                  properties:
                    observed_at: { type: string, format: date-time }
                    changed_outside_at: { type: [string, "null"], format: date-time }
            - { type: "null" }
        tls:
          oneOf:
            - allOf:
                - { $ref: "#/components/schemas/ObservedCertificate" }
                - type: object
                  required: [observed_at, probe, level, trust, trust_error]
                  properties:
                    observed_at: { type: string, format: date-time }
                    probe: { type: string, enum: [alice, helper], description: "alice: Alice's own probe; helper: the server itself (for at least one endpoint)" }
                    level: { type: integer, minimum: 0, maximum: 3, description: '2 served or 3 trusted when the desired certificate was served, 0 otherwise' }
                    trust: { type: string, enum: [trusted, untrusted, unchecked, ""] }
                    trust_error: { type: string, description: 'R51 trust error when untrusted, "" otherwise' }
            - { type: "null" }
        tls_attempted_at: { type: [string, "null"], format: date-time }
        tls_error: { $ref: "#/components/schemas/ErrorRef" }
        mode: { type: string, enum: [observe, approve, auto], description: The effective repair mode }
        mode_setting: { type: string, enum: [observe, approve, auto, default], description: 'The chosen mode; default follows default_mode' }
        default_mode: { type: string, enum: [observe, auto], description: auto when automatic deployment is on for the binding }
        drift_since: { type: [string, "null"], format: date-time, description: Since when the open drift episode lasts }
        drift_fingerprint: { type: string, description: 'The leaf the observation that found the drift saw ("" for a file without one)' }
        drift_source: { type: string, enum: [tls, file, ""] }
        backoff_reason: { type: string, enum: [flapping, repair_failing, ""], description: Why automatic repair backed off to observe }
        backed_off_at: { type: [string, "null"], format: date-time }
        active_deployment_id: { type: [string, "null"], format: uuid }
        next_observe_at: { type: [string, "null"], format: date-time }
        repair_available: { type: boolean, description: 'The location is drifted and can be repaired; POST /locations/{id}/actions/repair repairs it. False for a Windows binding whose drift cause is cert_removed or key_unusable (the repair answers 409 ALC-WIN-0013)' }
        drift_cause:
          type: string
          enum: [binding_repointed, cert_removed, key_unusable, ""]
          description: >-
            R62. Why a drifted Windows binding is drifted: binding_repointed (it names another certificate), cert_removed
            (its store no longer holds the certificate, or the binding has none), key_unusable (the certificate has no
            private key http.sys can use). "" for a certificate file and for a location that is not drifted.
        autocertrebind: { type: boolean, description: 'R62. True only for a drifted Windows binding with a known drift_cause whose server runs the AutoCertRebind task (which can bind a certificate by itself, design §6.2); false for every other location, including an in_sync binding on such a server' }
    FileProblem:
      type: string
      description: >-
        A certificate or key file Alice cannot use; "" when none. Known values: missing, not_root_controlled,
        not_regular, hard_linked, too_large, not_a_certificate, leaf_unreadable (the file's first certificate, the one
        Nginx serves, cannot be read), unreadable, bad_name, name_not_allowed (the file's real
        name, after links, has a character outside the helper's vocabulary), special_filesystem, unknown; a
        newer server may add others.
    CertificateLocationList:
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CertificateLocation" }, maxItems: 1000 }
        truncated: { type: boolean }
    LocationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        verify_port: { type: integer, minimum: 0, maximum: 65535, description: '0 clears (the website''s own ports are probed)' }
        verify_sni: { type: string, maxLength: 253, description: 'A DNS name; "" clears (the first server name is sent)' }
        skip_verify: { type: boolean }
        verify_address:
          type: string
          maxLength: 253
          description: 'R59. A DNS name or an IP literal Alice probes instead of the address it derives; "" clears. Not for a certificate file.'
    CSR:
      type: object
      description: A signing request (public). Its key stays in Alice.
      required: [id, common_name, sans, key_algorithm, key_bits, csr_pem, status, certificate_id, created_at, finished_at]
      properties:
        service: { $ref: "#/components/schemas/ServiceRef" }
        id: { type: string, format: uuid }
        common_name: { type: string }
        sans: { type: array, items: { type: string }, description: 'The request''s DNS names, the common name first' }
        key_algorithm: { type: string, enum: [rsa, ecdsa] }
        key_bits: { type: integer }
        csr_pem: { type: string }
        status: { type: string, enum: [pending, completed, cancelled] }
        certificate_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    CSRList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CSR" } }
    CSRCreate:
      type: object
      required: [common_name, key_type]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid, description: "R49: the service the new signing request (and its certificate) goes to; absent: the Default service. An unknown one is 422 validation.required on service_id. Never changed by an update: POST /api/v1/services/{id}/actions/assign moves it." }
        common_name: { type: string, maxLength: 64 }
        sans: { type: array, maxItems: 50, items: { type: string } }
        key_type: { type: string, enum: [ecdsa-p256, rsa-3072, rsa-4096] }
    CSRComplete:
      type: object
      required: [certificate_pem]
      additionalProperties: false
      properties:
        certificate_pem: { type: string, maxLength: 262144 }
        label: { type: string, maxLength: 100 }
    DeployRequest:
      type: object
      required: [location_ids]
      additionalProperties: false
      properties:
        location_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
        confirm_incomplete_chain: { type: boolean, description: 'Counts for an Administrator only' }
    DeployAccepted:
      type: object
      required: [deployments]
      properties:
        deployments:
          type: array
          items:
            type: object
            required: [id, job_id, location_id, status_url, deployment_url, warnings]
            properties:
              id: { type: string, format: uuid }
              job_id: { type: string, format: uuid }
              location_id: { type: string, format: uuid }
              status_url: { type: string, examples: [/api/v1/jobs/0192b000-0000-7000-8000-0000000000b1] }
              deployment_url: { type: string, examples: [/api/v1/deployments/0192c000-0000-7000-8000-0000000000d4] }
              warnings:
                type: array
                description: "Known values: san_mismatch; a newer server may add others."
                items: { type: string }
    DeploymentStep:
      type: object
      required: [n, name, status, at, params]
      properties:
        n: { type: integer, minimum: 1 }
        name:
          type: string
          description: >-
            Known values: verify_current, kv_secret, recover_pending, backup, write_key, write_cert, config_test, reload,
            journal, restore, rollback_config_test, rollback_reload, verify, verify_old, import_chain, import_certificate,
            bind, upload, install, commit, sync, save, write_secret (the last nine: the Windows, BIG-IP and Kubernetes
            targets, R59); a newer server may add others.
        status: { type: string, enum: [started, ok, failed, skipped] }
        at: { type: string, format: date-time }
        params:
          type: object
          description: >-
            Allowlisted values only: error (a configuration error class or file_changed), port, mode (remote, local,
            skipped), served (a fingerprint), reason (a reason code), operation_id (on recover_pending: the
            unfinished earlier change), trust (on verify: trusted, untrusted or unchecked), trust_error (why a
            served chain did not verify; R51), and on a Windows binding's verify chain_differs (true when Windows
            serves a chain of another length than Alice deployed) with deployed_chain and built_chain (the two
            lengths, 1-99; R61).
          additionalProperties: { type: string }
    Deployment:
      type: object
      description: >-
        One deployment. Show state and status, not the job's: a deployment being recovered is state recovering
        while its job may already have ended. status failed = nothing was written; rolled_back = the previous files
        are back; rollback_failed = the outcome is unknown or mixed (see error); needs_attention = Alice cannot
        reach the server to finish it and keeps trying.
      required: [id, certificate_id, certificate_name, location_id, target_id, target_name, cert_path, key_path, job_id, job_status,
        trigger, state, status, result, phase, new_fingerprint, previous_fingerprint, confirm_incomplete_chain, verified,
        verify_failed, error, failed_step, cause_step, helper_error, backup_dir, location_kind, requested_by, requested_by_name, recovery_attempts,
        recover_after, created_at, started_at, finished_at, source, binding_id, kv_version, vault_name, verification]
      properties:
        id: { type: string, format: uuid }
        certificate_id: { type: string, format: uuid }
        certificate_name: { type: string, description: 'The label, else the subject CN, else the start of the fingerprint' }
        location_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string }
        key_path: { type: string }
        job_id: { type: [string, "null"], format: uuid }
        job_status: { type: string, description: 'The job''s status ("" once it was pruned); blocked_license means held in lock' }
        trigger: { type: string, examples: [manual] }
        state: { type: string, enum: [queued, precheck, deploying, recovering, done] }
        status: { type: string, enum: [pending, running, succeeded, unchanged, failed, rolled_back, rollback_failed, needs_attention] }
        result: { type: string, enum: ["", committed, unchanged, no_change, rolled_back, rollback_failed, uncertain] }
        phase: { type: string, enum: ["", none, prepared, writing, committed, unchanged, restoring, restored, restore_failed, restore_forbidden] }
        new_fingerprint: { type: string }
        previous_fingerprint: { type: string }
        confirm_incomplete_chain: { type: boolean }
        source: { type: string, enum: [upload, key_vault, acme], description: 'key_vault: the certificate came from a vault version (binding_id, kv_version and vault_name are set); acme: the certificate was ordered from a certificate authority' }
        binding_id: { type: [string, "null"], format: uuid }
        kv_version: { type: string, description: 'The vault version (32 hex digits); "" for an upload' }
        vault_name: { type: string, description: 'The vault''s name in Alice; "" for an upload' }
        verified: { type: string, enum: ["", remote, local, skipped] }
        verify_failed: { $ref: "#/components/schemas/ErrorRef", description: 'The verification failure that started a rollback (params.port)' }
        verification: { $ref: "#/components/schemas/DeploymentVerification" }
        error:
          $ref: "#/components/schemas/ErrorRef"
          description: >-
            Why it did not succeed, as a documented code; null on success. Params are allowlisted (port, failed_step,
            phase, profile, backup_dir, helper_code, subcommand, ...; for a Windows binding store and previous_sha1 in
            place of backup_dir, and helper_version and required_version on windows.helper_outdated, R61). deployment.rollback_failed is reported as
            deployment.restored_unverified (ALC-DEP-0019) when the files are back but the website was not confirmed,
            and as deployment.rollback_file_changed (ALC-DEP-0020) when another program changed the files (Alice put
            back at most what it had written: the pair may not match). A deployment whose waiting job an
            Administrator discarded ends failed with deployment.cancelled (ALC-DEP-0022; nothing was sent). A Key Vault
            deployment whose vault's stored sign-in credentials Alice cannot decrypt ends failed at kv_secret with
            kv.credential_unreadable (ALC-AKV-0041; nothing was read or sent; replace the vault's credentials). A served
            chain that does not verify against a known trust anchor is deployment.verify_untrusted (ALC-DEP-0026, params
            port and trust_error; R51).
        failed_step: { type: string, description: "The step that failed (verify_current when the pre-check refused; verify when the new certificate was not confirmed; kv_secret when a Key Vault deployment could not read or accept its certificate secret); \"\" when none" }
        cause_step: { type: string }
        helper_error: { type: string, description: "A configuration error class or file_changed; \"\" when none" }
        backup_dir: { type: string, description: 'Where the server keeps the previous files (/var/lib/alice-helper/backups/<id>); "" before a change and always "" for a Windows binding' }
        location_kind: { type: string, enum: [server_file, win_sslbinding, f5_clientssl, k8s_tls_secret], description: 'R62. The kind of the deployment''s location, always present: server_file for a certificate file, win_sslbinding for an IIS binding' }
        backup_store: { type: string, pattern: '^([Mm][Yy]|[Ww][Ee][Bb][Hh][Oo][Ss][Tt][Ii][Nn][Gg])$', description: 'R61. A Windows binding only (absent otherwise): the certificate store that holds the previous certificate, My or WebHosting in any letter case (a binding without a store name reads MY)' }
        backup_sha1: { type: string, pattern: '^[0-9a-f]{40}$', description: 'R61. A Windows binding only (absent otherwise): the SHA-1 thumbprint of the previous certificate' }
        requested_by: { type: [string, "null"], format: uuid }
        requested_by_name: { type: string }
        recovery_attempts: { type: integer }
        recover_after: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time, description: 'When the change started (the start record)' }
        finished_at: { type: [string, "null"], format: date-time }
    DeploymentVerification:
      type: object
      description: >-
        What the verification of the new certificate proved and found (R51). level: 0 none (not succeeded), 1 installed
        (files written and the web server reloaded; the check was skipped), 2 served (every endpoint serves the expected
        leaf with the deployed chain length), 3 trusted (and every served chain verifies with crypto/x509 against the
        trust store for the endpoint's name at the probe time); 4 is reserved for a service health check and not
        reported yet. A deployment from before R51 reads 2 when it succeeded with a check. failure: the kind of a failed
        verification: network (no handshake on any attempt), certificate (another leaf or chain length) or trust
        (deployment.verify_untrusted); "" otherwise.
      required: [level, trust, failure]
      properties:
        level: { type: integer, minimum: 0, maximum: 4 }
        failure: { type: string, enum: ["", network, certificate, trust] }
        trust:
          description: 'Null when not measured (the check was skipped, or a deployment from before R51)'
          oneOf:
            - type: "null"
            - type: object
              required: [status, error, port, store, enforced]
              properties:
                status: { type: string, enum: [trusted, untrusted, unchecked], description: 'unchecked: an alice-helper older than 1.10.0 answered the in-target check without the chain' }
                error:
                  type: string
                  enum: ["", unknown_authority, wrong_intermediate, incomplete_chain, chain_order, name_mismatch, expired, not_yet_valid, invalid_chain]
                  description: 'Why the first untrusted chain did not verify; "" unless untrusted'
                port: { type: [integer, "null"], description: 'The endpoint whose chain did not verify' }
                store: { type: string, enum: ["", system, acme_bundle, uploaded_root], description: 'The trust store: system roots, with the issuing ACME authority''s CA bundle, or with the root uploaded with the chain' }
                enforced: { type: boolean, description: 'The anchor was known (the deployed chain verifies against the store): an untrusted chain then fails the deployment, except a name mismatch, which is always a warning' }
    DeploymentDetail:
      allOf:
        - { $ref: "#/components/schemas/Deployment" }
        - type: object
          required: [steps]
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/DeploymentStep" } }
    DeploymentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        next_cursor: { type: [string, "null"] }
    DashboardSummary:
      type: object
      required: [generated_at, certificates, deployments, targets, license, rotation, notifications, audit, attention]
      properties:
        generated_at: { type: string, format: date-time }
        certificates:
          type: object
          required: [monitored, expired, within_7, within_30, within_60, kv_expired, kv_within_30]
          properties:
            monitored: { type: integer, description: Certificates in use }
            expired: { type: integer }
            within_7: { type: integer, description: 'Expiring within 7 days, expired ones included' }
            within_30: { type: integer }
            within_60: { type: integer }
            kv_expired: { type: integer, description: Key Vault keys and client secrets that expired }
            kv_within_30: { type: integer, description: 'Key Vault keys and client secrets expiring within 30 days, expired ones included' }
        deployments:
          type: object
          required: [failed_7d, recent]
          properties:
            failed_7d: { type: integer }
            recent:
              type: array
              maxItems: 5
              items:
                type: object
                required: [id, certificate_name, target_id, target_name, status, error_code, at]
                properties:
                  id: { type: string, format: uuid }
                  certificate_name: { type: string }
                  target_id: { type: string, format: uuid }
                  target_name: { type: string }
                  status: { type: string, enum: [failed, rolled_back, rollback_failed, needs_attention] }
                  error_code: { type: string }
                  at: { type: string, format: date-time }
        targets:
          type: object
          required: [total, by_status]
          properties:
            total: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
        license:
          type: object
          required: [expired, phase, ends_at, days_left]
          properties:
            expired: { type: boolean }
            phase: { type: string, description: '"" for Operators' }
            ends_at: { type: [string, "null"], format: date-time }
            days_left: { type: [integer, "null"] }
        rotation:
          type: object
          required: [upcoming, running, needs_attention]
          properties:
            upcoming:
              type: array
              maxItems: 5
              items:
                type: object
                required: [policy_id, ssh_key_id, key_label, next_run_at]
                properties:
                  policy_id: { type: string, format: uuid }
                  ssh_key_id: { type: string, format: uuid }
                  key_label: { type: string }
                  next_run_at: { type: string, format: date-time }
            running: { type: integer }
            needs_attention: { type: integer }
        notifications:
          description: Administrators and their API tokens only; null for every other role
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/Delivery" }
        audit:
          description: Administrators and Auditors; null for Operators and before the first checkpoint
          oneOf:
            - { type: "null" }
            - type: object
              required: [head_seq, head_hash, checked_at, intact]
              properties:
                head_seq: { type: integer }
                head_hash: { type: string }
                checked_at: { type: string, format: date-time }
                intact: { type: boolean }
        attention: { type: integer, description: The number of conditions GET /api/v1/alerts lists for the caller }
        backup:
          description: Administrators and Auditors; absent for Operators
          $ref: "#/components/schemas/BackupStatus"
        setup_checklist:
          description: >-
            Administrators only ("Finish setting up"): passphrase and https are required; mail, license and target are
            recommended. A step skipped in the wizard stays open here.
          type: array
          items:
            type: object
            required: [item, done, required]
            properties:
              item: { type: string, enum: [passphrase, https, mail, license, target] }
              done: { type: boolean }
              required: { type: boolean }
        discovery:
          description: >-
            Network discovery's quiet metric, separate from the managed counts above (which never include it): unmanaged
            certificates found on the network that expire within the next 30 days (not expired yet), as in
            GET /api/v1/discovery/summary. Present only while at least one scan scope exists, and only for a caller
            with discovery.view (every role in a browser session, operate-scope API tokens); absent for read-scope API
            tokens.
          type: object
          required: [unmanaged_expiring_30d]
          properties:
            unmanaged_expiring_30d: { type: integer }
    ExpiringItem:
      type: object
      required: [kind, object_id, name, expires_at, days_left, expired, fingerprint, websites, servers, target_ids, vault, vault_id]
      properties:
        kind: { type: string, enum: [certificate_expiry, kv_certificate_expiry, kv_key_expiry, kv_credential_expiry] }
        object_id: { type: string, format: uuid, description: 'The certificate, Key Vault certificate or key, or (for a sign-in secret) the vault' }
        name: { type: string }
        expires_at: { type: string, format: date-time }
        days_left: { type: integer, description: 'Whole days left, rounded up; 0 once expired' }
        expired: { type: boolean }
        fingerprint: { type: string, description: 'Certificates only; "" otherwise' }
        websites: { type: array, maxItems: 10, items: { type: string } }
        servers: { type: array, maxItems: 10, items: { type: string } }
        target_ids: { type: array, items: { type: string, format: uuid } }
        vault: { type: string }
        vault_id: { type: [string, "null"], format: uuid, description: null for certificates }
    Condition:
      type: object
      required: [kind, object_id, name, since, error_code]
      properties:
        kind: { type: string, enum: [host_key_changed, auth_failed, deployment_failed, audit_broken, notifications_failing] }
        object_id: { type: string, description: 'The server or deployment; "" for audit_broken and notifications_failing' }
        name: { type: string }
        since: { type: string, format: date-time }
        error_code: { type: string }
    Delivery:
      type: object
      required: [failing, consecutive_failures, last_failure_at, last_failure_code, last_success_at, pending, failed_24h]
      properties:
        failing: { type: boolean, description: The last 3 or more send attempts all failed }
        consecutive_failures: { type: integer }
        last_failure_at: { type: [string, "null"], format: date-time }
        last_failure_code: { type: string, description: 'The closed label of the last failure (smtp.connect, smtp.tls, smtp.untrusted, smtp.auth, smtp.rejected, smtp.address_refused, smtp.error); "" when none' }
        last_success_at: { type: [string, "null"], format: date-time }
        pending: { type: integer, description: E-mails waiting to be sent now }
        failed_24h: { type: integer, description: 'E-mails that gave up recently (an approximate figure: queued within the last 48 hours and given up after 24 hours of retries)' }
    View:
      type: object
      required: [id, page, name, query, created_at]
      properties:
        id: { type: string, format: uuid }
        page: { type: string, enum: [certificates, ssh_keys] }
        name: { type: string }
        query: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
    ViewInput:
      type: object
      required: [page, name, query]
      additionalProperties: false
      properties:
        page: { type: string, enum: [certificates, ssh_keys] }
        name: { type: string, minLength: 1, maxLength: 60 }
        query: { type: object, additionalProperties: { type: string, maxLength: 200 } }
    SMTP:
      type: object
      required: [configured, host, port, tls_mode, from, username, has_password, ca_pem, trusted_certificate, version, updated_at]
      properties:
        configured: { type: boolean }
        host: { type: string }
        port: { type: integer }
        tls_mode: { type: string, description: 'starttls or tls; "" when not configured' }
        from: { type: string }
        username: { type: string }
        has_password: { type: boolean, description: Whether a password is stored; the password itself is never returned }
        ca_pem: { type: string, description: Extra certificate authorities the mail server's certificate may chain to }
        trusted_certificate:
          oneOf:
            - { type: "null" }
            - type: object
              required: [fingerprint, subject, not_after, trusted_by, trusted_at]
              properties:
                fingerprint: { type: string }
                subject: { type: string }
                not_after: { type: string, format: date-time }
                trusted_by: { type: string }
                trusted_at: { type: string, format: date-time }
        version: { type: integer }
        updated_at: { type: [string, "null"], format: date-time }
    SMTPInput:
      type: object
      required: [host, port, tls_mode, from, username, ca_pem]
      additionalProperties: false
      properties:
        host: { type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9._:-]+$', description: 'A DNS name or an IP address; an IPv6 address without brackets' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls_mode: { type: string, enum: [starttls, tls] }
        from: { type: string, maxLength: 254 }
        username: { type: string, maxLength: 255 }
        password: { type: [string, "null"], writeOnly: true, maxLength: 1024, description: 'Request only; absent or null keeps the stored password, "" removes it' }
        ca_pem: { type: string, maxLength: 65536, description: '"" or 1 to 20 PEM CERTIFICATE blocks' }
    Recipients:
      type: object
      required: [administrators, addresses, version]
      properties:
        administrators: { type: boolean, description: 'Every enabled Administrator with an e-mail address, in their language' }
        addresses:
          type: array
          items:
            type: object
            required: [email, locale]
            properties:
              email: { type: string }
              locale: { type: string, enum: [en, tr] }
        version: { type: integer }
    RecipientsInput:
      type: object
      required: [administrators, addresses]
      additionalProperties: false
      properties:
        administrators: { type: boolean }
        addresses:
          type: array
          maxItems: 20
          items:
            type: object
            required: [email, locale]
            additionalProperties: false
            properties:
              email: { type: string, maxLength: 254 }
              locale: { type: string, enum: [en, tr] }
    AlertSettings:
      type: object
      required: [thresholds_days, version]
      properties:
        thresholds_days: { type: array, items: { type: integer } }
        version: { type: integer }
    GeneralSettings:
      type: object
      required: [public_url, retired_key_retention_days, version]
      properties:
        public_url: { type: string }
        retired_key_retention_days: { type: integer }
        version: { type: integer }
    PublicProvider:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AuthorizeURL:
      type: object
      required: [authorize_url]
      properties:
        authorize_url: { type: string, description: "The identity provider's authorize address with the state, nonce and PKCE challenge" }
    IdentityProvider:
      type: object
      required: [id, name, issuer_url, client_id, has_client_secret, scopes, groups_claim, ca_pem, endpoints, enabled, redirect_uri, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        issuer_url: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean, description: Whether a client secret is stored; the secret itself is never returned }
        scopes: { type: array, items: { type: string } }
        groups_claim: { type: string }
        ca_pem: { type: string }
        endpoints:
          type: object
          required: [authorization, token, jwks]
          properties:
            authorization: { type: string }
            token: { type: string }
            jwks: { type: string }
        enabled: { type: boolean }
        redirect_uri: { type: string, description: 'The address to register at the identity provider; "" while Alice''s address is not set' }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentityProviderCreate:
      type: object
      required: [name, issuer_url, client_id, client_secret]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        issuer_url: { type: string, description: An https address }
        client_id: { type: string, minLength: 1, maxLength: 255 }
        client_secret: { type: string, writeOnly: true, minLength: 1, maxLength: 1024, description: Request only; never returned or logged }
        scopes: { type: array, minItems: 1, maxItems: 10, items: { type: string, pattern: '^[A-Za-z0-9_.:/-]{1,64}$' }, description: 'Must include openid; default openid, profile, email' }
        groups_claim: { type: string, pattern: '^[A-Za-z0-9_.:/-]{1,100}$', description: 'Default groups' }
        ca_pem: { type: string, maxLength: 65536 }
        enabled: { type: boolean, default: false }
    IdentityProviderPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        issuer_url: { type: string }
        client_id: { type: string, minLength: 1, maxLength: 255 }
        client_secret: { type: string, writeOnly: true, minLength: 1, maxLength: 1024, description: Request only; replaces the stored secret }
        scopes: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
        groups_claim: { type: string }
        ca_pem: { type: string, maxLength: 65536 }
        enabled: { type: boolean }
    Mapping:
      type: object
      required: [id, provider_id, group, role, created_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        group: { type: string }
        role: { type: string, enum: [admin, operator, auditor] }
        created_at: { type: string, format: date-time }
    SSOSettings:
      type: object
      required: [allow_admin_role, version]
      properties:
        allow_admin_role: { type: boolean }
        version: { type: integer }
    PublicDirectory:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Directory:
      type: object
      required: [id, name, addresses, user_base_dn, user_filter, login_attribute, unique_id_attribute, display_name_attribute, email_attribute, bind_dn, bind_password_set, group_base_dn, group_filter, group_name_attribute, ca_pem, mfa_required, enabled, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        addresses: { type: array, items: { type: string }, description: '1 to 3 ldaps://host[:port] addresses, tried in order' }
        user_base_dn: { type: string }
        user_filter: { type: string, description: 'Holds {login} once' }
        login_attribute: { type: string }
        unique_id_attribute: { type: string }
        display_name_attribute: { type: string }
        email_attribute: { type: string }
        bind_dn: { type: string, description: The read-only service account }
        bind_password_set: { type: boolean, description: Whether a service account password is stored; the password itself is never returned }
        group_base_dn: { type: string }
        group_filter: { type: string, description: 'Holds {dn} or {login}' }
        group_name_attribute: { type: string, description: '"" means the group entry''s DN is the group value' }
        ca_pem: { type: string }
        mfa_required: { type: boolean }
        enabled: { type: boolean }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DirectoryCreate:
      type: object
      required: [name, addresses, user_base_dn, user_filter, login_attribute, unique_id_attribute, bind_dn, bind_password, group_base_dn]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60, example: Corp AD }
        addresses: { type: array, minItems: 1, maxItems: 3, items: { type: string, maxLength: 255 }, example: ['ldaps://dc1.corp.example:636'] }
        user_base_dn: { type: string, maxLength: 1024, example: 'ou=people,dc=corp,dc=example' }
        user_filter: { type: string, maxLength: 1024, example: '(uid={login})' }
        login_attribute: { type: string, example: uid }
        unique_id_attribute: { type: string, example: entryUUID }
        display_name_attribute: { type: string, example: cn }
        email_attribute: { type: string, example: mail }
        bind_dn: { type: string, maxLength: 1024, example: 'cn=alice-svc,ou=services,dc=corp,dc=example' }
        bind_password: { type: string, writeOnly: true, minLength: 1, maxLength: 1024, description: Request only; never returned or logged }
        group_base_dn: { type: string, maxLength: 1024, example: 'ou=groups,dc=corp,dc=example' }
        group_filter: { type: string, maxLength: 1024, description: 'Default (member={dn})' }
        group_name_attribute: { type: string, example: cn }
        ca_pem: { type: string, maxLength: 65536 }
        mfa_required: { type: boolean, default: true }
        enabled: { type: boolean, default: false }
    DirectoryPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        addresses: { type: array, minItems: 1, maxItems: 3, items: { type: string, maxLength: 255 } }
        user_base_dn: { type: string, maxLength: 1024 }
        user_filter: { type: string, maxLength: 1024 }
        login_attribute: { type: string }
        unique_id_attribute: { type: string }
        display_name_attribute: { type: string }
        email_attribute: { type: string }
        bind_dn: { type: string, maxLength: 1024 }
        bind_password: { type: string, writeOnly: true, minLength: 1, maxLength: 1024, description: Request only; replaces the stored password }
        group_base_dn: { type: string, maxLength: 1024 }
        group_filter: { type: string, maxLength: 1024 }
        group_name_attribute: { type: string }
        ca_pem: { type: string, maxLength: 65536 }
        mfa_required: { type: boolean }
        enabled: { type: boolean }
    DirectoryMapping:
      type: object
      required: [id, directory_id, group, role, created_at]
      properties:
        id: { type: string, format: uuid }
        directory_id: { type: string, format: uuid }
        group: { type: string }
        role: { type: string, enum: [admin, operator, auditor] }
        created_at: { type: string, format: date-time }
    DirectoryTestResult:
      type: object
      required: [login, display_name, email, unique_id, groups, role]
      properties:
        login: { type: string }
        display_name: { type: string }
        email: { type: string }
        unique_id: { type: string, description: Lower-case hex of the unique ID attribute's bytes }
        groups: { type: array, items: { type: string }, description: The group values exactly as the group search returned them }
        role: { type: [string, "null"], enum: [admin, operator, auditor, null] }
    Backup:
      type: object
      required: [name, kind, size, created_at, alice_version, check, code]
      properties:
        name: { type: string }
        kind: { type: string, examples: [auto, manual, pre-restore, pre-upgrade-1.0.0] }
        size: { type: integer }
        created_at: { type: string, format: date-time }
        alice_version: { type: string }
        check: { type: string, enum: [ok, missing checksum, checksum mismatch, unreadable header, unreadable] }
        code: { type: string, enum: ["", permission_denied, io], description: 'With check unreadable only' }
    BackupStatus:
      type: object
      required: [last_success_at, last_success_name, age_hours, failing, alarm, configured]
      properties:
        last_success_at: { type: [string, "null"], format: date-time }
        last_success_name: { type: string }
        age_hours: { type: [integer, "null"], description: Whole hours since the last successful backup }
        failing: { type: boolean, description: The latest backup attempt failed }
        alarm: { type: boolean, description: 'No successful backup for 48 hours (counted from the setup completion when there was none)' }
        configured: { type: boolean, description: The recovery passphrase is set }
    BackupState:
      allOf:
        - { $ref: "#/components/schemas/BackupStatus" }
        - type: object
          required: [free_bytes]
          properties:
            free_bytes: { type: integer, description: Free space of the backups directory }
    BackupSchedule:
      type: object
      required: [time, zone, retention, next_at, version]
      properties:
        time: { type: string, examples: ["02:30"] }
        zone: { type: string, examples: [UTC] }
        retention: { type: integer, minimum: 7, maximum: 60 }
        next_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
    HTTPSInfo:
      type: object
      required: [subject, dns_names, ip_addresses, not_before, not_after, fingerprint_sha256, temporary, warnings]
      properties:
        subject: { type: string }
        dns_names: { type: array, items: { type: string } }
        ip_addresses: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint_sha256: { type: string }
        temporary: { type: boolean, description: "Alice's own self-signed certificate (renewed by Alice)" }
        warnings: { type: array, items: { type: string, enum: [name_mismatch, chain_incomplete, expires_soon] } }
    Forwarding:
      type: object
      required: [enabled, host, port, transport, ca_set, backlog, cursor_seq, last_sent_at, last_error_code, last_error_at, version]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        transport: { type: string, enum: [tls, tcp, udp] }
        ca_set: { type: boolean }
        backlog: { type: integer, description: Audit entries not sent yet }
        cursor_seq: { type: integer }
        last_sent_at: { type: [string, "null"], format: date-time }
        last_error_code: { type: string, enum: ["", unreachable, untrusted, refused_address, write] }
        last_error_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
    ForwardingInput:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        transport: { type: string, enum: [tls, tcp, udp] }
        ca_pem: { type: string, maxLength: 65536, writeOnly: true, description: 'Absent keeps the stored bundle; "" removes it' }
