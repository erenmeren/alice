      parameters:
        - { name: service_id, in: query, description: "R49: rows owned by these services (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: environment_id, in: query, description: "R49: rows owned by services of these environments (repeatable)", schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: os_user, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: flag, in: query, required: false, schema: { type: string, enum: [weak, command, root_without_from, duplicate, cert_authority, security_key] } }
        - { name: missing, in: query, required: false, schema: { type: boolean } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of keys
