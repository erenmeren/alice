  /api/v1/bindings:
    post:
      operationId: createBinding
      summary: Connect a vault certificate to 1 to 200 websites (automatic deployment starts off)
      description: >-
        All or nothing; a refusal decided for one website carries params.location_id: 409 ALC-AKV-0018 (already connected),
        ALC-CRT-0010 (key type of the place), ALC-NGX-0007 (location unsupported); 409 ALC-AKV-0019 (the certificate already
        has a connection), 422 ALC-AKV-0013 (key not exportable), 409 ALC-AKV-0015 (certificate no longer in the vault), 409
