openapi: 3.1.0
info:
  title: Alice API
  version: 0.1.0
  description: Self-hosted SSH key and TLS certificate management. All timestamps are UTC RFC 3339.
servers:
  - url: /
paths:
  /livez:
    get:
      operationId: getLivez
      summary: Process liveness (no dependencies checked)
      x-permission: public
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        default: { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      operationId: getHealthz
      summary: Readiness (database reachable and migrations current)
      x-permission: public
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build information
      x-permission: read
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/i18n/locales:
    get:
      operationId: listLocales
      summary: Supported UI languages
      x-permission: public
      responses:
        "200":
          description: Supported locales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocaleList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first-run wizard is still needed
      x-permission: public
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/session:
    post:
      operationId: startSetupSession
      summary: Exchange the one-time setup code for a wizard session (sets the __Host-alice_setup cookie)
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 64, examples: [K7QX2M-9TPD4R-WB5H8N-3VZC6A] }
      responses:
        "200":
          description: Wizard session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSRFToken" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/language:
    put:
      operationId: setSetupLanguage
      summary: Choose the default language
      x-permission: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { type: string, enum: [en, tr] }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/admin/enrollment:
    post:
      operationId: startAdminEnrollment
      summary: Validate the administrator details and create a TOTP secret to scan
      x-permission: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name, email, password]
              properties:
                username: { type: string, maxLength: 64 }
                display_name: { type: string, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: TOTP secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/admin:
    post:
      operationId: createAdmin
      summary: Confirm the first TOTP code, create the administrator and sign in
      x-permission: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Administrator created; session cookie set, setup cookie cleared, recovery codes shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithCodes" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/recovery-passphrase:
    post:
      operationId: setRecoveryPassphrase
      summary: Choose the recovery passphrase and create the backup key pair
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [passphrase, passphrase_confirm]
              properties:
                passphrase: { type: string, minLength: 16, maxLength: 1024 }
                passphrase_confirm: { type: string, maxLength: 1024 }
      responses:
        "204": { description: Passphrase set }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/evaluation:
    post:
      operationId: chooseEvaluation
      summary: Complete the wizard's license step with the 30-day evaluation (it runs from the installation timestamp)
      x-permission: settings.manage
      responses:
        "200":
          description: Setup status after the choice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: Finish the wizard (needs the recovery passphrase and a license choice)
      x-permission: settings.manage
      responses:
        "200":
          description: Setup status after completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Check username and password; sets a pending session cookie for the MFA step
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password accepted; MFA is next
          content:
            application/json:
              schema:
                type: object
                required: [status, csrf_token]
                properties:
                  status: { type: string, enum: [mfa_required, mfa_enrollment_required] }
                  csrf_token: { type: string, description: Send as X-CSRF-Token on the MFA enroll/verify requests }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/enroll:
    post:
      operationId: enrollMFA
      summary: Create the TOTP secret for a user who has none yet
      x-permission: mfa_pending
      responses:
        "200":
          description: TOTP secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Complete sign-in with a TOTP code or a recovery code (new session cookie)
      x-permission: mfa_pending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
                recovery_code: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Signed in; recovery_codes present only after first enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithCodes" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: The signed-in user, the CSRF token and session limits
      x-permission: session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End this session
      x-permission: session
      responses:
        "204": { description: Signed out; cookie cleared }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/stepup:
    post:
      operationId: stepUp
      summary: Confirm a TOTP code to allow sensitive actions for 5 minutes (session ID is regenerated)
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Step-up active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the own password; ends every other session
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 1024 }
                new_password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password changed; new session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the own recovery codes (the old ones stop working)
      x-permission: session.stepup
      responses:
        "200":
          description: New recovery codes, shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/locale:
    put:
      operationId: setMyLocale
      summary: Save the own UI language
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale]
              properties:
                locale: { type: string, enum: [en, tr] }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: All users (administrators only)
      x-permission: users.read
      responses:
        "200":
          description: Users ordered by username
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a local user; they set up their authenticator app at first sign-in
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name, email, role, password]
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$" }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                role: { type: string, enum: [admin, operator, auditor] }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getUser
      summary: One user
      x-permission: users.read
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      summary: Change name, email, role or disabled state; role changes and disabling end the user's sessions
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                role: { type: string, enum: [admin, operator, auditor] }
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/reset-mfa:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: resetUserMFA
      summary: Remove the user's authenticator app and recovery codes; ends their sessions
      x-permission: users.manage
      responses:
        "204": { description: MFA reset }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/reset-password:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: resetUserPassword
      summary: Set a new password for the user; ends their sessions and clears a lockout
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "204": { description: Password reset }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/revoke-sessions:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: revokeUserSessions
      summary: Sign the user out everywhere
      x-permission: users.manage
      responses:
        "204": { description: Sessions ended }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: Own API tokens, or another user's with user_id (administrators only)
      x-permission: session
      parameters:
        - { name: user_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active (not revoked) tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createToken
      summary: Create an API token; the secret is returned once
      x-permission: session.stepup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope, expires_in_days]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                scope: { type: string, enum: [read, operate] }
                expires_in_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                required: [token, item]
                properties:
                  token: { type: string, description: "alice_ followed by 43 characters; store it now, it is never shown again" }
                  item: { $ref: "#/components/schemas/APIToken" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: revokeToken
      summary: Revoke a token (own, or any token for administrators)
      x-permission: session
      responses:
        "204": { description: Token revoked }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit log entries, newest first (administrators and auditors)
      x-permission: audit.read
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: "^[0-9]+$" }, description: next_cursor of the previous page }
        - { name: action, in: query, required: false, schema: { type: string }, description: Action prefix, e.g. auth. }
        - { name: actor, in: query, required: false, schema: { type: string }, description: Exact actor name }
        - { name: result, in: query, required: false, schema: { type: string, enum: [success, failure, denied] } }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit/export:
    get:
      operationId: exportAudit
      summary: Download the whole audit log with its verification result (read-only verification; the export itself is audited)
      x-permission: audit.read
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, json] } }
      responses:
        "200":
          description: The log. Header X-Alice-Audit-Intact tells whether the chain verified.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [verification, entries]
                properties:
                  verification: { $ref: "#/components/schemas/AuditReport" }
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit/verify:
    post:
      operationId: verifyAudit
      summary: Recompute the hash chain and record the result
      x-permission: audit.read
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditReport" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license/status:
    get:
      operationId: getLicenseStatus
      summary: Whether the license has expired, and the license banners the caller sees
      x-permission: read
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license:
    get:
      operationId: getLicense
      summary: Installation ID, license in force, uploaded files and history
      x-permission: license.read
      responses:
        "200":
          description: License details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseDetail" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: installLicense
      summary: Upload a license file; it takes effect at once
      x-permission: license.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseUpload" }
      responses:
        "200":
          description: The license was installed (or was already installed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseUploadResult" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license/preview:
    post:
      operationId: previewLicense
      summary: Check a license file and show what uploading it would do, without storing it
      x-permission: license.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseUpload" }
      responses:
        "200":
          description: The license could be installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseUploadResult" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/providers:
    get:
      operationId: listProviders
      summary: Compiled-in providers with their capabilities and configuration schema (add-server form)
      x-permission: read
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets:
    get:
      operationId: listTargets
      summary: Managed servers (metadata only, never credentials)
      x-permission: read
      responses:
        "200":
          description: Servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTarget
      summary: Add a server; counts against the license and starts a connection test that fetches its fingerprint
      description: >-
        A 409 answer is ALC-TGT-0001 (another server has this name, or this address and port) or
        ALC-LIC-0008 (the license's target limit is reached). Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetCreate" }
      responses:
        "201":
          description: The server was added; job_id is the connection test
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetCreated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getTarget
      summary: One server
      x-permission: read
      responses:
        "200":
          description: The server
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTarget
      summary: Rename a server or change its discovery interval (If-Match with the ETag is required)
      description: >-
        If-Match must be a single strong validator with the current version, for example "3". A missing or
        malformed If-Match, a weak validator (W/"3"), a list or * answers 412 ALC-SYS-0008, as does a version
        that is no longer current. 404 when the server does not exist; 409 ALC-TGT-0001 when the new name is
        taken. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPatch" }
      responses:
        "200":
          description: The changed server
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTarget
      summary: Remove a server from Alice (frees a license slot; nothing changes on the server)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/actions/test:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: testTarget
      summary: Test the SSH connection (runs as a job)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/actions/discover:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: discoverTarget
      summary: Scan the server's authorized_keys files and host keys (runs as a job)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listHostKeys
      summary: The server's pinned, observed and superseded host keys
      x-permission: read
      responses:
        "200":
          description: Host keys, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostKeyList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys/{key_id}/actions/confirm:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/KeyID" }
    post:
      operationId: confirmHostKey
      summary: Pin the fingerprint the server presented on first contact (TOFU with human confirmation)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: hostkeys.confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostKeyConfirm" }
      responses:
        "202":
          description: Pinned; job_id is the next connection test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys/{key_id}/actions/repin:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/KeyID" }
    post:
      operationId: repinHostKey
      summary: Accept a changed fingerprint (step-up and a reason required; the old one is kept as superseded)
      description: >-
        Re-pinning the key that is already pinned dismisses the change instead: the server is unblocked with
        its confirmed fingerprint and the audit log records hostkey.change_dismissed. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: hostkeys.repin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostKeyRepin" }
      responses:
        "202":
          description: Pinned; job_id is the next connection test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/ssh-keys:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listTargetKeys
      summary: The SSH keys found on one server, with their users and files
      x-permission: read
      parameters:
        - { name: missing, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Key locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyLocationList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys:
    get:
      operationId: listSSHKeys
      summary: SSH key inventory with filters
      x-permission: read
      parameters:
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: os_user, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: flag, in: query, required: false, schema: { type: string, enum: [weak, command, root_without_from, duplicate, cert_authority, security_key] } }
        - { name: missing, in: query, required: false, schema: { type: boolean } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKeyPage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/platform-key:
    get:
      operationId: getPlatformKey
      summary: Alice's public key, its authorized_keys line and the setup snippets per sudoers profile
      x-permission: targets.manage
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, description: IP address for the from= option } }
      responses:
        "200":
          description: Platform key and setup snippets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformKeyInfo" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getSSHKey
      summary: One SSH key and every place it is used
      x-permission: read
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKey" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/locations/{id}/actions/remove:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: removeKeyLocation
      summary: Remove this key from this file on the server (runs as a job; Alice's own key is refused)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyRemove" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: Background tasks, newest first
      x-permission: read
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [queued, running, succeeded, failed, cancelled, dead, blocked_license] } }
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getJob
      summary: One background task
      x-permission: read
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}/actions/confirm:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: confirmJob
      summary: Run a task that the license paused (R29)
      description: >-
        Refused while the license still refuses the task's class. The administrator is stored in confirmed_by
        and confirmed_at and recorded in the job.confirmed audit entry.
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: jobs.confirm
      responses:
        "200":
          description: The task, queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "202":
          description: The action was done, but the task could not be read back; poll status_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}/actions/discard:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: discardJob
      summary: Discard a task that waits for a confirmation or for its turn
      description: >-
        The task is cancelled. The administrator who discarded it is stored in the task's confirmed_by and
        confirmed_at columns (the same columns as a confirmation); the job.discarded audit entry is the record
        of who did it and when.
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: jobs.confirm
      responses:
        "200":
          description: The cancelled task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "202":
          description: The action was done, but the task could not be read back; poll status_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyID:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    StatusOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, const: ok }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    VersionInfo:
      type: object
      required: [version, commit, build_time]
      properties:
        version: { type: string }
        commit: { type: string }
        build_time: { type: string }
    Locale:
      type: object
      required: [code, name, direction]
      properties:
        code: { type: string, examples: [tr] }
        name: { type: string, examples: [Türkçe] }
        direction: { type: string, enum: [ltr, rtl] }
    LocaleList:
      type: object
      required: [default, locales]
      properties:
        default: { type: string }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, reason, message_key, message, request_id, retryable]
          properties:
            code: { type: string, pattern: "^ALC-[A-Z]{2,5}-[0-9]{4}$", examples: [ALC-SYS-0001] }
            reason: { type: string, examples: [system.not_found] }
            message_key: { type: string }
            message: { type: string }
            request_id: { type: string }
            retryable: { type: boolean }
            params:
              type: object
              additionalProperties: { type: string }
              description: Values for the placeholders of message_key, e.g. {"min":"12"}
            details:
              type: array
              description: Per-field problems for validation.failed
              items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, examples: [username] }
        code: { type: string, examples: [validation.pattern] }
        params:
          type: object
          additionalProperties: { type: string }
    CSRFToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string, description: Send as X-CSRF-Token on state-changing requests }
    SetupStatus:
      type: object
      required: [admin_exists, recovery_passphrase_set, license_chosen, completed, default_locale]
      properties:
        admin_exists: { type: boolean }
        recovery_passphrase_set: { type: boolean }
        license_chosen: { type: boolean, description: A license was uploaded or the evaluation was chosen }
        completed: { type: boolean }
        default_locale: { type: string, examples: [tr] }
    LicenseBanner:
      type: object
      required: [kind, severity, params]
      properties:
        kind:
          type: string
          enum: [evaluation, evaluation_ended, expiry_warning, grace, locked, tampered, clock_behind, clock_jump, pending, over_limit, limit_reached]
        severity: { type: string, enum: [info, warning, caution, danger] }
        params: { type: object, additionalProperties: { type: string } }
    LicenseStatus:
      type: object
      required: [expired, banners]
      properties:
        expired: { type: boolean, description: The license or the evaluation has ended (grace or lock) }
        phase:
          type: string
          enum: [evaluation, evaluation_expired, active, grace, locked]
          description: Only for Administrators and Auditors
        banners: { type: array, items: { $ref: "#/components/schemas/LicenseBanner" } }
    LicenseInfo:
      type: object
      required: [license_id, customer, issued_at, valid_from, valid_until, max_targets, features, replaces, key_id]
      properties:
        license_id: { type: string }
        customer: { type: string }
        issued_at: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        max_targets: { type: integer, minimum: 1, maximum: 100000 }
        features: { type: array, items: { type: string } }
        replaces: { type: string, description: License ID a correction license replaces; empty otherwise }
        key_id: { type: string }
    LicenseFile:
      type: object
      required: [status, uploaded_at, license]
      properties:
        status: { type: string, enum: [current, pending, superseded, invalid] }
        uploaded_at: { type: string, format: date-time }
        license:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
    LicenseHistoryEntry:
      type: object
      required: [at, event, license_id, from_state, to_state, notice]
      properties:
        at: { type: string, format: date-time }
        event: { type: string, enum: [installed, renewed, state_change, clock_anomaly, rejected, notice] }
        license_id: { type: string }
        from_state: { type: string }
        to_state: { type: string }
        notice: { type: [string, "null"] }
    LicenseDetail:
      type: object
      required: [installation_id, installed_at, phase, effective_time, current, pending, max_targets, targets_used,
        ends_at, locks_at, days_left, grace_day, tampered, files, history]
      properties:
        installation_id: { type: string, examples: [ALICE-7F3K-9Q2M-XD41-B8TC] }
        installed_at: { type: string, format: date-time }
        phase: { type: string, enum: [evaluation, evaluation_expired, active, grace, locked] }
        effective_time: { type: string, format: date-time, description: The trusted time license states are computed from }
        current:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
        pending:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
        max_targets: { type: integer }
        targets_used: { type: integer }
        ends_at: { type: string, format: date-time }
        locks_at: { type: string, format: date-time }
        days_left: { type: integer }
        grace_day: { type: integer }
        tampered: { type: boolean }
        files: { type: array, items: { $ref: "#/components/schemas/LicenseFile" } }
        history: { type: array, items: { $ref: "#/components/schemas/LicenseHistoryEntry" } }
    LicenseUpload:
      type: object
      additionalProperties: false
      required: [license]
      properties:
        license:
          type: string
          maxLength: 65536
          description: The license file content (UTF-8 JSON text). The whole request body is limited to 64 KiB (65536 bytes); a larger body is refused with ALC-SYS-0007 (413).
    LicenseUploadResult:
      type: object
      required: [license, pending, already_expired, correction, duplicate, phase]
      properties:
        license: { $ref: "#/components/schemas/LicenseInfo" }
        pending: { type: boolean, description: valid_from is still ahead; the previous license continues until then }
        already_expired: { type: boolean }
        correction: { type: boolean }
        duplicate: { type: boolean, description: This license was already installed; nothing changed }
        phase: { type: string, enum: [evaluation, evaluation_expired, active, grace, locked] }
    MFAEnrollment:
      type: object
      required: [secret, otpauth_uri, qr_png]
      properties:
        secret: { type: string, description: Base32 TOTP secret }
        otpauth_uri: { type: string }
        qr_png: { type: string, contentEncoding: base64, description: PNG image of otpauth_uri }
    User:
      type: object
      required: [id, username, display_name, email, role, locale, disabled, mfa_enrolled, last_login_at, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, operator, auditor] }
        locale: { type: string }
        disabled: { type: boolean }
        mfa_enrolled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [user, csrf_token, expires_at, idle_expires_at, stepup_until]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        stepup_until: { type: [string, "null"], format: date-time }
    SessionWithCodes:
      description: SessionInfo plus the one-time recovery codes (only from administrator creation and MFA verification)
      allOf:
        - { $ref: "#/components/schemas/SessionInfo" }
        - type: object
          properties:
            recovery_codes:
              type: array
              items: { type: string }
              description: Present only right after MFA enrollment or administrator creation
    APIToken:
      type: object
      required: [id, user_id, name, prefix, scope, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, examples: [alice_Xy12Ab] }
        scope: { type: string, enum: [read, operate] }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [seq, at, actor_type, actor_id, actor_name, ip, action, object_type, object_id, result, details, request_id, hash]
      properties:
        seq: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, api_token, system, oidc] }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: string }
        ip: { type: [string, "null"] }
        action: { type: string, examples: [auth.login] }
        object_type: { type: string }
        object_id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        details: { type: object, additionalProperties: { type: string } }
        request_id: { type: string }
        hash: { type: string, description: Hex SHA-256 of this entry in the chain }
    AuditReport:
      type: object
      required: [intact, checked, head_seq, head_hash, first_bad_seq, problem]
      properties:
        intact: { type: boolean }
        checked: { type: integer }
        head_seq: { type: integer }
        head_hash: { type: string }
        first_bad_seq: { type: [integer, "null"] }
        problem: { type: [string, "null"], enum: [hash_mismatch, sequence_gap, tail_truncated, null] }
    ErrorRef:
      type: [object, "null"]
      required: [code, reason]
      properties:
        code: { type: string, examples: [ALC-SSH-0002] }
        reason: { type: string, examples: [ssh.auth_failed] }
        params: { type: object, additionalProperties: { type: string } }
    Accepted:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: { type: string, format: uuid }
        status_url: { type: string, examples: [/api/v1/jobs/0192b000-0000-7000-8000-0000000000b1] }
    TargetCreate:
      type: object
      required: [name, host]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [linux], default: linux }
        host: { type: string, maxLength: 253, description: Host name or IP address; no scheme and no port }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 or absent means 22 }
        username: { type: string, maxLength: 32, description: Absent means alice-svc }
    TargetPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        discovery_interval_hours: { type: integer, minimum: 1, maximum: 720 }
    TargetFacts:
      type: object
      required: [os, helper_version, helper_protocol, sshd, host_keys, warnings, unreadable]
      properties:
        os:
          type: object
          required: [id, version_id, pretty_name]
          properties:
            id: { type: string }
            version_id: { type: string }
            pretty_name: { type: string }
        helper_version: { type: string }
        helper_protocol: { type: integer }
        sshd:
          type: [object, "null"]
          properties:
            read: { type: boolean }
            pubkey_authentication: { type: string }
            password_authentication: { type: string }
            permit_root_login: { type: string }
            authorized_keys_file: { type: array, items: { type: string } }
            authorized_keys_command: { type: string }
            keys_managed_elsewhere: { type: boolean }
            certificates_in_use: { type: boolean }
        host_keys:
          type: array
          items:
            type: object
            required: [key_type, bits, fingerprint, weak]
            properties:
              key_type: { type: string }
              bits: { type: integer }
              fingerprint: { type: string }
              weak: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [code, params]
            properties:
              code: { type: string, examples: [keys_managed_elsewhere] }
              params: { type: object, additionalProperties: { type: string } }
        unreadable:
          type: array
          items:
            type: object
            required: [os_user, file_path, line_no]
            properties:
              os_user: { type: string }
              file_path: { type: string }
              line_no: { type: integer }
    Target:
      type: object
      required: [id, name, type, host, port, username, status, last_error, last_success_at, last_discovery_at,
        discovery_interval_hours, keys_managed_elsewhere, capabilities, facts, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [nginx, linux, azure_key_vault] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        status: { type: string, enum: [pending_host_key, checking, ok, unreachable, host_key_changed, auth_failed, disabled] }
        last_error: { $ref: "#/components/schemas/ErrorRef" }
        last_success_at: { type: [string, "null"], format: date-time }
        last_discovery_at: { type: [string, "null"], format: date-time }
        discovery_interval_hours: { type: integer }
        keys_managed_elsewhere: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        facts: { $ref: "#/components/schemas/TargetFacts" }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TargetList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        next_cursor: { type: "null" }
    TargetCreated:
      type: object
      required: [target, job_id, status_url]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        job_id: { type: string, format: uuid }
        status_url: { type: string }
    HostKey:
      type: object
      required: [id, key_type, fingerprint, status, observed_at, confirmed_at, confirmed_by_name, superseded_at, verify_command]
      properties:
        id: { type: string, format: uuid }
        key_type: { type: string, examples: [ssh-ed25519] }
        fingerprint: { type: string, examples: ["SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8"] }
        status: { type: string, enum: [observed, pinned, superseded, rejected] }
        observed_at: { type: string, format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
        confirmed_by_name: { type: string }
        superseded_at: { type: [string, "null"], format: date-time }
        verify_command: { type: string, examples: [ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub] }
    HostKeyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HostKey" } }
    HostKeyConfirm:
      type: object
      required: [fingerprint]
      additionalProperties: false
      properties:
        fingerprint: { type: string }
    HostKeyRepin:
      type: object
      required: [fingerprint, reason]
      additionalProperties: false
      properties:
        fingerprint: { type: string }
        reason: { type: string, minLength: 10, maxLength: 500 }
    KeyLocation:
      type: object
      required: [id, ssh_key_id, fingerprint, key_type, target_id, target_name, os_user, file_path, line_no, options,
        comment, flags, first_seen_at, last_seen_at, missing_since, removed_at, is_alice_connection_key]
      properties:
        id: { type: string, format: uuid }
        ssh_key_id: { type: string, format: uuid }
        fingerprint: { type: string }
        key_type: { type: string }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        os_user: { type: string }
        file_path: { type: string }
        line_no: { type: integer }
        options: { type: string }
        comment: { type: string }
        flags: { type: array, items: { type: string } }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        is_alice_connection_key: { type: boolean }
    KeyLocationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KeyLocation" } }
    SSHKey:
      type: object
      required: [id, fingerprint, key_type, bits, public_key, managed, is_platform_key, weak, comment, location_count,
        target_count, missing, first_seen_at]
      properties:
        id: { type: string, format: uuid }
        fingerprint: { type: string }
        key_type: { type: string }
        bits: { type: integer }
        public_key: { type: string, description: Public key only (type and base64); never private material }
        managed: { type: boolean }
        is_platform_key: { type: boolean }
        weak: { type: boolean }
        comment: { type: string }
        location_count: { type: integer }
        target_count: { type: integer }
        missing: { type: boolean, description: Every location of the key is missing or removed }
        first_seen_at: { type: string, format: date-time }
        locations: { type: array, items: { $ref: "#/components/schemas/KeyLocation" }, description: "Only on GET /ssh-keys/{id}" }
    SSHKeyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSHKey" } }
        next_cursor: { type: [string, "null"] }
    KeyRemove:
      type: object
      additionalProperties: false
      properties:
        confirm_last_root_key: { type: boolean, default: false }
    SetupSnippet:
      type: object
      required: [sudoers, script]
      properties:
        sudoers: { type: string }
        script: { type: string }
    PlatformKeyInfo:
      type: object
      required: [public_key, fingerprint, authorized_keys_line, helper_path, helper_protocol, profiles]
      properties:
        public_key: { type: string }
        fingerprint: { type: string }
        authorized_keys_line: { type: string }
        helper_path: { type: string }
        helper_protocol: { type: integer }
        profiles:
          type: object
          required: [linux, nginx]
          properties:
            linux: { $ref: "#/components/schemas/SetupSnippet" }
            nginx: { $ref: "#/components/schemas/SetupSnippet" }
    Job:
      type: object
      required: [id, type, kind, status, target_id, attempts, max_attempts, error, result, created_at, run_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, examples: [target.test_connection] }
        kind: { type: string, enum: [scheduled, user, system] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, dead, blocked_license] }
        target_id: { type: [string, "null"], format: uuid }
        attempts: { type: integer }
        max_attempts: { type: integer }
        error: { $ref: "#/components/schemas/ErrorRef" }
        result: { type: object }
        created_at: { type: string, format: date-time }
        run_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: [string, "null"] }
    Provider:
      type: object
      required: [kind, display_name_key, capabilities, config_schema]
      properties:
        kind: { type: string, enum: [linuxssh, nginx, azurekv] }
        display_name_key: { type: string }
        capabilities: { type: array, items: { type: string } }
        config_schema:
          type: object
          required: [fields]
          properties:
            fields:
              type: array
              items:
                type: object
                required: [name, type, required, default, label_key, help_key, pattern, min, max, values]
                properties:
                  name: { type: string }
                  type: { type: string, enum: [string, int, bool, enum, path, host] }
                  required: { type: boolean }
                  default: {}
                  label_key: { type: string }
                  help_key: { type: string }
                  pattern: { type: string }
                  min: { type: integer }
                  max: { type: integer }
                  values: { type: array, items: { type: string } }
    ProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Provider" } }
