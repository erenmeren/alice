          application/json:
            schema: { $ref: "#/components/schemas/KeyRemove" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/generate:
    post:
      operationId: generateSSHKey
      summary: Generate an SSH key whose private key Alice keeps sealed (Ed25519 by default)
      description: >-
        The answer is the key as GET /ssh-keys/{id} shows it, with managed_key; it never carries the private key. At
        most two keys are generated at once (503 ALC-KEY-0011 with Retry-After). Refused with 403 ALC-LIC-0001 while
        the license is locked.
      x-permission: inventory.operate
      x-scope: create
      requestBody:
        required: true
