openapi: 3.1.0
info:
  title: Alice API
  version: 0.1.0
  description: "Self-hosted SSH key and TLS certificate management. All timestamps are UTC RFC 3339. A signed-in session's 30-minute idle timeout is extended only by state-changing requests that pass the origin and CSRF checks and by same-origin reads that carry the header X-Alice-Activity: 1 (the web UI sends it after a person's input); other reads leave it unchanged. API tokens have no idle timeout. Every route refused with 403 ALC-LIC-0001 while the license is locked is also refused with 503 ALC-LIC-0009 (license.unverified, retryable) while no license check has succeeded for 3 hours; it works again after the next successful check."
servers:
  - url: /
paths:
  /livez:
    get:
      operationId: getLivez
      summary: Process liveness (no dependencies checked)
      x-permission: public
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        default: { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      operationId: getHealthz
      summary: Readiness (database reachable and migrations current)
      x-permission: public
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build information
      x-permission: read
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/i18n/locales:
    get:
      operationId: listLocales
      summary: Supported UI languages
      x-permission: public
      responses:
        "200":
          description: Supported locales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocaleList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first-run wizard is still needed
      x-permission: public
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/session:
    post:
      operationId: startSetupSession
      summary: Exchange the one-time setup code for a wizard session (sets the __Host-alice_setup cookie)
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 64, examples: [K7QX2M-9TPD4R-WB5H8N-3VZC6A] }
      responses:
        "200":
          description: Wizard session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSRFToken" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/language:
    put:
      operationId: setSetupLanguage
      summary: Choose the default language
      x-permission: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { type: string, enum: [en, tr] }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/admin/enrollment:
    post:
      operationId: startAdminEnrollment
      summary: Validate the administrator details and create a TOTP secret to scan
      x-permission: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name, email, password]
              properties:
                username: { type: string, maxLength: 64 }
                display_name: { type: string, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: TOTP secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/admin:
    post:
      operationId: createAdmin
      summary: Confirm the first TOTP code, create the administrator and sign in
      x-permission: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Administrator created; session cookie set, setup cookie cleared, recovery codes shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithCodes" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/recovery-passphrase:
    post:
      operationId: setRecoveryPassphrase
      summary: Choose the recovery passphrase and create the backup key pair
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [passphrase, passphrase_confirm]
              properties:
                passphrase: { type: string, minLength: 16, maxLength: 1024 }
                passphrase_confirm: { type: string, maxLength: 1024 }
      responses:
        "204": { description: Passphrase set }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/evaluation:
    post:
      operationId: chooseEvaluation
      summary: Complete the wizard's license step with the 30-day evaluation (it runs from the installation timestamp)
      x-permission: settings.manage
      responses:
        "200":
          description: Setup status after the choice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: Finish the wizard (needs the recovery passphrase and a license choice)
      x-permission: settings.manage
      responses:
        "200":
          description: Setup status after completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Check username and password; sets a pending session cookie for the MFA step
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password accepted; MFA is next
          content:
            application/json:
              schema:
                type: object
                required: [status, csrf_token]
                properties:
                  status: { type: string, enum: [mfa_required, mfa_enrollment_required] }
                  csrf_token: { type: string, description: Send as X-CSRF-Token on the MFA enroll/verify requests }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/enroll:
    post:
      operationId: enrollMFA
      summary: Create the TOTP secret for a user who has none yet
      x-permission: mfa_pending
      responses:
        "200":
          description: TOTP secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Complete sign-in with a TOTP code or a recovery code (new session cookie)
      x-permission: mfa_pending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
                recovery_code: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Signed in; recovery_codes present only after first enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithCodes" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: The signed-in user, the CSRF token and session limits
      x-permission: session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End this session
      x-permission: session
      responses:
        "204": { description: Signed out; cookie cleared }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/stepup:
    post:
      operationId: stepUp
      summary: Confirm a TOTP code to allow sensitive actions for 5 minutes (session ID is regenerated)
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Step-up active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the own password; ends every other session
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 1024 }
                new_password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password changed; new session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the own recovery codes (the old ones stop working)
      x-permission: session.stepup
      responses:
        "200":
          description: New recovery codes, shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/locale:
    put:
      operationId: setMyLocale
      summary: Save the own UI language
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale]
              properties:
                locale: { type: string, enum: [en, tr] }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: All users (administrators only)
      x-permission: users.read
      responses:
        "200":
          description: Users ordered by username
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a local user; they set up their authenticator app at first sign-in
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name, email, role, password]
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$" }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                role: { type: string, enum: [admin, operator, auditor] }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getUser
      summary: One user
      x-permission: users.read
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      summary: Change name, email, role or disabled state; role changes and disabling end the user's sessions
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                role: { type: string, enum: [admin, operator, auditor] }
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/reset-mfa:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: resetUserMFA
      summary: Remove the user's authenticator app and recovery codes; ends their sessions
      x-permission: users.manage
      responses:
        "204": { description: MFA reset }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/reset-password:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: resetUserPassword
      summary: Set a new password for the user; ends their sessions, revokes their API tokens and clears a lockout
      description: >-
        In one transaction: sets the password, clears the sign-in delay or lockout, ends every session of the
        user and revokes every API token of the user (each audited as token.revoked by its ID; the
        user.password_reset row carries revoked_tokens_count). The tokens are refused from the next request on.
        A user changing their own password (POST /api/v1/auth/password) keeps their tokens.
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "204": { description: Password reset }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/actions/revoke-sessions:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: revokeUserSessions
      summary: Sign the user out everywhere; ends their sessions and revokes their API tokens
      description: >-
        In one transaction: ends every session of the user and revokes every API token of the user (each
        audited as token.revoked by its ID; the user.sessions_revoked row carries revoked_tokens_count). The
        tokens are refused from the next request on. Also applies when administrators use it on themselves.
      x-permission: users.manage
      responses:
        "204": { description: Sessions ended and API tokens revoked }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: Own API tokens, or another user's with user_id (administrators only)
      x-permission: session
      parameters:
        - { name: user_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active (not revoked) tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createToken
      summary: Create an API token; the secret is returned once
      x-permission: session.stepup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope, expires_in_days]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                scope: { type: string, enum: [read, operate] }
                expires_in_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                required: [token, item]
                properties:
                  token: { type: string, description: "alice_ followed by 43 characters; store it now, it is never shown again" }
                  item: { $ref: "#/components/schemas/APIToken" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      operationId: revokeToken
      summary: Revoke a token (own, or any token for administrators)
      x-permission: session
      responses:
        "204": { description: Token revoked }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit log entries, newest first (administrators and auditors)
      x-permission: audit.read
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: "^[0-9]+$" }, description: next_cursor of the previous page }
        - { name: action, in: query, required: false, schema: { type: string }, description: Action prefix, e.g. auth. }
        - { name: actor, in: query, required: false, schema: { type: string }, description: Exact actor name }
        - { name: result, in: query, required: false, schema: { type: string, enum: [success, failure, denied] } }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit/export:
    get:
      operationId: exportAudit
      summary: Download the whole audit log with its verification result (read-only verification; the export itself is audited)
      x-permission: audit.read
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, json] } }
      responses:
        "200":
          description: The log. Header X-Alice-Audit-Intact tells whether the chain verified.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [verification, entries]
                properties:
                  verification: { $ref: "#/components/schemas/AuditReport" }
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/audit/verify:
    post:
      operationId: verifyAudit
      summary: Recompute the hash chain and record the result
      x-permission: audit.read
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditReport" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license/status:
    get:
      operationId: getLicenseStatus
      summary: Whether the license has expired, and the license banners the caller sees
      x-permission: read
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license:
    get:
      operationId: getLicense
      summary: Installation ID, license in force, uploaded files and history
      x-permission: license.read
      responses:
        "200":
          description: License details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseDetail" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: installLicense
      summary: Upload a license file; it takes effect at once
      x-permission: license.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseUpload" }
      responses:
        "200":
          description: The license was installed (or was already installed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseUploadResult" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/license/preview:
    post:
      operationId: previewLicense
      summary: Check a license file and show what uploading it would do, without storing it
      x-permission: license.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseUpload" }
      responses:
        "200":
          description: The license could be installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseUploadResult" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/providers:
    get:
      operationId: listProviders
      summary: Compiled-in providers with their capabilities and configuration schema (add-server form)
      x-permission: read
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets:
    get:
      operationId: listTargets
      summary: Managed servers (metadata only, never credentials)
      x-permission: read
      responses:
        "200":
          description: Servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTarget
      summary: Add a server; counts against the license and starts a connection test that fetches its fingerprint
      description: >-
        A 409 answer is ALC-TGT-0001 (another server has this name, or this address and port) or
        ALC-LIC-0008 (the license's target limit is reached). Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetCreate" }
      responses:
        "201":
          description: The server was added; job_id is the connection test
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetCreated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getTarget
      summary: One server
      x-permission: read
      responses:
        "200":
          description: The server
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTarget
      summary: Rename a server or change its discovery interval (If-Match with the ETag is required)
      description: >-
        If-Match must be a single strong validator with the current version, for example "3". A missing or
        malformed If-Match, a weak validator (W/"3"), a list or * answers 412 ALC-SYS-0008, as does a version
        that is no longer current. 404 when the server does not exist; 409 ALC-TGT-0001 when the new name is
        taken. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPatch" }
      responses:
        "200":
          description: The changed server
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTarget
      summary: Remove a server from Alice (frees a license slot; nothing changes on the server)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: targets.manage
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/actions/test:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: testTarget
      summary: Test the SSH connection (runs as a job)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/actions/discover:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: discoverTarget
      summary: Scan the server's authorized_keys files and host keys (runs as a job)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listHostKeys
      summary: The server's pinned, observed and superseded host keys
      x-permission: read
      responses:
        "200":
          description: Host keys, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostKeyList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys/{key_id}/actions/confirm:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/KeyID" }
    post:
      operationId: confirmHostKey
      summary: Pin the fingerprint the server presented on first contact (TOFU with human confirmation)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: hostkeys.confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostKeyConfirm" }
      responses:
        "202":
          description: Pinned; job_id is the next connection test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/host-keys/{key_id}/actions/repin:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/KeyID" }
    post:
      operationId: repinHostKey
      summary: Accept a changed fingerprint (step-up and a reason required; the old one is kept as superseded)
      description: >-
        Re-pinning the key that is already pinned dismisses the change instead: the server is unblocked with
        its confirmed fingerprint and the audit log records hostkey.change_dismissed. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: hostkeys.repin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostKeyRepin" }
      responses:
        "202":
          description: Pinned; job_id is the next connection test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/ssh-keys:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listTargetKeys
      summary: The SSH keys found on one server, with their users and files
      x-permission: read
      parameters:
        - { name: missing, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Key locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyLocationList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/targets/{id}/certificate-locations:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listTargetCertificateLocations
      summary: The certificate files an Nginx server's websites use (in use first; missing ones with ?missing=true)
      description: >-
        At most 1000 locations; truncated is true when some (missing ones) were left out. 404 when the server does
        not exist or was deleted. A Linux server has none.
      x-permission: read
      parameters:
        - { name: missing, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Certificate locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateLocationList" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys:
    get:
      operationId: listSSHKeys
      summary: SSH key inventory with filters
      x-permission: read
      parameters:
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: os_user, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: flag, in: query, required: false, schema: { type: string, enum: [weak, command, root_without_from, duplicate, cert_authority, security_key] } }
        - { name: missing, in: query, required: false, schema: { type: boolean } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKeyPage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/platform-key:
    get:
      operationId: getPlatformKey
      summary: Alice's public key, its authorized_keys line and the setup snippets per sudoers profile
      x-permission: targets.manage
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, description: IP address for the from= option } }
      responses:
        "200":
          description: Platform key and setup snippets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformKeyInfo" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getSSHKey
      summary: One SSH key and every place it is used
      x-permission: read
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKey" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ssh-keys/locations/{id}/actions/remove:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: removeKeyLocation
      summary: Remove this key from this file on the server (runs as a job; Alice's own key is refused)
      description: >-
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: inventory.operate
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyRemove" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: Background tasks, newest first
      x-permission: read
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [queued, running, succeeded, failed, cancelled, dead, blocked_license] } }
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getJob
      summary: One background task
      x-permission: read
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}/actions/confirm:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: confirmJob
      summary: Run a task that the license paused (R29)
      description: >-
        Refused while the license still refuses the task's class. The administrator is stored in confirmed_by
        and confirmed_at and recorded in the job.confirmed audit entry.
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: jobs.confirm
      responses:
        "200":
          description: The task, queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "202":
          description: The action was done, but the task could not be read back; poll status_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}/actions/discard:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: discardJob
      summary: Discard a task that waits for a confirmation or for its turn
      description: >-
        The task is cancelled. The administrator who discarded it is stored in the task's confirmed_by and
        confirmed_at columns (the same columns as a confirmation); the job.discarded audit entry is the record
        of who did it and when.
        Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: jobs.confirm
      responses:
        "200":
          description: The cancelled task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "202":
          description: The action was done, but the task could not be read back; poll status_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates:
    get:
      operationId: listCertificates
      summary: Certificate inventory, soonest expiry first (no chain, no locations; see GET /certificates/{id})
      x-permission: read
      parameters:
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid }, description: 'Certificates in use on this server' }
        - { name: source, in: query, required: false, schema: { type: string, enum: [discovered, uploaded, csr] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 }, description: 'Part of the subject CN, a SAN, the label or the fingerprint' }
        - { name: expiry, in: query, required: false, schema: { type: string, enum: [expired, "30", "60"] }, description: 'Expired, or expiring within 30 or 60 days (expired ones included)' }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of certificates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificatePage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/upload:
    post:
      operationId: uploadCertificate
      summary: Store a certificate with its private key (PEM fields, or a PFX file in base64 with its password)
      description: >-
        Send certificate_pem (leaf first, then the chain) with private_key_pem, or pfx_base64 with pfx_password,
        never both. Keys are matched exactly (lower case) and each may appear once; anything else is 400. The key is stored sealed and is never returned by any operation; the answer carries the stored
        certificate (public data) and the warnings that did not block it. The body is limited to 768 KiB (413
        ALC-SYS-0007; each field at most 256 KiB). Refusals: 422 ALC-CRT-0001..0007 (unreadable, key mismatch,
        expired, encrypted key, wrong PFX password, weak, unsupported key), 422 validation.failed (field errors,
        for example validation.key_in_certificate when a private key is pasted into certificate_pem), 409
        ALC-CRT-0008 when Alice already holds this certificate with its key (except: when the chain Alice holds is
        incomplete and this upload's chain is complete, the chain is completed and the answer is 200 with the
        warning chain_completed and no Location), 503 ALC-CRT-0015 (retryable) when
        too many PFX files are being read. If the certificate was stored but could not be read back the request
        fails; sending it again is then refused with ALC-CRT-0008 and the certificate is in the list. Refused with
        403 ALC-LIC-0001 while the license is locked, before the body is read.
      x-permission: certificates.operate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateUpload" }
      responses:
        "201":
          description: Stored; Location names the certificate
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateStored" }
        "200":
          description: The certificate was already held with its key; this upload completed its chain (warning chain_completed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateStored" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/csr:
    get:
      operationId: listCSRs
      summary: Signing requests (every pending one, newest first, then the 50 most recently finished)
      x-permission: read
      responses:
        "200":
          description: Signing requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSRList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCSR
      summary: Generate a private key in Alice and a signing request for it
      description: >-
        The key never leaves Alice. Keys are matched exactly (lower case) and each may appear once; anything else is
        400. The body is limited to 32 KiB (413 ALC-SYS-0007). 422 validation.failed for a common name or SAN that is not a DNS name (at most
        64 characters for the common name, at most 50 SANs) or an unknown key type. 503 ALC-CRT-0016 (retryable,
        Retry-After) when Alice already generates two signing-request keys; 409 ALC-CRT-0017 when 1000 signing
        requests are open. Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: certificates.operate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CSRCreate" }
      responses:
        "201":
          description: The signing request; Location names it
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSR" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/csr/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getCSR
      summary: One signing request
      x-permission: read
      responses:
        "200":
          description: The signing request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSR" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/csr/{id}/actions/complete:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: completeCSR
      summary: Store the certificate a certificate authority issued for a pending signing request
      description: >-
        The certificate gets the request's key. 409 ALC-CRT-0012 when the request is no longer pending, 422
        ALC-CRT-0013 when the certificate is not for this request's key, the upload refusals otherwise (422
        validation.key_in_certificate when a private key is pasted into certificate_pem). A certificate whose names
        differ from the request is stored with the warning csr_name_mismatch. Keys are matched exactly (lower case)
        and each may appear once; anything else is 400. The body is limited to 384 KiB (413 ALC-SYS-0007). Refused with 403 ALC-LIC-0001 while the license is locked.
      x-permission: certificates.operate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CSRComplete" }
      responses:
        "201":
          description: Stored; Location names the certificate
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateStored" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/csr/{id}/actions/cancel:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: cancelCSR
      summary: Close a pending signing request without a certificate
      description: >-
        No body (or {}; at most 4 KiB; anything else is 400). 409 ALC-CRT-0012 when the request is no longer pending. Refused with 403 ALC-LIC-0001 while
        the license is locked.
      x-permission: certificates.operate
      responses:
        "200":
          description: The cancelled signing request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSR" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getCertificate
      summary: One certificate with its chain and the locations that use it
      x-permission: read
      responses:
        "200":
          description: The certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateDetail" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/certificates/{id}/deploy:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: deployCertificate
      summary: Deploy a certificate to 1 to 20 websites (one deployment and one job per location)
      description: >-
        Keys are matched exactly (lower case) and each may appear once; anything else is 400. A location id that
        is not a UUID is 422 validation.pattern, one listed twice 422 validation.duplicate. The body is limited to
        8 KiB (413 ALC-SYS-0007). All or nothing: either every location is queued (202, one item per location in request order) or none is,
        and the error names the refusal; a refusal decided for one location carries params.location_id. Refusals:
        404 (the certificate or a location does not exist), 409 ALC-CRT-0009 (no private key), 422 ALC-CRT-0003
        (expired), 409 ALC-CRT-0014 (not valid yet), 422 ALC-CRT-0007 (key type), 409 ALC-CRT-0011 (an incomplete
        chain needs an Administrator's confirm_incomplete_chain; an Operator's confirmation does not count), 409
        ALC-NGX-0007 (location unsupported or missing), 409 ALC-DEP-0011 (server not ready), 409 ALC-NGX-0002
        (Nginx configuration invalid), 409 ALC-DEP-0021 (the location must be discovered again), 409 ALC-CRT-0010
        (key type of the place, params expected and actual), 409 ALC-DEP-0002 (a deployment on the server is being
        recovered; retryable), 409 ALC-DEP-0001 (a deployment to this location is in progress; retryable: a
        repeated request while one runs answers this, never a second deployment). A san_mismatch warning does not
        block. There is no retry or rollback operation: request again to deploy again. Refused with 403
        ALC-LIC-0001 while the license is locked, before the body is read.
      x-permission: certificates.operate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployRequest" }
      responses:
        "202":
          description: Queued; follow each job (status_url) or deployment (deployment_url)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/locations/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      operationId: updateLocation
      summary: Change a website's verification settings (If-Match with the location's version is required)
      description: >-
        If-Match must be a single strong validator with the location's current version (its version field), for
        example "3"; a missing or malformed If-Match, a weak validator, a list or * answers 412 ALC-SYS-0008, as does
        a version that is no longer current. At least one field; verify_port 0 and verify_sni "" clear the value.
        Keys are matched exactly (lower case) and each may appear once; anything else, or a value of the wrong
        type, is 400. The body is limited to 4 KiB (413 ALC-SYS-0007). Refused with 403 ALC-LIC-0001 while the
        license is locked.
      x-permission: targets.manage
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, examples: ['"3"'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationPatch" }
      responses:
        "200":
          description: The changed location
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateLocation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/deployments:
    get:
      operationId: listDeployments
      summary: Deployment history, newest first
      x-permission: read
      parameters:
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: certificate_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: location_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of deployments (without steps)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPage" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/deployments/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getDeployment
      summary: One deployment with its steps
      x-permission: read
      responses:
        "200":
          description: The deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDetail" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyID:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    StatusOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, const: ok }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    VersionInfo:
      type: object
      required: [version, commit, build_time]
      properties:
        version: { type: string }
        commit: { type: string }
        build_time: { type: string }
    Locale:
      type: object
      required: [code, name, direction]
      properties:
        code: { type: string, examples: [tr] }
        name: { type: string, examples: [Türkçe] }
        direction: { type: string, enum: [ltr, rtl] }
    LocaleList:
      type: object
      required: [default, locales]
      properties:
        default: { type: string }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, reason, message_key, message, request_id, retryable]
          properties:
            code: { type: string, pattern: "^ALC-[A-Z]{2,5}-[0-9]{4}$", examples: [ALC-SYS-0001] }
            reason: { type: string, examples: [system.not_found] }
            message_key: { type: string }
            message: { type: string }
            request_id: { type: string }
            retryable: { type: boolean }
            params:
              type: object
              additionalProperties: { type: string }
              description: Values for the placeholders of message_key, e.g. {"min":"12"}
            details:
              type: array
              description: Per-field problems for validation.failed
              items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, examples: [username] }
        code: { type: string, examples: [validation.pattern] }
        params:
          type: object
          additionalProperties: { type: string }
    CSRFToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string, description: Send as X-CSRF-Token on state-changing requests }
    SetupStatus:
      type: object
      required: [admin_exists, recovery_passphrase_set, license_chosen, completed, default_locale]
      properties:
        admin_exists: { type: boolean }
        recovery_passphrase_set: { type: boolean }
        license_chosen: { type: boolean, description: A license was uploaded or the evaluation was chosen }
        completed: { type: boolean }
        default_locale: { type: string, examples: [tr] }
    LicenseBanner:
      type: object
      required: [kind, severity, params]
      properties:
        kind:
          type: string
          enum: [evaluation, evaluation_ended, expiry_warning, grace, locked, unverified, tampered, clock_behind, clock_jump, pending, over_limit, limit_reached]
          description: unverified (everyone, danger, param last_checked) is shown while no license check has succeeded for 3 hours; changes are refused with ALC-LIC-0009 until one does
        severity: { type: string, enum: [info, warning, caution, danger] }
        params: { type: object, additionalProperties: { type: string } }
    LicenseStatus:
      type: object
      required: [expired, banners]
      properties:
        expired: { type: boolean, description: The license or the evaluation has ended (grace or lock) }
        phase:
          type: string
          enum: [evaluation, evaluation_expired, active, grace, locked]
          description: Only for Administrators and Auditors
        banners: { type: array, items: { $ref: "#/components/schemas/LicenseBanner" } }
    LicenseInfo:
      type: object
      required: [license_id, customer, issued_at, valid_from, valid_until, max_targets, features, replaces, key_id]
      properties:
        license_id: { type: string }
        customer: { type: string }
        issued_at: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        max_targets: { type: integer, minimum: 1, maximum: 100000 }
        features: { type: array, items: { type: string } }
        replaces: { type: string, description: License ID a correction license replaces; empty otherwise }
        key_id: { type: string }
    LicenseFile:
      type: object
      required: [status, uploaded_at, license]
      properties:
        status: { type: string, enum: [current, pending, superseded, invalid] }
        uploaded_at: { type: string, format: date-time }
        license:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
    LicenseHistoryEntry:
      type: object
      required: [at, event, license_id, from_state, to_state, notice]
      properties:
        at: { type: string, format: date-time }
        event: { type: string, enum: [installed, renewed, state_change, clock_anomaly, rejected, notice] }
        license_id: { type: string }
        from_state: { type: string }
        to_state: { type: string }
        notice: { type: [string, "null"] }
    LicenseDetail:
      type: object
      required: [installation_id, installed_at, phase, effective_time, current, pending, max_targets, targets_used,
        ends_at, locks_at, days_left, grace_day, tampered, files, history]
      properties:
        installation_id: { type: string, examples: [ALICE-7F3K-9Q2M-XD41-B8TC] }
        installed_at: { type: string, format: date-time }
        phase: { type: string, enum: [evaluation, evaluation_expired, active, grace, locked] }
        effective_time: { type: string, format: date-time, description: The trusted time license states are computed from }
        current:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
        pending:
          oneOf:
            - $ref: "#/components/schemas/LicenseInfo"
            - type: "null"
        max_targets: { type: integer }
        targets_used: { type: integer }
        ends_at: { type: string, format: date-time }
        locks_at: { type: string, format: date-time }
        days_left: { type: integer }
        grace_day: { type: integer }
        tampered: { type: boolean }
        files: { type: array, items: { $ref: "#/components/schemas/LicenseFile" } }
        history: { type: array, items: { $ref: "#/components/schemas/LicenseHistoryEntry" } }
    LicenseUpload:
      type: object
      additionalProperties: false
      required: [license]
      properties:
        license:
          type: string
          maxLength: 65536
          description: The license file content (UTF-8 JSON text). The whole request body is limited to 64 KiB (65536 bytes); a larger body is refused with ALC-SYS-0007 (413).
    LicenseUploadResult:
      type: object
      required: [license, pending, already_expired, correction, duplicate, phase]
      properties:
        license: { $ref: "#/components/schemas/LicenseInfo" }
        pending: { type: boolean, description: valid_from is still ahead; the previous license continues until then }
        already_expired: { type: boolean }
        correction: { type: boolean }
        duplicate: { type: boolean, description: This license was already installed; nothing changed }
        phase: { type: string, enum: [evaluation, evaluation_expired, active, grace, locked] }
    MFAEnrollment:
      type: object
      required: [secret, otpauth_uri, qr_png]
      properties:
        secret: { type: string, description: Base32 TOTP secret }
        otpauth_uri: { type: string }
        qr_png: { type: string, contentEncoding: base64, description: PNG image of otpauth_uri }
    User:
      type: object
      required: [id, username, display_name, email, role, locale, disabled, mfa_enrolled, last_login_at, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, operator, auditor] }
        locale: { type: string }
        disabled: { type: boolean }
        mfa_enrolled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [user, csrf_token, expires_at, idle_expires_at, stepup_until]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends without a person's activity (see the API description; a read without the activity marker does not extend it)
        stepup_until: { type: [string, "null"], format: date-time }
    SessionWithCodes:
      description: SessionInfo plus the one-time recovery codes (only from administrator creation and MFA verification)
      allOf:
        - { $ref: "#/components/schemas/SessionInfo" }
        - type: object
          properties:
            recovery_codes:
              type: array
              items: { type: string }
              description: Present only right after MFA enrollment or administrator creation
    APIToken:
      type: object
      required: [id, user_id, name, prefix, scope, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, examples: [alice_Xy12Ab] }
        scope: { type: string, enum: [read, operate] }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [seq, at, actor_type, actor_id, actor_name, ip, action, object_type, object_id, result, details, request_id, hash]
      properties:
        seq: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, api_token, system, oidc] }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: string }
        ip: { type: [string, "null"] }
        action: { type: string, examples: [auth.login] }
        object_type: { type: string }
        object_id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        details: { type: object, additionalProperties: { type: string } }
        request_id: { type: string }
        hash: { type: string, description: Hex SHA-256 of this entry in the chain }
    AuditReport:
      type: object
      required: [intact, checked, head_seq, head_hash, first_bad_seq, problem]
      properties:
        intact: { type: boolean }
        checked: { type: integer }
        head_seq: { type: integer }
        head_hash: { type: string }
        first_bad_seq: { type: [integer, "null"] }
        problem: { type: [string, "null"], enum: [hash_mismatch, sequence_gap, tail_truncated, null] }
    ErrorRef:
      type: [object, "null"]
      required: [code, reason]
      properties:
        code: { type: string, examples: [ALC-SSH-0002] }
        reason: { type: string, examples: [ssh.auth_failed] }
        params: { type: object, additionalProperties: { type: string } }
    Accepted:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: { type: string, format: uuid }
        status_url: { type: string, examples: [/api/v1/jobs/0192b000-0000-7000-8000-0000000000b1] }
    TargetCreate:
      type: object
      required: [name, host]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [linux, nginx], default: linux, description: Fixed at creation }
        host: { type: string, maxLength: 253, description: "Host name or IP address; no scheme and no port. An address that is never a managed server (link-local, multicast, unspecified, broadcast and other reserved forms) is refused (validation.host_not_allowed). A host name is checked again on the address it resolves to at every connection Alice opens; a refused address fails the connection with ALC-SSH-0012 (ssh.address_not_allowed), shown as the server's last_error." }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 or absent means 22 }
        username: { type: string, maxLength: 32, description: Absent means alice-svc }
    TargetPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        discovery_interval_hours: { type: integer, minimum: 1, maximum: 720 }
    TargetFacts:
      type: object
      required: [os, helper_version, helper_protocol, sshd, host_keys, warnings, unreadable]
      properties:
        os:
          type: object
          required: [id, version_id, pretty_name]
          properties:
            id: { type: string }
            version_id: { type: string }
            pretty_name: { type: string }
        helper_version: { type: string }
        helper_protocol: { type: integer }
        sshd:
          type: [object, "null"]
          properties:
            read: { type: boolean }
            pubkey_authentication: { type: string }
            password_authentication: { type: string }
            permit_root_login: { type: string }
            authorized_keys_file: { type: array, items: { type: string } }
            authorized_keys_command: { type: string }
            keys_managed_elsewhere: { type: boolean }
            certificates_in_use: { type: boolean }
        host_keys:
          type: array
          items:
            type: object
            required: [key_type, bits, fingerprint, weak]
            properties:
              key_type: { type: string }
              bits: { type: integer }
              fingerprint: { type: string }
              weak: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [code, params]
            properties:
              code:
                type: string
                examples: [keys_managed_elsewhere]
                description: >-
                  Phase 4 values for Nginx servers include nginx_not_found, nginx_profile_missing, locations_dropped,
                  list_truncated, too_many_files, stream_tls, mail_tls and config_file_writable (params.path); a newer
                  server may add others.
              params: { type: object, additionalProperties: { type: string } }
        unreadable:
          type: array
          items:
            type: object
            required: [os_user, file_path, line_no]
            properties:
              os_user: { type: string }
              file_path: { type: string }
              line_no: { type: integer }
        nginx: { $ref: "#/components/schemas/NginxFacts" }
    Target:
      type: object
      required: [id, name, type, host, port, username, status, last_error, last_success_at, last_discovery_at,
        discovery_interval_hours, keys_managed_elsewhere, capabilities, facts, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [nginx, linux, azure_key_vault] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        status: { type: string, enum: [pending_host_key, checking, ok, unreachable, host_key_changed, auth_failed, disabled] }
        last_error: { $ref: "#/components/schemas/ErrorRef" }
        last_success_at: { type: [string, "null"], format: date-time }
        last_discovery_at: { type: [string, "null"], format: date-time }
        discovery_interval_hours: { type: integer }
        keys_managed_elsewhere: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        facts: { $ref: "#/components/schemas/TargetFacts" }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TargetList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        next_cursor: { type: "null" }
    TargetCreated:
      type: object
      required: [target, job_id, status_url]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        job_id: { type: string, format: uuid }
        status_url: { type: string }
    HostKey:
      type: object
      required: [id, key_type, fingerprint, status, observed_at, confirmed_at, confirmed_by_name, superseded_at, verify_command]
      properties:
        id: { type: string, format: uuid }
        key_type: { type: string, examples: [ssh-ed25519] }
        fingerprint: { type: string, examples: ["SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8"] }
        status: { type: string, enum: [observed, pinned, superseded, rejected] }
        observed_at: { type: string, format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
        confirmed_by_name: { type: string }
        superseded_at: { type: [string, "null"], format: date-time }
        verify_command: { type: string, examples: [ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub] }
    HostKeyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HostKey" } }
    HostKeyConfirm:
      type: object
      required: [fingerprint]
      additionalProperties: false
      properties:
        fingerprint: { type: string }
    HostKeyRepin:
      type: object
      required: [fingerprint, reason]
      additionalProperties: false
      properties:
        fingerprint: { type: string }
        reason: { type: string, minLength: 10, maxLength: 500 }
    KeyLocation:
      type: object
      required: [id, ssh_key_id, fingerprint, key_type, target_id, target_name, os_user, file_path, line_no, options,
        comment, flags, first_seen_at, last_seen_at, missing_since, removed_at, is_alice_connection_key]
      properties:
        id: { type: string, format: uuid }
        ssh_key_id: { type: string, format: uuid }
        fingerprint: { type: string }
        key_type: { type: string }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        os_user: { type: string }
        file_path: { type: string }
        line_no: { type: integer }
        options: { type: string }
        comment: { type: string }
        flags: { type: array, items: { type: string } }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        is_alice_connection_key: { type: boolean }
    KeyLocationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KeyLocation" } }
    SSHKey:
      type: object
      required: [id, fingerprint, key_type, bits, public_key, managed, is_platform_key, weak, comment, location_count,
        target_count, missing, first_seen_at]
      properties:
        id: { type: string, format: uuid }
        fingerprint: { type: string }
        key_type: { type: string }
        bits: { type: integer }
        public_key: { type: string, description: Public key only (type and base64); never private material }
        managed: { type: boolean }
        is_platform_key: { type: boolean }
        weak: { type: boolean }
        comment: { type: string }
        location_count: { type: integer }
        target_count: { type: integer }
        missing: { type: boolean, description: Every location of the key is missing or removed }
        first_seen_at: { type: string, format: date-time }
        locations: { type: array, items: { $ref: "#/components/schemas/KeyLocation" }, description: "Only on GET /ssh-keys/{id}" }
    SSHKeyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSHKey" } }
        next_cursor: { type: [string, "null"] }
    KeyRemove:
      type: object
      additionalProperties: false
      properties:
        confirm_last_root_key: { type: boolean, default: false }
    SetupSnippet:
      type: object
      required: [sudoers, script]
      properties:
        sudoers: { type: string }
        script: { type: string }
    PlatformKeyInfo:
      type: object
      required: [public_key, fingerprint, authorized_keys_line, helper_path, helper_protocol, profiles]
      properties:
        public_key: { type: string }
        fingerprint: { type: string }
        authorized_keys_line: { type: string }
        helper_path: { type: string }
        helper_protocol: { type: integer }
        profiles:
          type: object
          required: [linux, nginx]
          properties:
            linux: { $ref: "#/components/schemas/SetupSnippet" }
            nginx: { $ref: "#/components/schemas/SetupSnippet" }
    Job:
      type: object
      required: [id, type, kind, status, target_id, attempts, max_attempts, error, result, created_at, run_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, examples: [target.test_connection] }
        kind: { type: string, enum: [scheduled, user, system] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, dead, blocked_license] }
        target_id: { type: [string, "null"], format: uuid }
        attempts: { type: integer }
        max_attempts: { type: integer }
        error: { $ref: "#/components/schemas/ErrorRef" }
        result: { type: object }
        created_at: { type: string, format: date-time }
        run_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: [string, "null"] }
    Provider:
      type: object
      required: [kind, display_name_key, capabilities, config_schema]
      properties:
        kind: { type: string, enum: [linuxssh, nginx, azurekv] }
        display_name_key: { type: string }
        capabilities: { type: array, items: { type: string } }
        config_schema:
          type: object
          required: [fields]
          properties:
            fields:
              type: array
              items:
                type: object
                required: [name, type, required, default, label_key, help_key, pattern, min, max, values]
                properties:
                  name: { type: string }
                  type: { type: string, enum: [string, int, bool, enum, path, host] }
                  required: { type: boolean }
                  default: {}
                  label_key: { type: string }
                  help_key: { type: string }
                  pattern: { type: string }
                  min: { type: integer }
                  max: { type: integer }
                  values: { type: array, items: { type: string } }
    ProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Provider" } }
    NginxFacts:
      type: object
      description: Present for Nginx servers that were tested or scanned
      required: [version, conf_path, config_valid, config_error, config_error_reason, config_error_file, found]
      properties:
        version: { type: string, examples: [1.24.0] }
        conf_path: { type: string, examples: [/etc/nginx/nginx.conf] }
        config_valid: { type: boolean }
        config_error:
          type: string
          description: >-
            Error class when config_valid is false, "" otherwise. Known values: key_mismatch, file_missing,
            cert_load, key_load, syntax, untrusted, unsupported; a newer server may add others.
        config_error_reason:
          type: string
          description: >-
            Why for untrusted and unsupported. Known values: not_root_controlled, special_filesystem, missing,
            not_regular, changed, name_not_allowed, unexpected_text, wrong_first_file, duplicate_file, no_conf_path,
            too_large, too_complex, include_loop, nul_byte; a newer server may add others.
        config_error_file: { type: string, description: 'The file concerned (text from the server; shown as is, never interpolated)' }
        found: { type: boolean }
    CertificateRef:
      type: [object, "null"]
      required: [id, subject_cn, label, fingerprint, not_after]
      properties:
        id: { type: string, format: uuid }
        subject_cn: { type: string }
        label: { type: string }
        fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        not_after: { type: string, format: date-time }
    Certificate:
      type: object
      description: A certificate (public data). A held private key is only indicated by has_private_key.
      required: [id, fingerprint, subject_cn, subject, issuer, serial, sans, not_before, not_after, key_algorithm, key_bits, source,
        label, has_private_key, chain_complete, self_signed, location_count, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        fingerprint: { type: string, pattern: "^[0-9a-f]{64}$", description: 'SHA-256 of the leaf (DER), hex' }
        subject_cn: { type: string }
        subject: { type: string }
        issuer: { type: string }
        serial: { type: string }
        sans: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        key_algorithm: { type: string, description: "Known values: rsa, ecdsa, ed25519, other" }
        key_bits: { type: integer }
        source: { type: string, description: "Known values: discovered, uploaded, csr" }
        label: { type: string }
        has_private_key: { type: boolean }
        chain_complete: { type: boolean }
        self_signed: { type: boolean }
        location_count: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    CertificateDetail:
      allOf:
        - { $ref: "#/components/schemas/Certificate" }
        - type: object
          required: [pem_chain, locations, locations_truncated]
          properties:
            pem_chain: { type: string, description: 'Leaf first, then the chain (public PEM)' }
            locations: { type: array, items: { $ref: "#/components/schemas/CertificateLocation" }, maxItems: 1000 }
            locations_truncated: { type: boolean }
    CertificatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
        next_cursor: { type: [string, "null"] }
    CertificateUpload:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 100 }
        certificate_pem: { type: string, maxLength: 262144, description: 'Leaf first, then the chain' }
        private_key_pem: { type: string, maxLength: 262144, writeOnly: true, description: 'Unencrypted PKCS#8, PKCS#1 or SEC 1' }
        pfx_base64: { type: string, writeOnly: true, description: 'A PFX (PKCS#12) file in standard base64, at most 256 KiB decoded' }
        pfx_password: { type: string, writeOnly: true }
    CertificateStored:
      type: object
      description: >-
        The answer of an upload and of a signing request's completion. certificate is the detail form (pem_chain,
        locations, locations_truncated) as GET /certificates/{id} returns it: public data, saving a second request.
      required: [certificate, warnings]
      properties:
        certificate: { $ref: "#/components/schemas/CertificateDetail" }
        warnings:
          type: array
          description: >-
            Conditions that did not block. Known values: chain_incomplete, chain_certificate_expired, not_yet_valid,
            csr_name_mismatch, chain_completed (an upload completed the chain of a certificate Alice already held;
            answered with 200); a newer server may add others.
          items: { type: string }
    CertificateServer:
      type: object
      required: [names, listens, file, line]
      properties:
        names: { type: array, items: { type: string } }
        listens:
          type: array
          items:
            type: object
            required: [addr, port, default_server]
            properties:
              addr: { type: string }
              port: { type: integer }
              default_server: { type: boolean }
        file: { type: string }
        line: { type: integer }
    CertificateLocation:
      type: object
      description: >-
        A certificate file an Nginx website uses, with its key file. Paths, names, files and accounts are text from
        the server (shown as is, never interpolated into a message).
      required: [id, target_id, target_name, cert_path, key_path, resolved_cert_path, key_type, certificate, servers, supported,
        unsupported_reason, problem, key_problem, inherited, custom_location, symlinked, key_exists, key_mode, key_owner, key_group,
        warnings, deployed_fingerprint, changed_outside_at, verify_port, verify_sni, skip_verify, first_seen_at, last_seen_at,
        missing_since, version, active_deployment_id]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string }
        key_path: { type: string }
        resolved_cert_path: { type: string, description: 'The file a symbolic link leads to; "" when not known' }
        key_type: { type: string, description: "The key type of the certificate in the file: rsa, ecdsa or \"\"" }
        certificate: { $ref: "#/components/schemas/CertificateRef" }
        servers: { type: array, items: { $ref: "#/components/schemas/CertificateServer" } }
        supported: { type: boolean }
        unsupported_reason:
          type: string
          description: >-
            "" when supported. Known values: variable, data_value, engine_key, key_missing, password_file,
            path_not_allowed, stream, combined_file, config_file_writable, key_conflict, file_problem (see problem and
            key_problem), unsupported_key, unknown; a newer server may add others.
        problem: { $ref: "#/components/schemas/FileProblem" }
        key_problem: { $ref: "#/components/schemas/FileProblem" }
        inherited: { type: boolean }
        custom_location: { type: boolean }
        symlinked: { type: boolean }
        key_exists: { type: boolean }
        key_mode: { type: string, examples: ["0640"] }
        key_owner: { type: string }
        key_group: { type: string }
        warnings:
          type: array
          description: >-
            Known values: key_mode_open, symlinked, custom_location, key_group_open, certificate_block_dropped,
            list_truncated, certificate_expired, san_mismatch, chain_unresolved (the file's chain could not be ordered
            within the signature checks Alice makes per file; the leaf alone is kept); a newer server may add others.
          items: { type: string }
        deployed_fingerprint: { type: string }
        changed_outside_at: { type: [string, "null"], format: date-time }
        verify_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        verify_sni: { type: string }
        skip_verify: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1, description: 'The value If-Match names for PATCH /locations/{id}' }
        active_deployment_id: { type: [string, "null"], format: uuid }
    FileProblem:
      type: string
      description: >-
        A certificate or key file Alice cannot use; "" when none. Known values: missing, not_root_controlled,
        not_regular, hard_linked, too_large, not_a_certificate, unreadable, bad_name, name_not_allowed (the file's real
        name, after links, has a character outside the helper's vocabulary), special_filesystem, unknown; a
        newer server may add others.
    CertificateLocationList:
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CertificateLocation" }, maxItems: 1000 }
        truncated: { type: boolean }
    LocationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        verify_port: { type: integer, minimum: 0, maximum: 65535, description: '0 clears (the website''s own ports are probed)' }
        verify_sni: { type: string, maxLength: 253, description: 'A DNS name; "" clears (the first server name is sent)' }
        skip_verify: { type: boolean }
    CSR:
      type: object
      description: A signing request (public). Its key stays in Alice.
      required: [id, common_name, sans, key_algorithm, key_bits, csr_pem, status, certificate_id, created_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        common_name: { type: string }
        sans: { type: array, items: { type: string }, description: 'The request''s DNS names, the common name first' }
        key_algorithm: { type: string, enum: [rsa, ecdsa] }
        key_bits: { type: integer }
        csr_pem: { type: string }
        status: { type: string, enum: [pending, completed, cancelled] }
        certificate_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    CSRList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CSR" } }
    CSRCreate:
      type: object
      required: [common_name, key_type]
      additionalProperties: false
      properties:
        common_name: { type: string, maxLength: 64 }
        sans: { type: array, maxItems: 50, items: { type: string } }
        key_type: { type: string, enum: [ecdsa-p256, rsa-3072, rsa-4096] }
    CSRComplete:
      type: object
      required: [certificate_pem]
      additionalProperties: false
      properties:
        certificate_pem: { type: string, maxLength: 262144 }
        label: { type: string, maxLength: 100 }
    DeployRequest:
      type: object
      required: [location_ids]
      additionalProperties: false
      properties:
        location_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
        confirm_incomplete_chain: { type: boolean, description: 'Counts for an Administrator only' }
    DeployAccepted:
      type: object
      required: [deployments]
      properties:
        deployments:
          type: array
          items:
            type: object
            required: [id, job_id, location_id, status_url, deployment_url, warnings]
            properties:
              id: { type: string, format: uuid }
              job_id: { type: string, format: uuid }
              location_id: { type: string, format: uuid }
              status_url: { type: string, examples: [/api/v1/jobs/0192b000-0000-7000-8000-0000000000b1] }
              deployment_url: { type: string, examples: [/api/v1/deployments/0192c000-0000-7000-8000-0000000000d4] }
              warnings:
                type: array
                description: "Known values: san_mismatch; a newer server may add others."
                items: { type: string }
    DeploymentStep:
      type: object
      required: [n, name, status, at, params]
      properties:
        n: { type: integer, minimum: 1 }
        name:
          type: string
          description: >-
            Known values: verify_current, recover_pending, backup, write_key, write_cert, config_test, reload,
            journal, restore, rollback_config_test, rollback_reload, verify, verify_old; a newer server may add
            others.
        status: { type: string, enum: [started, ok, failed, skipped] }
        at: { type: string, format: date-time }
        params:
          type: object
          description: >-
            Allowlisted values only: error (a configuration error class or file_changed), port, mode (remote, local,
            skipped), served (a fingerprint), reason (a reason code), operation_id (on recover_pending: the
            unfinished earlier change).
          additionalProperties: { type: string }
    Deployment:
      type: object
      description: >-
        One deployment. Show state and status, not the job's: a deployment being recovered is state recovering
        while its job may already have ended. status failed = nothing was written; rolled_back = the previous files
        are back; rollback_failed = the outcome is unknown or mixed (see error); needs_attention = Alice cannot
        reach the server to finish it and keeps trying.
      required: [id, certificate_id, certificate_name, location_id, target_id, target_name, cert_path, key_path, job_id, job_status,
        trigger, state, status, result, phase, new_fingerprint, previous_fingerprint, confirm_incomplete_chain, verified,
        verify_failed, error, failed_step, cause_step, helper_error, backup_dir, requested_by, requested_by_name, recovery_attempts,
        recover_after, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        certificate_id: { type: string, format: uuid }
        certificate_name: { type: string, description: 'The label, else the subject CN, else the start of the fingerprint' }
        location_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        cert_path: { type: string }
        key_path: { type: string }
        job_id: { type: [string, "null"], format: uuid }
        job_status: { type: string, description: 'The job''s status ("" once it was pruned); blocked_license means held in lock' }
        trigger: { type: string, examples: [manual] }
        state: { type: string, enum: [queued, precheck, deploying, recovering, done] }
        status: { type: string, enum: [pending, running, succeeded, unchanged, failed, rolled_back, rollback_failed, needs_attention] }
        result: { type: string, enum: ["", committed, unchanged, no_change, rolled_back, rollback_failed, uncertain] }
        phase: { type: string, enum: ["", none, prepared, writing, committed, unchanged, restoring, restored, restore_failed] }
        new_fingerprint: { type: string }
        previous_fingerprint: { type: string }
        confirm_incomplete_chain: { type: boolean }
        verified: { type: string, enum: ["", remote, local, skipped] }
        verify_failed: { $ref: "#/components/schemas/ErrorRef", description: 'The verification failure that started a rollback (params.port)' }
        error:
          $ref: "#/components/schemas/ErrorRef"
          description: >-
            Why it did not succeed, as a documented code; null on success. Params are allowlisted (port, failed_step,
            phase, profile, backup_dir, helper_code, subcommand, ...). deployment.rollback_failed is reported as
            deployment.restored_unverified (ALC-DEP-0019) when the files are back but the website was not confirmed,
            and as deployment.rollback_file_changed (ALC-DEP-0020) when another program changed the files (Alice put
            back at most what it had written: the pair may not match). A deployment whose waiting job an
            Administrator discarded ends failed with deployment.cancelled (ALC-DEP-0022; nothing was sent).
        failed_step: { type: string, description: "The step that failed (verify_current when the pre-check refused; verify when the new certificate was not confirmed); \"\" when none" }
        cause_step: { type: string }
        helper_error: { type: string, description: "A configuration error class or file_changed; \"\" when none" }
        backup_dir: { type: string, description: 'Where the server keeps the previous files (/var/lib/alice-helper/backups/<id>); "" before a change' }
        requested_by: { type: [string, "null"], format: uuid }
        requested_by_name: { type: string }
        recovery_attempts: { type: integer }
        recover_after: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time, description: 'When the change started (the start record)' }
        finished_at: { type: [string, "null"], format: date-time }
    DeploymentDetail:
      allOf:
        - { $ref: "#/components/schemas/Deployment" }
        - type: object
          required: [steps]
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/DeploymentStep" } }
    DeploymentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        next_cursor: { type: [string, "null"] }
