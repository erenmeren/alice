  /api/v1/ssh-keys/locations/{id}/actions/remove:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: removeKeyLocation
      summary: Remove this key from this file on the server (runs as a job; Alice's own key is refused)
