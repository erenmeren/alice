        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/bindings/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getBinding
      summary: One connection with the state of each website
      x-permission: read
      x-scope: resource
      responses:
        "200":
          description: The connection
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Binding" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateBindingLocations
      summary: Replace the websites of a connection (If-Match with the ETag is required)
      description: >-
        The websites not named are released, new ones are checked as when connecting. Adding websites to a connection that
        deploys automatically puts them under automatic deployment, so it needs an Administrator's browser session with a
        fresh step-up (403 ALC-AUTH-0003; an API token: 403 ALC-AUTH-0002; an Operator: 403 ALC-AUTH-0002); releasing websites does not.
        The inventory repeats the check inside its transaction and is told whether the session is strict. 412 ALC-SYS-0008 when the
        If-Match header is missing (answered first, before the body is read) or names another version than the connection's
        current one (compared after the request is read (400, 413, 422) and the connection is found (404), and before anything
        about the change is judged).
