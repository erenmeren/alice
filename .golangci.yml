version: "2"
run:
  build-tags: [integration]
linters:
  default: standard
  enable:
    - gosec
    - forbidigo
    - errorlint
    - bodyclose
    - misspell
    - noctx
  settings:
    forbidigo:
      forbid:
        - pattern: ^strings\.(ToUpper|ToLower|Title)$
          msg: "Turkish dotted/dotless i: use strings.EqualFold for identifiers or golang.org/x/text/cases for user-visible text."
        - pattern: ^fmt\.Print(f|ln)?$
          msg: "Use the structured logger (log/slog) or write to an explicit io.Writer."
        - pattern: ^time\.Now$
          msg: "use the injected clock.Clock (time-dependent logic must be testable)"
        - pattern: ^ssh\.InsecureIgnoreHostKey$
          msg: "never accept any host key: connect through linuxssh.Dialer and its pinned-key callback (SEC-080)"
  exclusions:
    presets: [std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: (_test\.go|internal/platform/clock/)
        linters: [forbidigo]
        text: "use the injected clock.Clock"
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [alice]
