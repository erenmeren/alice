# configuration file /etc/nginx/nginx.conf:
events {}
http {
    include conf.d/*.conf;
}

# configuration file /etc/nginx/conf.d/one.conf:
server {
    listen 443 ssl;
    server_name one.example.test;
    ssl_certificate /etc/nginx/ssl/one.crt;
    ssl_certificate_key /etc/nginx/ssl/one.key;
}

# configuration file /etc/nginx/conf.d/two.conf:
server {
    listen 443 ssl;
    server_name two.example.test;
    ssl_certificate /etc/nginx/ssl/two.crt;
    ssl_certificate_key /etc/nginx/ssl/two.key;
}
