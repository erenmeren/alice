# configuration file /etc/nginx/nginx.conf:
http {
    server {
        listen 443 ssl;
        server_name both.example.test;
        ssl_certificate /etc/nginx/ssl/both.pem;
        ssl_certificate_key /etc/nginx/ssl/both.pem;
    }
    server {
        listen 8443 ssl;
        server_name engine.example.test;
        ssl_certificate /etc/nginx/ssl/engine.crt;
        ssl_certificate_key engine:pkcs11:id_45;
    }
    server {
        listen 9443 ssl;
        server_name data.example.test;
        ssl_certificate data:$cert_pem;
        ssl_certificate_key data:$key_pem;
    }
    server {
        listen 10443 ssl;
        server_name nokey.example.test;
        ssl_certificate /etc/nginx/ssl/nokey.crt;
    }
}
