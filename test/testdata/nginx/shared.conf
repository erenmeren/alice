# configuration file /etc/nginx/nginx.conf:
http {
    server {
        listen 443 ssl;
        server_name a.example.test;
        ssl_certificate /etc/nginx/ssl/shared.crt;
        ssl_certificate_key /etc/nginx/ssl/shared.key;
    }
    server {
        listen 443 ssl;
        server_name b.example.test;
        ssl_certificate /etc/nginx/ssl/shared.crt;
        ssl_certificate_key /etc/nginx/ssl/shared.key;
    }
    server {
        listen 8443 ssl;
        server_name c.example.test;
        ssl_certificate /etc/nginx/ssl/shared.crt;
        ssl_certificate_key /etc/nginx/ssl/shared.key;
    }
}
