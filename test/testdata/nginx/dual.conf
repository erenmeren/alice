# configuration file /etc/nginx/nginx.conf:
http {
    server {
        listen 443 ssl;
        server_name dual.example.test;
        ssl_certificate /etc/nginx/ssl/rsa.crt;
        ssl_certificate_key /etc/nginx/ssl/rsa.key;
        ssl_certificate /etc/nginx/ssl/ec.crt;
        ssl_certificate_key /etc/nginx/ssl/ec.key;
    }
}
