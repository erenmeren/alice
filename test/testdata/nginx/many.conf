# configuration file /etc/nginx/nginx.conf:
http {
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/ssl/certs/a.pem;
        ssl_certificate_key /etc/ssl/private/a.key;
    }
    include /etc/nginx/conf.d/*.conf;
}

# configuration file /etc/nginx/conf.d/b.conf:
server {
    listen 443 ssl;
    server_name b.example.test;
    ssl_certificate /etc/ssl/certs/b.pem;
    ssl_certificate_key /etc/ssl/private/b.key;
}
server {
    listen 8443 ssl;
    server_name c.example.test;
    ssl_certificate /etc/ssl/certs/c.pem;
    ssl_certificate_key /etc/ssl/private/c.key;
}
