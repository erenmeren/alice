# configuration file /etc/nginx/nginx.conf:
http {
    server {
        listen 443 ssl;
        server_name f0.example.test;
        ssl_certificate /etc/nginx/ssl/f0.crt;
        ssl_certificate_key /etc/nginx/ssl/f0.key;
    }
    server {
        listen 10.0.0.5:8443 ssl;
        server_name f1.example.test;
        ssl_certificate /etc/nginx/ssl/f1.crt;
        ssl_certificate_key /etc/nginx/ssl/f1.key;
    }
    server {
        listen [::1]:9443 ssl;
        server_name f2.example.test;
        ssl_certificate /etc/nginx/ssl/f2.crt;
        ssl_certificate_key /etc/nginx/ssl/f2.key;
    }
    server {
        listen *:4443 ssl;
        server_name f3.example.test;
        ssl_certificate /etc/nginx/ssl/f3.crt;
        ssl_certificate_key /etc/nginx/ssl/f3.key;
    }
    server {
        listen localhost:5443 ssl;
        server_name f4.example.test;
        ssl_certificate /etc/nginx/ssl/f4.crt;
        ssl_certificate_key /etc/nginx/ssl/f4.key;
    }
    server {
        listen unix:/run/x.sock ssl;
        server_name f5.example.test;
        ssl_certificate /etc/nginx/ssl/f5.crt;
        ssl_certificate_key /etc/nginx/ssl/f5.key;
    }
    server {
        listen 7443;
        server_name f6.example.test;
        ssl on;
        ssl_certificate /etc/nginx/ssl/f6.crt;
        ssl_certificate_key /etc/nginx/ssl/f6.key;
    }
    server {
        listen 6443 ssl default;
        server_name f7.example.test;
        ssl_certificate /etc/nginx/ssl/f7.crt;
        ssl_certificate_key /etc/nginx/ssl/f7.key;
    }
    server {
        listen 70000 ssl;
        server_name f8.example.test;
        ssl_certificate /etc/nginx/ssl/f8.crt;
        ssl_certificate_key /etc/nginx/ssl/f8.key;
    }
}
