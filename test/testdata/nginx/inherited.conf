# configuration file /etc/nginx/nginx.conf:
http {
    ssl_certificate /etc/nginx/ssl/all.crt;
    ssl_certificate_key /etc/nginx/ssl/all.key;
    server {
        listen 443 ssl;
        server_name a.example.test;
    }
    server {
        listen 443 ssl;
        server_name b.example.test;
        ssl_certificate /etc/nginx/ssl/b.crt;
        ssl_certificate_key /etc/nginx/ssl/b.key;
    }
    server {
        listen 80;
        server_name c.example.test;
    }
}
