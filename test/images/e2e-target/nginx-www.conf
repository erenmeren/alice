# Test-only websites of the e2e SSH target. www.example.test is a supported location: a fixed
# certificate and key pair in root-only directories. files.example.test is deliberately
# unsupported: its files are chosen per connection from a variable, so Alice cannot deploy to it.
# s1..s5.example.test are five more supported websites, each with its own files, for a deployment
# to several websites at once. Their /healthz answers 200 and /canary-fail 503: the application
# checks of a canary deployment (web/e2e/canary.spec.ts, R65).
# The certificates are created when the container starts (alice-e2e-start), never committed.
# Port 80 answers only the ACME HTTP-01 proof (web/e2e/phase10.spec.ts) from the webroot the admin's
# guide prepares (docs: the 3-line ^~ snippet; alice-helper writes and removes the token files there).
server {
    listen 443 ssl;
    server_name www.example.test;
    ssl_certificate /etc/nginx/ssl/www.crt;
    ssl_certificate_key /etc/nginx/ssl/www.key;
    location / { return 200 "www\n"; }
}
server {
    listen 443 ssl;
    server_name files.example.test;
    ssl_certificate /etc/nginx/ssl/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/ssl/$ssl_server_name.key;
    location / { return 200 "files\n"; }
}
server {
    listen 443 ssl;
    server_name s1.example.test;
    ssl_certificate /etc/nginx/ssl/s1.crt;
    ssl_certificate_key /etc/nginx/ssl/s1.key;
    location / { return 200 "s1\n"; }
    location = /healthz { return 200 "ok\n"; }
    location = /canary-fail { return 503; }
}
server {
    listen 443 ssl;
    server_name s2.example.test;
    ssl_certificate /etc/nginx/ssl/s2.crt;
    ssl_certificate_key /etc/nginx/ssl/s2.key;
    location / { return 200 "s2\n"; }
    location = /healthz { return 200 "ok\n"; }
    location = /canary-fail { return 503; }
}
server {
    listen 443 ssl;
    server_name s3.example.test;
    ssl_certificate /etc/nginx/ssl/s3.crt;
    ssl_certificate_key /etc/nginx/ssl/s3.key;
    location / { return 200 "s3\n"; }
    location = /healthz { return 200 "ok\n"; }
    location = /canary-fail { return 503; }
}
server {
    listen 443 ssl;
    server_name s4.example.test;
    ssl_certificate /etc/nginx/ssl/s4.crt;
    ssl_certificate_key /etc/nginx/ssl/s4.key;
    location / { return 200 "s4\n"; }
    location = /healthz { return 200 "ok\n"; }
    location = /canary-fail { return 503; }
}
server {
    listen 443 ssl;
    server_name s5.example.test;
    ssl_certificate /etc/nginx/ssl/s5.crt;
    ssl_certificate_key /etc/nginx/ssl/s5.key;
    location / { return 200 "s5\n"; }
    location = /healthz { return 200 "ok\n"; }
    location = /canary-fail { return 503; }
}
server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/alice-acme; }
    location / { return 404; }
}
