# Test only: the Apache websites of the e2e SSH target (web/e2e/webservers.spec.ts). Apache is
# configured and never started (Alice only discovers Apache servers; Nginx owns ports 80 and 443),
# so the websites use port 8443. alice-e2e-pki apache issues their certificates at container start.
#   apache.example.test     certificate and key in separate files
#   combined.example.test   certificate, chain and key in one file (no SSLCertificateKeyFile)
Listen 8443

<VirtualHost *:8443>
	ServerName apache.example.test
	SSLEngine on
	SSLCertificateFile /etc/apache2/ssl/apache.crt
	SSLCertificateKeyFile /etc/apache2/ssl/apache.key
</VirtualHost>

<VirtualHost *:8443>
	ServerName combined.example.test
	SSLEngine on
	SSLCertificateFile /etc/apache2/ssl/combined.pem
</VirtualHost>
