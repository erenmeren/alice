# Test-only slapd configuration of the e2e fake directory (compose service fakeldap). A static slapd.conf, not
# cn=config: the root filesystem is read-only, and everything slapd writes (the database, the TLS material, the pid
# file and the ldapi socket) lives in the tmpfs /run/alice-fakeldap, created fresh at every start.
include         /etc/ldap/schema/core.schema
include         /etc/ldap/schema/cosine.schema
include         /etc/ldap/schema/inetorgperson.schema
include         /etc/ldap/schema/nis.schema

pidfile         /run/alice-fakeldap/slapd.pid
argsfile        /run/alice-fakeldap/slapd.args
modulepath      /usr/lib/ldap
moduleload      back_mdb

# ldaps:// only (the start script passes -h): TLS 1.2 or newer, a certificate for ldap.alice-e2e.test issued at start
# by a CA generated at start (alice-fakeldap-start); client certificates are not asked for.
TLSCACertificateFile   /run/alice-fakeldap/ca.crt
TLSCertificateFile     /run/alice-fakeldap/ldap.crt
TLSCertificateKeyFile  /run/alice-fakeldap/ldap.key
TLSProtocolMin         3.3
TLSVerifyClient        never

sizelimit       500
timelimit       15

database        mdb
maxsize         67108864
suffix          "dc=example,dc=test"
rootdn          "cn=admin,dc=example,dc=test"
# Throw-away password of a test container (the same as internal/testutil/fakeldap); used only by alice-fakeldap-ctl
# inside the container.
rootpw          admin-Pa55-container
directory       /run/alice-fakeldap/db
index           objectClass eq
index           uid,member,memberUid eq

# Passwords can only be used to bind. The service account reads the tree (it finds users and groups), each person
# reads their own entry, nobody else reads anything (anonymous search finds nothing).
access to attrs=userPassword
        by self =xw
        by anonymous auth
        by * none
access to *
        by dn.exact="cn=alice-svc,ou=services,dc=example,dc=test" read
        by self read
        by * none
