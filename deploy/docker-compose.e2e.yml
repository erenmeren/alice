# Test-only overlay: builds the e2e variant of alice (build tags "e2e testlicense"), which adds
# the /test/* endpoints used by Playwright (demo clock, reset, setup code, test licenses, test
# mailbox) and trusts the test license signing key. Never use this file for a real installation;
# release images are built without these tags and refuse test-signed licenses.
services:
  alice:
    image: alice:e2e
    # Its own host port (ALICE_E2E_PORT, default 9443), never ALICE_PORT: the e2e stack runs beside the
    # make up stack. !override replaces the base file's port list instead of adding to it. Loopback
    # only: this build answers the unauthenticated /test/* endpoints (reset, clock, licenses), which
    # must never be reachable from the network (AUD-07).
    ports: !override
      - "127.0.0.1:${ALICE_E2E_PORT:-9443}:8443"
    build:
      args:
        GO_TAGS: e2e testlicense
    # The e2e build trusts ONLY the CA of the fake Azure service for Azure's host names, read from this
    # volume (the fake writes it; read-only here), and starts after the fake is healthy so the CA exists.
    # Neither AZURE_SDK_GO_LOGGING, MSAL_FORCE_REGION nor AZURE_REGIONAL_AUTHORITY_NAME is ever set:
    # the Key Vault provider refuses to open a session with any of them (compose_test.go).
    volumes:
      - fakeazure-ca:/run/alice-e2e-azure:ro
      - fakeacme-ca:/run/alice-e2e-acme:ro
    depends_on:
      fakeazure: { condition: service_healthy }
      fakeacme: { condition: service_healthy }
      fakesmtp: { condition: service_healthy }
      fakeidp: { condition: service_healthy }
  # Test-only SSH target for the Phase 3 and Phase 4 journeys (web/e2e/phase3.spec.ts and later):
  # Ubuntu 22.04 with OpenSSH, sudo, fixture users and keys generated at image build time, alice-helper
  # built from this repository in /opt/alice-bundle, and the distribution's Nginx with two TLS
  # websites (www.example.test, supported; files.example.test, deliberately unsupported) whose test
  # CA and certificates are created at container start. No systemd: /usr/bin/systemctl is a test
  # shim. Playwright prepares it with the setup script Alice shows (alice-e2e-prepare), rotates its
  # host key (alice-e2e-rotate-hostkey) and drives Nginx (alice-e2e-newcert, -served, -reload-mode,
  # -test-mode, -nginx-reset) through "docker compose exec". Alice reaches it as sshtarget:22 and
  # sshtarget:443 on the internal backend network; it publishes nothing.
  sshtarget:
    image: alice-e2e-sshtarget
    build:
      context: ..
      dockerfile: test/images/e2e-target/Dockerfile
    init: true
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null && pgrep -x nginx >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Test-only fake of Microsoft Entra ID and Azure Key Vault for the Phase 5 journeys
  # (web/e2e/phase5.spec.ts): the in-process fake of internal/testutil/fakekv as a container. Docker's
  # DNS answers login.microsoftonline.com and alice-e2e.vault.azure.net with it on the internal
  # network, so the real provider needs no dial mapping; only the e2e build of Alice trusts its CA (the
  # fakeazure-ca volume; R40 row 35). Managed identity is not offered here: its metadata address
  # (169.254.169.254) is not reachable in the compose network. That is a property of
  # the host, not an enforced rule: do NOT run this stack on an Azure virtual machine, where the real
  # metadata service could answer and a real identity token would go to the fake, which this build trusts. Everything it needs (CA, certificates,
  # the application's client secret) is generated when it starts. Playwright drives it with
  # "docker compose exec fakeazure /alice-fakeazure ctl ...", which talks to its loopback-only admin
  # API. It publishes nothing and runs as a non-root user: port 443 is bindable because the container's
  # unprivileged port start is 0 (a namespaced sysctl), not because of a capability.
  fakeazure:
    image: alice-e2e-fakeazure
    build:
      context: ..
      dockerfile: test/images/fakeazure/Dockerfile
    command: ["serve", "--listen", ":443", "--admin", "127.0.0.1:9090", "--ca-out", "/run/alice-e2e-azure/ca.pem"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    mem_limit: 256m
    pids_limit: 128
    ulimits: { core: 0 }
    volumes:
      - fakeazure-ca:/run/alice-e2e-azure
    networks:
      backend:
        aliases: [login.microsoftonline.com, alice-e2e.vault.azure.net]
    healthcheck:
      test: ["CMD", "/alice-fakeazure", "ctl", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Test-only ACME certificate authority for the ACME journeys (web/e2e/acme.spec.ts): the in-process fake of
  # internal/testutil/fakeacme as a container. Docker's DNS answers acme.test.alice with it on the internal
  # network; only the e2e build of Alice can trust its CA (the fakeacme-ca volume, cmd/alice/testapi_e2e.go).
  # It validates HTTP-01 and DNS-01 for real (its DNS table is fed by "ctl dns set" and by its built-in DNS
  # hook, POST https://acme.test.alice/hook) and issues from CAs it generates when it starts. Playwright drives
  # it with "docker compose exec fakeacme /alice-fakeacme ctl ...", which talks to its loopback-only admin API.
  # It publishes nothing and runs as a non-root user: port 443 is bindable because the container's
  # unprivileged port start is 0 (a namespaced sysctl), not because of a capability.
  fakeacme:
    image: alice-e2e-fakeacme
    build:
      context: ..
      dockerfile: test/images/fakeacme/Dockerfile
    command: ["serve", "--listen", ":443", "--admin", "127.0.0.1:9091", "--ca-out", "/run/alice-e2e-acme/ca.pem"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    mem_limit: 256m
    pids_limit: 128
    ulimits: { core: 0 }
    volumes:
      - fakeacme-ca:/run/alice-e2e-acme
    networks:
      backend:
        aliases: [acme.test.alice]
    healthcheck:
      test: ["CMD", "/alice-fakeacme", "ctl", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Test-only SMTP server for the Phase 7 journeys (web/e2e/phase7.spec.ts): internal/testutil/fakesmtp as a
  # container. STARTTLS with a certificate it generates at start (the journey trusts it through Settings, F-62), AUTH
  # PLAIN with a password it generates (read with "ctl credentials"), a MailHog-compatible message API on loopback
  # inside the container ("docker compose exec fakesmtp /alice-fakesmtp ctl messages"). It publishes nothing.
  fakesmtp:
    image: alice-e2e-fakesmtp
    build:
      context: ..
      dockerfile: test/images/fakesmtp/Dockerfile
    command: ["serve", "--listen", ":2525", "--api", "127.0.0.1:8025", "--hostname", "fakesmtp"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    ulimits: { core: 0 }
    networks: [backend]
    healthcheck:
      test: ["CMD", "/alice-fakesmtp", "ctl", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Test-only OpenID Connect provider for the Phase 7 SSO journeys: internal/testutil/fakeidp as a container. The
  # browser (Playwright, through Chromium's --host-resolver-rules) and Alice (through the network alias) both reach it
  # as https://idp.alice-e2e.test:9444, so it is published on loopback only and sits on the frontend network. Its CA is
  # read with "ctl ca" and pasted into the provider form (the feature AD FS customers use); nothing trusts it otherwise.
  fakeidp:
    image: alice-e2e-fakeidp
    build:
      context: ..
      dockerfile: test/images/fakeidp/Dockerfile
    command: ["serve", "--listen", ":9444", "--host", "idp.alice-e2e.test", "--admin", "127.0.0.1:9091", "--redirect-prefix", "https://localhost:"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    ulimits: { core: 0 }
    ports:
      - "127.0.0.1:9444:9444"
    networks:
      frontend:
        aliases: [idp.alice-e2e.test]
    healthcheck:
      test: ["CMD", "/alice-fakeidp", "ctl", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fakeazure-ca: {}
  fakeacme-ca: {}
