name: alice

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alice
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: ${ALICE_DB_PASSWORD:?run make up or deploy/dev/init-env.sh first}
      # Read once by postgres/initdb/10-alice-app-role.sh on an empty volume.
      ALICE_APP_DB_PASSWORD: ${ALICE_APP_DB_PASSWORD:?run make up or deploy/dev/init-env.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alice -d alice"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  alice:
    image: alice:${ALICE_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${ALICE_VERSION:-dev}
        # make up / make e2e-up pass the build time: the license clock never falls below it (§16.5,
        # L-53). Without ALICE_BUILD_TIME the image has none ("unknown") and Alice logs a warning at
        # every start; build through make, or see docs/dev/getting-started.md.
        BUILD_TIME: ${ALICE_BUILD_TIME:-unknown}
    restart: unless-stopped
    # Alice itself retries the database for up to 60 s, so a late PostgreSQL
    # (e.g. after a host reboot) does not crash it; depends_on only orders start.
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # sslmode=disable: the connection never leaves the internal "backend" network.
      # The app runs as alice_app (no UPDATE/DELETE on audit_log); migrations run as the owner.
      # Known limitation (Phase 8 fix): the owner "alice" is the PostgreSQL superuser.
      ALICE_DATABASE_URL: postgres://alice_app:${ALICE_APP_DB_PASSWORD}@postgres:5432/alice?sslmode=disable
      ALICE_MIGRATE_DATABASE_URL: postgres://alice:${ALICE_DB_PASSWORD}@postgres:5432/alice?sslmode=disable
      ALICE_TLS_HOSTS: ${ALICE_TLS_HOSTS:-}
      ALICE_STATE_DIR: /opt/alice/state
      # Phase 2 email (R36): set these in deploy/.env to send license warnings. The password and
      # a private CA are read from files; mount them with a compose override (see docs/operator-guide.md).
      ALICE_SMTP_HOST: ${ALICE_SMTP_HOST:-}
      ALICE_SMTP_PORT: ${ALICE_SMTP_PORT:-}
      ALICE_SMTP_FROM: ${ALICE_SMTP_FROM:-}
      ALICE_SMTP_USERNAME: ${ALICE_SMTP_USERNAME:-}
      ALICE_SMTP_PASSWORD_FILE: ${ALICE_SMTP_PASSWORD_FILE:-}
      ALICE_SMTP_TLS: ${ALICE_SMTP_TLS:-}
      ALICE_SMTP_CA_FILE: ${ALICE_SMTP_CA_FILE:-}
    ports:
      - "${ALICE_PORT:-443}:8443"
    volumes:
      - alice-keys:/opt/alice/keys
      - alice-state:/opt/alice/state
    networks: [frontend, backend]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    # No core dumps: a crash must never write key material to disk.
    ulimits: { core: 0 }
    healthcheck:
      test: ["CMD", "/usr/local/bin/alice", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  pgdata: {}
  alice-keys: {}
  alice-state: {}
