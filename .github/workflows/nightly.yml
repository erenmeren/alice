name: nightly

# The nightly set of spec §22.7 stage 5 (make nightly runs the same on one machine): 10-minute fuzzing
# per target, the release harness (install, backup-wipe-restore, update and rollback), the
# real-systemd Nginx job, ZAP baseline and testssl.sh against the release image, every Playwright
# spec on Chromium, Firefox and WebKit, mutation testing (advisory) and, when its secrets are set,
# the real Azure Key Vault suite.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make fuzz-nightly
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: fuzz-corpus, path: '**/testdata/fuzz/**' }

  release-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-install
      - run: make test-release
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: test-release-log, path: bin/test-release.log }

  systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make test-systemd

  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make zap-baseline testssl
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-reports
          path: |
            bin/zap/wrk/*.json
            bin/zap/wrk/*.html
            bin/zap/*.txt
            bin/zap/testssl/testssl.json

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-install
      - run: make e2e-up
      - run: cd web && npx playwright install --with-deps chromium firefox webkit
      - run: make e2e-browsers
      - if: always()
        run: make e2e-down
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: playwright-report-browsers, path: web/playwright-report }

  mutation:
    # Advisory (no threshold): the efficacy and coverage summaries are read at each release.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make tools mutation

  azure:
    # The real Azure Key Vault suite runs only where its credentials are configured as secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALICE_AZURE_TEST_TENANT_ID: ${{ secrets.ALICE_AZURE_TEST_TENANT_ID }}
      ALICE_AZURE_TEST_CLIENT_ID: ${{ secrets.ALICE_AZURE_TEST_CLIENT_ID }}
      ALICE_AZURE_TEST_CLIENT_SECRET: ${{ secrets.ALICE_AZURE_TEST_CLIENT_SECRET }}
      ALICE_AZURE_TEST_READER_CLIENT_ID: ${{ secrets.ALICE_AZURE_TEST_READER_CLIENT_ID }}
      ALICE_AZURE_TEST_READER_CLIENT_SECRET: ${{ secrets.ALICE_AZURE_TEST_READER_CLIENT_SECRET }}
      ALICE_AZURE_TEST_VAULT_URL: ${{ secrets.ALICE_AZURE_TEST_VAULT_URL }}
      ALICE_AZURE_TEST_CERT_NAME: ${{ secrets.ALICE_AZURE_TEST_CERT_NAME }}
    steps:
      - if: env.ALICE_AZURE_TEST_CLIENT_ID != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.ALICE_AZURE_TEST_CLIENT_ID != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - if: env.ALICE_AZURE_TEST_CLIENT_ID != ''
        run: make test-azure
      - if: env.ALICE_AZURE_TEST_CLIENT_ID == ''
        run: echo "ALICE_AZURE_TEST_CLIENT_ID is not set; the real Azure suite did not run."
