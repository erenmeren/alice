name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make tools
      - run: make lint
      - run: make test
      - run: make coverage
      - run: make i18n-check
      - run: govulncheck ./...
      # build embeds the web UI and fails if testify is linked into the binary
      - run: make web-install
      - run: make build

  licensectl:
    # Spec §26.4: licensectl is tested on Linux and macOS (the vendor's machines).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 ./cmd/licensectl/... ./internal/license/...
      - run: go build -trimpath -o bin/licensectl ./cmd/licensectl

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-install
      - run: make web-lint
      - run: make web-test
      - run: make web
      - run: cd web && npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: make secrets-scan
      - run: make fs-scan

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-install
      - run: ./deploy/dev/init-env.sh && sed -i 's/^ALICE_PORT=.*/ALICE_PORT=8443/' deploy/.env
      - run: make e2e-up
      - run: make hardening-check
      - run: cd web && npx playwright install --with-deps chromium && set -a && . ../deploy/.env && set +a && npx playwright test
      - run: make image-scan
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: web/playwright-report }
