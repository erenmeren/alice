name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make tools
      - run: make lint
      - run: make test
      - run: make coverage
      - run: make i18n-check
      - run: govulncheck ./...
      # build embeds the web UI and fails if testify is linked into the binary
      - run: make web-install
      - run: make build
      - run: make release-symcheck

  ssh-matrix:
    # The real OpenSSH and Nginx matrices (spec §22.3) on Ubuntu 22.04, Debian 12 and Rocky 9 in
    # Docker. Measured locally: about 100 s of tests with cached images; building the three images
    # without a layer cache took 48 s more (base images already pulled).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make test-ssh

  licensectl:
    # Spec §26.4: licensectl is tested on Linux and macOS (the vendor's machines).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 ./cmd/licensectl/... ./internal/license/...
      - run: go build -trimpath -o bin/licensectl ./cmd/licensectl

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-install
      - run: make web-lint
      - run: make web-test
      - run: make web
      - run: cd web && npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: make secrets-scan
      - run: make fs-scan

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-install
      - run: ./deploy/dev/init-env.sh
      - run: make e2e-up
      - run: make e2e-hardening-check
      - run: cd web && npx playwright install --with-deps chromium && set -a && . ../deploy/.env && set +a && ALICE_E2E_PROJECT=alice-e2e npx playwright test
      - run: make image-scan
      - if: failure()
        run: docker compose -p alice-e2e -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml --env-file deploy/.env logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: web/playwright-report }
