name: release

# Spec §22.7 stage 6 for a version tag: every release gate that runs on one machine
# (make release-gates; the production key check is the vendor's, after the offline ceremony), the
# hours-long ZAP full active scan and 30-minute fuzzing, then the unsigned release stage. Nothing is
# signed here: there is no signing key in CI (§17.1). A CI stage is compared with the release
# machine's build through make reproducible-check and is never what the offline key signs (S-26).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make tools
      - run: make web-install
      - run: cd web && npx playwright install --with-deps chromium firefox webkit
      - run: make release-gates
      - run: make zap-full
      - run: make fuzz-release
      - name: make release (unsigned stage)
        env:
          TAG: ${{ github.ref_name }}
        run: make release VERSION="${TAG#v}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unsigned-stage
          path: |
            bin/release/
            bin/release-gates.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reports
          path: |
            bin/zap/wrk/*.json
            bin/zap/wrk/*.html
            bin/zap/*.txt
            bin/zap/testssl/testssl.json
            bin/test-release.log
            web/playwright-report
      - name: Sign offline
        run: echo "Sign SHA256SUMS on the offline machine (docs/release-checklist.md)"
