name: release

# Spec §22.7 stage 6 for a version tag: every release gate that runs on one machine
# (make release-gates, release-keycheck included: it reads only committed public keys and
# internal/license/keys/production.json, so it fails until the vendor's keys are committed), the
# hours-long ZAP full active scan and 30-minute fuzzing, then the unsigned release stage. Nothing is
# signed here: there is no signing key in CI (§17.1). A CI stage is compared with the release
# machine's build through make reproducible-check and is never what the offline key signs (S-26).
#
# GitHub-hosted jobs stop at 6 hours whatever timeout-minutes says (Task 15 review I-2), so the work
# is split: gates, zap-full and one fuzz job per make target run in parallel, each under 6 hours;
# stage runs make release with the gates log the gates job handed on, only when all of them passed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make tools
      - run: make web-install
      - run: cd web && npx playwright install --with-deps chromium firefox webkit
      - run: make release-gates
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gates-log
          path: bin/release-gates.log
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gates-reports
          path: |
            bin/zap/wrk/*.json
            bin/zap/wrk/*.html
            bin/zap/*.txt
            bin/zap/testssl/testssl.json
            bin/test-release.log
            web/playwright-report

  zap-full:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make zap-full
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-full-reports
          path: |
            bin/zap/wrk/*.json
            bin/zap/wrk/*.html
            bin/zap/*.txt

  fuzz:
    runs-on: ubuntu-latest
    # The largest make target fuzzes three functions for 30 minutes each (90 minutes); a target with more is split
    # (fuzz-acme runs as fuzz-acme-docs and fuzz-acme-order).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz-license, fuzz-ssh, fuzz-oidc, fuzz-nginx, fuzz-certs, fuzz-backup, fuzz-acme-docs, fuzz-acme-order, fuzz-netaddr, fuzz-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: make ${{ matrix.target }} FUZZTIME=30m
        env:
          TARGET: ${{ matrix.target }}
        run: make "$TARGET" FUZZTIME=30m
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: 'fuzz-corpus-${{ matrix.target }}', path: '**/testdata/fuzz/**' }

  stage:
    needs: [gates, zap-full, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make tools
      - run: make web-install
      # The gates log of the gates job (first line commit<TAB><the tag's commit>); make release
      # refuses it unless every gate passed on this very commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-gates-log, path: bin }
      - name: make release (unsigned stage)
        env:
          TAG: ${{ github.ref_name }}
        run: make release VERSION="${TAG#v}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unsigned-stage
          path: |
            bin/release/
            bin/release-gates.log
      - name: Sign offline
        run: echo "Sign SHA256SUMS on the offline machine (docs/release-checklist.md)"
